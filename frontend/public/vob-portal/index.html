<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eligibility Portal</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23005eb8'/%3E%3Cpath d='M14 16h14c8.837 0 16 7.163 16 16s-7.163 16-16 16H14V16z' fill='white'/%3E%3Ccircle cx='28' cy='32' r='7' fill='%23005eb8'/%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: '#1a5dad', light: '#e8eef6', dark: '#123f7e' },
            indigo: { 50:'#e8eef6',100:'#d7e2f0',200:'#b6cbe6',300:'#86b7de',400:'#4f8fce',500:'#2472c9',600:'#1a5dad',700:'#123f7e',800:'#0d2b52',900:'#0a1830' },
            blue:   { 50:'#e8eef6',100:'#d7e2f0',200:'#b6cbe6',300:'#86b7de',400:'#4f8fce',500:'#1a5dad',600:'#1a5dad',700:'#123f7e',800:'#0d2b52',900:'#0a1830' },
            sky:    { 50:'#e8eef6',100:'#d7e2f0',200:'#b6cbe6',300:'#86b7de',400:'#4f8fce',500:'#2472c9',600:'#1a5dad',700:'#123f7e' },
            teal:   { 50:'#e2f6f3',100:'#c6ece6',200:'#9fe0d6',500:'#17c3b2',600:'#0f9d8f',700:'#0f7d72' },
            gray:   { 50:'#f2f6fb',100:'#e3ebf5',200:'#cddbea',300:'#b6c4d8',400:'#8aa0b8',500:'#6b7c8f',600:'#4f6580',700:'#33506e',800:'#1c3a5c',900:'#0d2b52' },
            slate:  { 50:'#f2f6fb',100:'#e3ebf5',200:'#cddbea',300:'#b6c4d8',400:'#8aa0b8',500:'#6b7c8f',600:'#4f6580',700:'#33506e',800:'#1c3a5c',900:'#0d2b52' },
            zinc:   { 50:'#f2f6fb',100:'#e3ebf5',200:'#cddbea',300:'#b6c4d8',400:'#8aa0b8',500:'#6b7c8f',600:'#4f6580',700:'#33506e',800:'#1c3a5c',900:'#0d2b52' },
            neutral:{ 50:'#f2f6fb',100:'#e3ebf5',200:'#cddbea',300:'#b6c4d8',400:'#8aa0b8',500:'#6b7c8f',600:'#4f6580',700:'#33506e',800:'#1c3a5c',900:'#0d2b52' },
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    /* Thin scrollbars so panels feel native */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cddbea; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #8aa0b8; }
    /* Gradient partition lines */
    .grad-sep { height:2px; border:none; margin:0; background:linear-gradient(90deg,#2472c9 0%,#8b5cf6 35%,#ec4899 68%,#f59e0b 100%); }
    .grad-sep-sm { height:1px; border:none; margin:0; background:linear-gradient(90deg,#2472c9 0%,#8b5cf6 35%,#ec4899 68%,#f59e0b 100%); opacity:0.45; }
  </style>
</head>
<body class="bg-gray-50 h-screen overflow-hidden flex flex-col">
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.3/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;
    const API = (new URLSearchParams(location.search).get('api') || '').replace(/\/$/, '');  // same-origin by default; ?api=<url> to point at the VOB portal backend

    // ── Global date formatters (MM/DD/YYYY) ─────────────────────────
    const fmtMDY = (d) => {
      if (!d) return '—';
      const s = String(d);
      if (s.startsWith('9999')) return 'Ongoing';
      // Append time so Date() parses as local, not UTC midnight shifted
      const dt = new Date(s.includes('T') || s.includes(' ') ? s : s + 'T00:00:00');
      if (isNaN(dt)) return s.slice(0, 10);
      const mm   = String(dt.getMonth() + 1).padStart(2, '0');
      const dd   = String(dt.getDate()).padStart(2, '0');
      const yyyy = dt.getFullYear();
      return `${mm}/${dd}/${yyyy}`;
    };

    const fmtMDYT = (d) => {
      if (!d) return '—';
      const dt = new Date(d);
      if (isNaN(dt)) return String(d).slice(0, 16).replace('T', ' ');
      const mm   = String(dt.getMonth() + 1).padStart(2, '0');
      const dd   = String(dt.getDate()).padStart(2, '0');
      const yyyy = dt.getFullYear();
      let h      = dt.getHours();
      const min  = String(dt.getMinutes()).padStart(2, '0');
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      return `${mm}/${dd}/${yyyy} ${h}:${min} ${ampm}`;
    };

    // ── Avatar SVGs ──────────────────────────────────────────────────
    const MaleAvatar = () => (
      <svg viewBox="0 0 100 100" className="w-10 h-10 rounded-full border-2 border-blue-200 bg-blue-50">
        <circle cx="50" cy="38" r="20" fill="#93c5fd"/>
        <ellipse cx="50" cy="80" rx="30" ry="20" fill="#2472c9"/>
        <circle cx="50" cy="38" r="18" fill="#fde68a"/>
        <circle cx="43" cy="35" r="2.5" fill="#0d2b52"/>
        <circle cx="57" cy="35" r="2.5" fill="#0d2b52"/>
        <path d="M44 44 Q50 49 56 44" stroke="#c97d4e" strokeWidth="1.5" fill="none" strokeLinecap="round"/>
        <rect x="20" y="20" width="60" height="8" rx="4" fill="#5b3a1a"/>
        <path d="M30 28 Q50 15 70 28" fill="#5b3a1a"/>
      </svg>
    );

    const FemaleAvatar = () => (
      <svg viewBox="0 0 100 100" className="w-10 h-10 rounded-full border-2 border-pink-200 bg-pink-50">
        <circle cx="50" cy="80" r="28" fill="#f9a8d4"/>
        <circle cx="50" cy="38" r="18" fill="#fde68a"/>
        <circle cx="43" cy="35" r="2.5" fill="#0d2b52"/>
        <circle cx="57" cy="35" r="2.5" fill="#0d2b52"/>
        <path d="M44 44 Q50 49 56 44" stroke="#c97d4e" strokeWidth="1.5" fill="none" strokeLinecap="round"/>
        <path d="M22 30 Q50 5 78 30 Q75 20 50 18 Q25 20 22 30Z" fill="#a16207"/>
        <path d="M22 30 Q18 50 24 60" stroke="#a16207" strokeWidth="6" fill="none" strokeLinecap="round"/>
        <path d="M78 30 Q82 50 76 60" stroke="#a16207" strokeWidth="6" fill="none" strokeLinecap="round"/>
      </svg>
    );

    const UnknownAvatar = () => (
      <svg viewBox="0 0 100 100" className="w-10 h-10 rounded-full border-2 border-gray-200 bg-gray-100">
        <circle cx="50" cy="38" r="18" fill="#cddbea"/>
        <ellipse cx="50" cy="80" rx="28" ry="20" fill="#8aa0b8"/>
        <text x="50" y="44" textAnchor="middle" fontSize="20" fill="#6b7c8f">?</text>
      </svg>
    );

    // ── Utility components ───────────────────────────────────────────

    const Spinner = () => (
      <svg className="spin w-5 h-5 text-brand inline-block" fill="none" viewBox="0 0 24 24">
        <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/>
        <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
      </svg>
    );

    const Field = ({ label, value, className = '' }) => (
      <div className={`flex flex-col ${className}`}>
        <span className="text-xs text-gray-400 uppercase tracking-wide">{label}</span>
        <span className="text-sm font-medium text-gray-800">{value || '—'}</span>
      </div>
    );

    const Badge = ({ text, color = 'gray' }) => {
      const colors = {
        green : 'bg-green-100 text-green-800',
        red   : 'bg-red-100 text-red-800',
        yellow: 'bg-yellow-100 text-yellow-800',
        gray  : 'bg-gray-100 text-gray-700',
        blue  : 'bg-blue-100 text-blue-800',
      };
      return <span className={`inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold ${colors[color]}`}>{text}</span>;
    };

    const statusBadge = (status) => {
      if (status === 'Complete') return <Badge text="Complete" color="green"/>;
      if (status && status.toLowerCase().includes('error')) return <Badge text={status} color="red"/>;
      if (status && status.toLowerCase().includes('skip')) return <Badge text="Skipped" color="gray"/>;
      return <Badge text={status || '?'} color="yellow"/>;
    };

    // ── Input component ──────────────────────────────────────────────

    const Input = ({ label, value, onChange, type = 'text', placeholder, required, hint }) => (
      <div className="flex flex-col gap-0.5">
        <label className="text-[10px] font-semibold text-gray-600 uppercase tracking-wide">
          {label}{required && <span className="text-red-500 ml-0.5">*</span>}
        </label>
        <input
          type={type}
          value={value}
          onChange={e => onChange(e.target.value)}
          placeholder={placeholder}
          required={required}
          className="border border-gray-200 rounded-md px-2.5 py-1 text-xs focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition"
        />
        {hint && <span className="text-xs text-gray-400">{hint}</span>}
      </div>
    );

    // ── Member Card ──────────────────────────────────────────────────

    const MatchIcon = ({ match }) => {
      if (match === true)  return <span className="text-green-600 font-bold text-base">✓</span>;
      if (match === false) return <span className="text-red-500 font-bold text-base">✗</span>;
      return <span className="text-gray-300 text-base">—</span>;
    };

    const fmtDate = (iso) => fmtMDY(iso);

    const MemberCard = ({ data, onProceed, loading }) => {
      const { patient, subscriber, payer, comparison = [], mismatches = [], rawData } = data;
      const gender = (patient.gender || '').toUpperCase();
      const Avatar = gender.startsWith('M') ? MaleAvatar : gender.startsWith('F') ? FemaleAvatar : UnknownAvatar;
      const plans = (rawData?.plans) || [];

      // ── Financial summary from probe rawData ──────────────────────
      const plan0     = plans[0] || {};
      const benefits0 = plan0.benefitInformation || [];
      const findB0    = kw => benefits0.find(b => (b.benefitType || '').toLowerCase().includes(kw.toLowerCase()));
      const deductB   = findB0('deductible');
      const maxB      = findB0('maximum') || findB0('annual');
      const coinB     = findB0('co-insurance') || findB0('coinsurance');
      const oopB      = findB0('out of pocket') || findB0('stop loss');
      const depAgeB   = benefits0.find(b => {
        const t = (b.benefitType || '').toLowerCase();
        return (t.includes('dependent') && (t.includes('age') || t.includes('max'))) || t === 'maximum age';
      });
      const fmtM      = v => v != null ? `$${parseFloat(v).toFixed(0)}` : null;
      const fmtBen    = (b, usedLabel) => {
        if (!b) return null;
        const total   = fmtM(b.benefitAmount);
        const rem     = fmtM(b.benefitAmountRemaining);
        const applied = (b.benefitAmount != null && b.benefitAmountRemaining != null)
          ? fmtM(parseFloat(b.benefitAmount) - parseFloat(b.benefitAmountRemaining)) : null;
        if (!total && !rem) return (b.messages || []).join('; ') || null;
        const parts = [];
        if (total)   parts.push(`${total} total`);
        if (applied) parts.push(`${applied} ${usedLabel || 'applied'}`);
        if (rem)     parts.push(`${rem} remaining`);
        return parts.length ? parts.join(' | ') : null;
      };
      const deductStr     = fmtBen(deductB, 'applied');
      const maxStr        = fmtBen(maxB, 'used YTD');
      const coinPct       = coinB?.benefitPercent != null ? `${coinB.benefitPercent}%` : null;
      const oopStr        = fmtBen(oopB);
      const depAgeDisplay = depAgeB
        ? [
            depAgeB.benefitQuantity != null ? depAgeB.benefitQuantity : depAgeB.benefitAmount,
            (depAgeB.messages || []).join('; ') || '(child / student)',
          ].filter(v => v != null).join(' ')
        : null;
      const addrRaw    = (rawData?.subscriber || {}).address || {};
      const addrStr    = typeof addrRaw === 'string' ? addrRaw
        : [addrRaw.address1, addrRaw.address2,
           (addrRaw.city || addrRaw.state)
             ? `${addrRaw.city || ''}, ${addrRaw.state || ''} ${(addrRaw.postalCode || addrRaw.zipCode || '').slice(0,5)}`.trim()
             : null
          ].filter(Boolean).join(', ');
      const asOfDate   = fmtMDY(rawData?.asOfDate || rawData?.serviceDate);
      const covId      = rawData?.id || '';
      const createdAt  = fmtMDYT(rawData?.createdDate || rawData?.created);
      const coveragePeriod = plan0.coverageStartDate
        ? `${fmtMDY(plan0.coverageStartDate)} → ${fmtMDY(plan0.coverageEndDate)}`
        : null;

      // Collect all plans with coverage/term dates
      const allCoveragePlans = plans.map(p => {
        const start = fmtMDY(p.coverageStartDate || p.planStartDate || p.eligibilityStartDate || '');
        const end   = fmtMDY(p.coverageEndDate   || p.planEndDate   || '');
        const isInactive = /(inactive|terminat)/i.test(p.status || '');
        const isTerminated = end && end !== '—' && end !== 'Ongoing';
        return { status: p.status || '', insuranceType: p.insuranceType || '', description: p.description || '', start, end, isInactive, isTerminated };
      });
      const hasMultiPlans  = allCoveragePlans.length > 1;
      const inactivePlans  = allCoveragePlans.filter(p => p.isInactive);
      // Real term date: inactive plan end date, or active plan with a non-ongoing end date
      const termDate = inactivePlans.find(p => p.end && p.end !== '—')?.end
        || (!plan0.coverageEndDate?.startsWith?.('9999') ? fmtMDY(plan0.coverageEndDate) : null);

      const hasFinancials = deductStr || maxStr || coinPct || oopStr || depAgeDisplay;
      const hasMeta       = asOfDate || covId || createdAt;
      const hasMismatch   = mismatches.length > 0;
      const isActive      = plan0.statusCode === '1' || (plan0.status || '').toLowerCase().includes('active');

      // Compact row helper
      const SumRow = ({ label, value, wide }) => value ? (
        <div className={wide ? 'col-span-2' : ''}>
          <p className="text-[9px] font-semibold text-gray-400 uppercase tracking-wide leading-none mb-0.5">{label}</p>
          <p className="text-xs font-medium text-gray-800 leading-snug">{value}</p>
        </div>
      ) : null;

      return (
        <div className="fade-in bg-white rounded-xl shadow-sm border border-gray-100 p-3 space-y-2">

          {/* Coverage Status Callout */}
          <div className={`rounded-lg px-3 py-2 ${isActive ? 'bg-green-50 border border-green-200' : 'bg-red-50 border border-red-200'}`}>
            <p className={`text-sm font-bold ${isActive ? 'text-green-800' : 'text-red-800'}`}>
              Coverage Status: {plan0.status || 'Unknown'}
            </p>
            <p className={`text-[10px] mt-0.5 ${isActive ? 'text-green-700' : 'text-red-700'}`}>
              {plan0.insuranceType ? `Insurance Type: ${plan0.insuranceType}   ·   ` : ''}
              Coverage: {fmtMDY(plan0.coverageStartDate) || '—'} → {fmtMDY(plan0.coverageEndDate) || '—'}
            </p>
          </div>

          {/* PATIENT INFORMATION */}
          <div className="rounded-lg overflow-hidden border border-blue-200">
            <div className="bg-[#1a5dad] px-3 py-1.5">
              <p className="text-[9px] font-bold text-white uppercase tracking-widest">Patient Information</p>
            </div>
            <div className="grid grid-cols-2 gap-x-3 gap-y-1.5 p-2">
              <SumRow label="Full Name"     value={patient.name}/>
              <SumRow label="Date of Birth" value={patient.dob}/>
              <SumRow label="Gender"        value={gender.startsWith('F') ? 'Female' : gender.startsWith('M') ? 'Male' : patient.gender || null}/>
              <SumRow label="Relationship"  value={patient.relationship}/>
            </div>
          </div>

          {/* SUBSCRIBER / GROUP */}
          <div className="rounded-lg overflow-hidden border border-emerald-200">
            <div className="bg-[#065f46] px-3 py-1.5">
              <p className="text-[9px] font-bold text-white uppercase tracking-widest">Subscriber / Group</p>
            </div>
            <div className="grid grid-cols-2 gap-x-3 gap-y-1.5 p-2">
              <SumRow label="Subscriber Name" value={subscriber.name}/>
              <SumRow label="Member ID"       value={subscriber.memberId}/>
              {plan0.groupNumber && <SumRow label="Group Number" value={plan0.groupNumber}/>}
              {plan0.groupName   && <SumRow label="Group Name"   value={plan0.groupName}/>}
              {addrStr           && <SumRow label="Address"      value={addrStr} wide/>}
            </div>
          </div>

          {/* PAYER INFORMATION */}
          <div className="rounded-lg overflow-hidden border border-amber-200">
            <div className="bg-[#92400e] px-3 py-1.5">
              <p className="text-[9px] font-bold text-white uppercase tracking-widest">Payer Information</p>
            </div>
            <div className="grid grid-cols-2 gap-x-3 gap-y-1.5 p-2">
              <SumRow label="Payer Name" value={payer.name}/>
              <SumRow label="Payer ID"   value={payer.id}/>
            </div>
          </div>

          {/* COVERAGE & PLAN DETAILS */}
          <div className="rounded-lg overflow-hidden border border-green-300">
            <div className="bg-[#14532d] px-3 py-1.5">
              <p className="text-[9px] font-bold text-white uppercase tracking-widest">Coverage &amp; Plan Details</p>
            </div>
            <div className="grid grid-cols-2 gap-x-3 gap-y-1.5 p-2">
              {asOfDate  && <SumRow label="As-Of Date"       value={asOfDate}/>}
              {createdAt && <SumRow label="Created"          value={createdAt}/>}
              {covId     && <SumRow label="Coverage ID"      value={covId} wide/>}
              {plan0.eligibilityBeginDate && <SumRow label="Eligibility Since" value={fmtMDY(plan0.eligibilityBeginDate)} wide/>}
              {termDate && termDate !== 'Ongoing' && (
                <div className="col-span-2">
                  <p className="text-[9px] font-semibold text-red-500 uppercase tracking-wide leading-none mb-0.5">Termination / Expiry Date</p>
                  <p className="text-xs font-bold text-red-700 leading-snug">{termDate}</p>
                </div>
              )}
            </div>
            {allCoveragePlans.length > 0 && (
              <div className="border-t border-green-200">
                <table className="w-full text-[10px]">
                  <thead>
                    <tr className="bg-[#14532d] text-white">
                      <th className="text-left px-2 py-1 font-semibold">Status</th>
                      <th className="text-left px-2 py-1 font-semibold">Type</th>
                      <th className="text-left px-2 py-1 font-semibold">Effective</th>
                      <th className="text-left px-2 py-1 font-semibold">Term Date</th>
                    </tr>
                  </thead>
                  <tbody>
                    {allCoveragePlans.map((p, i) => (
                      <tr key={i} className={p.isInactive ? 'bg-red-50 text-red-700' : i % 2 === 0 ? 'bg-white' : 'bg-green-50/40'}>
                        <td className="px-2 py-1 font-medium">{p.status || '—'}</td>
                        <td className="px-2 py-1">{p.insuranceType || '—'}</td>
                        <td className="px-2 py-1">{p.start || '—'}</td>
                        <td className={`px-2 py-1 font-semibold ${p.isInactive || (p.isTerminated && p.end !== 'Ongoing') ? 'text-red-700' : 'text-gray-600'}`}>
                          {p.end || '—'}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>

          {/* ── Financials ── */}
          {hasFinancials && (
            <div className="bg-emerald-50 border border-emerald-100 rounded-lg p-2 space-y-1">
              <p className="text-[9px] font-bold text-emerald-800 uppercase tracking-widest">Financials (In-Network)</p>
              <div className="grid grid-cols-2 gap-x-3 gap-y-1.5">
                <SumRow label="Individual Deductible" value={deductStr}     wide/>
                <SumRow label="Annual Maximum"        value={maxStr}        wide/>
                <SumRow label="Dependent Max Age"     value={depAgeDisplay} wide/>
                <SumRow label="Coinsurance"           value={coinPct}/>
                <SumRow label="OOP Maximum"           value={oopStr}/>
              </div>
            </div>
          )}

          {/* ── Name/DOB match check ── */}
          {comparison.some(r => r.sent !== null) && (
            <div className="rounded-lg overflow-hidden border border-gray-200">
              <table className="w-full text-xs">
                <thead>
                  <tr className="bg-gray-50 text-[10px] text-gray-500 uppercase tracking-wide">
                    <th className="text-left px-2 py-1.5">Field</th>
                    <th className="text-left px-2 py-1.5">Sent</th>
                    <th className="text-left px-2 py-1.5">Payer Has</th>
                    <th className="text-center px-2 py-1.5 w-12">Match</th>
                  </tr>
                </thead>
                <tbody>
                  {comparison.filter(r => r.sent !== null).map((row, i) => (
                    <tr key={i} className={`${row.match === false ? 'bg-red-50' : ''}`}>
                      <td className="px-2 py-1 font-medium text-gray-700">{row.field}</td>
                      <td className="px-2 py-1 text-gray-500 font-mono">{row.sent || '—'}</td>
                      <td className={`px-2 py-1 font-mono font-semibold ${row.match === false ? 'text-red-700' : 'text-green-700'}`}>{row.payer || '—'}</td>
                      <td className="px-2 py-1 text-center"><MatchIcon match={row.match}/></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {/* ── Status ── */}
          {hasMismatch ? (
            <div className="bg-amber-50 border border-amber-200 rounded-lg p-2 space-y-0.5">
              <p className="text-[10px] font-bold text-amber-700 uppercase tracking-wide">⚠ Mismatch — update your form to match payer record</p>
              {mismatches.map((m, i) => <p key={i} className="text-xs text-amber-800">• {m}</p>)}
            </div>
          ) : (
            <div className="bg-green-50 border border-green-200 rounded-lg p-1.5 text-center">
              <p className="text-xs text-green-700 font-medium">
                {comparison.some(r => r.sent) ? '✓ All checked fields match — ready to fetch eligibility' : '✓ Member found — ready to fetch eligibility'}
              </p>
            </div>
          )}

          <button
            onClick={onProceed}
            disabled={loading}
            className="w-full bg-brand hover:bg-brand-dark text-white font-semibold py-1.5 rounded-lg text-sm transition disabled:opacity-60 flex items-center justify-center gap-2"
          >
            {loading ? <><Spinner/> Fetching Eligibility…</> : 'Proceed to Full Eligibility Check →'}
          </button>
        </div>
      );
    };

    // ── Stedi Eligibility Card ───────────────────────────────────────

    // Benefit-code → friendly category label
    const STEDI_BENEFIT_CODES = {
      '1':'Active Coverage','6':'Inactive','A':'Co-Insurance','B':'Co-Payment',
      'C':'Deductible','D':'Benefit Description','F':'Limitations',
      'G':'Other / Additional','I':'Non-Covered','L':'Primary Care Provider',
      'MC':'Maximum','MO':'Out-of-Pocket (Stop Loss)','N':'Other OOP',
      'CB':'Coverage Basis','AL':'Allowable Amount','AE':'Advance Notice',
      'UC':'Usual & Customary','AF':'Family Deductible','CF':'Co-Insurance Family',
      'EA':'Co-Insurance Active','EB':'Co-Insurance Maximum',
    };

    const StediEligibilityCard = ({ data }) => {
      if (!data || !data.rawData) return null;
      const raw      = data.rawData;
      const plan0    = (raw.plans || [])[0] || {};
      const benefits = raw.benefitsInformation || [];
      if (benefits.length === 0) return null;

      // ── helpers ─────────────────────────────────────────────
      const fmtAmt = v => v != null ? `$${parseFloat(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}` : null;
      const fmtStPct = v => {
        if (v == null) return null;
        const n = parseFloat(v);
        // Stedi sends raw decimal e.g. "0.3" = 30%
        const pct = n <= 1 ? n * 100 : n;
        return `${pct % 1 === 0 ? pct.toFixed(0) : pct.toFixed(1)}%`;
      };
      const fmtDate8 = s => {
        if (!s || s.length < 8) return s;
        return `${s.slice(4,6)}/${s.slice(6,8)}/${s.slice(0,4)}`;
      };

      // ── collect service type codes present ──────────────────
      const SVC_PRIORITY = ['30','51','52','UC','33','98','BZ','AL','1','MH'];
      const allCodes = new Set();
      benefits.forEach(b => (b.serviceTypeCodes || []).forEach(c => allCodes.add(c)));
      const svcTabs = SVC_PRIORITY.filter(c => allCodes.has(c));
      // also add any that didn't appear in priority list
      allCodes.forEach(c => { if (!SVC_PRIORITY.includes(c)) svcTabs.push(c); });

      // map code → label from first benefit that has both
      const codeLabel = {};
      benefits.forEach(b => {
        const codes = b.serviceTypeCodes || [];
        const types = b.serviceTypes || [];
        codes.forEach((c, i) => { if (!codeLabel[c] && types[i]) codeLabel[c] = types[i]; });
      });

      // ── collect all contacts from benefitsRelatedEntities ───
      const allContacts = [];
      const seenNums = new Set();
      benefits.forEach(b => {
        const ents = b.benefitsRelatedEntities || (b.benefitsRelatedEntity ? [b.benefitsRelatedEntity] : []);
        ents.forEach(ent => {
          const ci = ent.contactInformation || {};
          (ci.contacts || []).forEach(c => {
            const num = c.communicationNumber || '';
            if (num && !seenNums.has(num)) {
              seenNums.add(num);
              allContacts.push({ name: ent.entityName || '', mode: c.communicationMode || 'Phone', number: num });
            }
          });
        });
      });

      // ── PCP from code "L" benefit ───────────────────────────
      const pcpBenefit = benefits.find(b => b.code === 'L' || b.benefitCode === 'L');
      const pcpEntity  = pcpBenefit && (
        (pcpBenefit.benefitsRelatedEntities || [])[0] || pcpBenefit.benefitsRelatedEntity
      );
      const pcpName    = pcpEntity && (pcpEntity.entityName || pcpEntity.providerName || '');
      const pcpPhone   = pcpEntity && ((((pcpEntity.contactInformation || {}).contacts || [])[0] || {}).communicationNumber || '');

      // ── disclaimer from code "P" ────────────────────────────
      const disclaimerBenefit = benefits.find(b => b.code === 'P' || b.benefitCode === 'P');
      const disclaimer = disclaimerBenefit && ((disclaimerBenefit.additionalInformation || [])[0] || {}).description;

      // ── state ───────────────────────────────────────────────
      const [viewMode,  setViewMode]  = useState('service');   // 'service' | 'table'
      const [activeSvc, setActiveSvc] = useState(svcTabs[0] || '30');
      const [netFilter, setNetFilter] = useState('all');

      // ── filter helpers ──────────────────────────────────────
      const benefitsForSvc = (code) => benefits.filter(b => (b.serviceTypeCodes || []).includes(code));
      const applyNet = (list) => {
        if (netFilter === 'in')  return list.filter(b => (b.inPlanNetworkIndicator || '').toLowerCase().includes('yes') || (b.inPlanNetworkIndicator || '') === 'In-Network' || b.networkIndicator === 'In-Network');
        if (netFilter === 'out') return list.filter(b => (b.inPlanNetworkIndicator || '').toLowerCase().includes('out') || b.networkIndicator === 'Out-of-Network');
        return list;
      };

      // ── summary card builder ────────────────────────────────
      const summarize = (svcBenefits) => {
        const find = (code, level) => svcBenefits.find(b =>
          (b.code || b.benefitCode) === code &&
          (!level || (b.coverageLevelCode || '').toLowerCase().startsWith(level.toLowerCase()))
        );
        const dedInd = find('C', 'IND'); const dedFam = find('C', 'FAM');
        const copay  = svcBenefits.find(b => (b.code || b.benefitCode) === 'B');
        const coins  = svcBenefits.find(b => (b.code || b.benefitCode) === 'A');
        const oopInd = svcBenefits.find(b => (b.code || b.benefitCode) === 'G' && (b.coverageLevelCode||'') === 'IND');
        const oopFam = svcBenefits.find(b => (b.code || b.benefitCode) === 'G' && (b.coverageLevelCode||'') === 'FAM');
        const lim    = svcBenefits.find(b => (b.code || b.benefitCode) === 'F');
        return { dedInd, dedFam, copay, coins, oopInd, oopFam, lim };
      };

      // ── style helpers ───────────────────────────────────────
      const thS = {
        background:'#0d2b52', color:'#fff', padding:'5px 9px',
        textAlign:'left', fontWeight:'700', fontSize:'10px',
        whiteSpace:'nowrap', border:'1px solid #2d5a8e',
      };
      const tdS = (i, extra={}) => ({
        padding:'4px 9px', border:'1px solid #e3ebf5', fontSize:'10px',
        verticalAlign:'middle', background: i%2===0?'#fff':'#f7f9fc', ...extra,
      });
      const cardStyle = { background:'#f0f9ff', border:'1px solid #bae6fd', borderRadius:'8px', padding:'10px 14px', minWidth:'130px' };

      // ── net-indicator colour ────────────────────────────────
      const netCol = (b) => {
        const v = b.inPlanNetworkIndicator || b.networkIndicator || '';
        if (v === 'Yes' || v === 'In-Network') return '#15803d';
        if (v === 'No'  || v === 'Out-of-Network') return '#dc2626';
        return '#6b7c8f';
      };
      const netLabel = (b) => {
        const v = b.inPlanNetworkIndicator || b.networkIndicator || '';
        if (v === 'Yes') return 'In-Network';
        if (v === 'No')  return 'Out-of-Network';
        return v || '—';
      };

      // ── all notes from a list of benefits (de-duped) ───────
      const collectNotes = (list) => {
        const seen = new Set(); const out = [];
        list.forEach(b => (b.additionalInformation || []).forEach(ai => {
          if (ai.description && !seen.has(ai.description)) { seen.add(ai.description); out.push(ai.description); }
        }));
        return out;
      };

      return (
        <div className="fade-in bg-white rounded-xl shadow-sm border border-blue-100 overflow-hidden">

          {/* ── Header ── */}
          <div style={{background:'#0d2b52',padding:'8px 14px',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:'6px'}}>
            <div className="flex items-center gap-2">
              <span style={{color:'#fff',fontWeight:'800',fontSize:'12px',letterSpacing:'.5px'}}>Stedi Eligibility Details</span>
              <span style={{background:'#2472c9',color:'#fff',fontSize:'9px',fontWeight:'700',padding:'1px 7px',borderRadius:'9px'}}>{benefits.length} lines</span>
              {plan0.status && (
                <span style={{background:plan0.statusCode==='1'?'#dcfce7':'#fef3c7',color:plan0.statusCode==='1'?'#166534':'#92400e',fontSize:'9px',fontWeight:'700',padding:'1px 8px',borderRadius:'9px'}}>
                  {plan0.status}
                </span>
              )}
            </div>
            <div className="flex items-center gap-2">
              {[['service','By Service'],['table','Full Table']].map(([k,l]) => (
                <button key={k} onClick={()=>setViewMode(k)}
                  style={{fontSize:'9px',fontWeight:'700',padding:'2px 9px',borderRadius:'6px',cursor:'pointer',border:'none',
                    background:viewMode===k?'#2472c9':'#0d2b52',color:viewMode===k?'#fff':'#93c5fd'}}>
                  {l}
                </button>
              ))}
              <span style={{color:'#93c5fd',fontSize:'10px',marginLeft:'6px'}}>Net:</span>
              {[['all','All'],['in','In'],['out','Out']].map(([k,l]) => (
                <button key={k} onClick={()=>setNetFilter(k)}
                  style={{fontSize:'9px',fontWeight:'700',padding:'2px 7px',borderRadius:'6px',cursor:'pointer',border:'none',
                    background:netFilter===k?'#2472c9':'#0d2b52',color:netFilter===k?'#fff':'#93c5fd'}}>
                  {l}
                </button>
              ))}
            </div>
          </div>

          {/* ── Plan info strip ── */}
          <div className="grad-sep"/>
          <div style={{background:'#eff6ff',padding:'5px 14px',display:'flex',gap:'18px',flexWrap:'wrap',alignItems:'center'}}>
            {plan0.insuranceType   && <span style={{fontSize:'10px'}}><b style={{color:'#1a5dad'}}>Type:</b> {plan0.insuranceType}</span>}
            {plan0.groupNumber     && <span style={{fontSize:'10px'}}><b style={{color:'#1a5dad'}}>Group #:</b> {plan0.groupNumber}</span>}
            {plan0.groupName       && <span style={{fontSize:'10px'}}><b style={{color:'#1a5dad'}}>Plan:</b> {plan0.groupName}</span>}
            {plan0.coverageStartDate && <span style={{fontSize:'10px'}}><b style={{color:'#1a5dad'}}>Plan Begin:</b> {plan0.coverageStartDate}</span>}
            {plan0.eligibilityBeginDate && <span style={{fontSize:'10px'}}><b style={{color:'#1a5dad'}}>Benefit Begin:</b> {plan0.eligibilityBeginDate}</span>}
            {pcpName && <span style={{fontSize:'10px'}}><b style={{color:'#1a5dad'}}>PCP:</b> {pcpName}{pcpPhone ? ` · ${pcpPhone}` : ''}</span>}
            {data.patient && data.patient.relationship && data.patient.relationship !== 'Self' && (
              <span style={{fontSize:'10px',background:'#fef3c7',color:'#92400e',padding:'1px 6px',borderRadius:'8px',fontWeight:'700'}}>
                Dependent: {data.patient.name} ({data.patient.relationship})
              </span>
            )}
          </div>

          <div className="grad-sep"/>

          {/* ══ BY SERVICE VIEW ══════════════════════════════════ */}
          {viewMode === 'service' && (
            <div>
              {/* service type tabs */}
              <div style={{display:'flex',background:'#f8fafc',overflowX:'auto',borderBottom:'none'}}>
                {svcTabs.map(c => (
                  <button key={c} onClick={()=>setActiveSvc(c)}
                    style={{padding:'6px 12px',fontSize:'10px',fontWeight:'700',border:'none',whiteSpace:'nowrap',cursor:'pointer',
                      borderBottom:activeSvc===c?'2px solid transparent':'2px solid transparent',
                      borderImage:activeSvc===c?'linear-gradient(90deg,#2472c9,#8b5cf6,#ec4899) 1':'none',
                      color:activeSvc===c?'#0d2b52':'#6b7c8f',background:'transparent'}}>
                    {codeLabel[c] ? codeLabel[c].replace('Health Benefit Plan Coverage','Plan Coverage') : c}
                    <span style={{marginLeft:'4px',background:activeSvc===c?'#dbeafe':'#e3ebf5',color:activeSvc===c?'#1a5dad':'#8aa0b8',fontSize:'9px',fontWeight:'700',padding:'0 4px',borderRadius:'8px'}}>
                      {benefitsForSvc(c).length}
                    </span>
                  </button>
                ))}
              </div>
              <div className="grad-sep-sm"/>

              {/* service content */}
              {(() => {
                const svcList  = applyNet(benefitsForSvc(activeSvc));
                const { dedInd, dedFam, copay, coins, oopInd, oopFam, lim } = summarize(svcList);
                const notes    = collectNotes(svcList);
                const financial = svcList.filter(b => ['A','B','C','G','F','MC','MO'].includes(b.code || b.benefitCode));

                return (
                  <div style={{padding:'12px 14px'}}>
                    {/* Summary cards */}
                    <div style={{display:'flex',gap:'10px',flexWrap:'wrap',marginBottom:'12px'}}>
                      {(dedInd || dedFam) && (
                        <div style={cardStyle}>
                          <div style={{fontSize:'9px',fontWeight:'700',color:'#0369a1',marginBottom:'4px'}}>DEDUCTIBLE</div>
                          {dedInd && <div style={{fontSize:'11px'}}><span style={{color:'#6b7c8f',fontSize:'9px'}}>Ind</span> <b style={{color:'#065f46'}}>{fmtAmt(dedInd.benefitAmount)}</b></div>}
                          {dedFam && <div style={{fontSize:'11px'}}><span style={{color:'#6b7c8f',fontSize:'9px'}}>Fam</span> <b style={{color:'#065f46'}}>{fmtAmt(dedFam.benefitAmount)}</b></div>}
                        </div>
                      )}
                      {copay && (
                        <div style={cardStyle}>
                          <div style={{fontSize:'9px',fontWeight:'700',color:'#0369a1',marginBottom:'4px'}}>CO-PAY</div>
                          <div style={{fontSize:'14px',fontWeight:'800',color:'#065f46'}}>{fmtAmt(copay.benefitAmount)}</div>
                          {copay.timeQualifier && <div style={{fontSize:'9px',color:'#6b7c8f'}}>per {copay.timeQualifier}</div>}
                        </div>
                      )}
                      {coins && (
                        <div style={cardStyle}>
                          <div style={{fontSize:'9px',fontWeight:'700',color:'#0369a1',marginBottom:'4px'}}>CO-INSURANCE</div>
                          <div style={{fontSize:'14px',fontWeight:'800',color:'#1d4ed8'}}>{fmtStPct(coins.benefitPercent)}</div>
                          {coins.timeQualifier && <div style={{fontSize:'9px',color:'#6b7c8f'}}>{coins.timeQualifier}</div>}
                        </div>
                      )}
                      {(oopInd || oopFam) && (
                        <div style={cardStyle}>
                          <div style={{fontSize:'9px',fontWeight:'700',color:'#0369a1',marginBottom:'4px'}}>OOP MAX</div>
                          {oopInd && <div style={{fontSize:'11px'}}><span style={{color:'#6b7c8f',fontSize:'9px'}}>Ind</span> <b style={{color:'#065f46'}}>{fmtAmt(oopInd.benefitAmount)}</b></div>}
                          {oopFam && <div style={{fontSize:'11px'}}><span style={{color:'#6b7c8f',fontSize:'9px'}}>Fam</span> <b style={{color:'#065f46'}}>{fmtAmt(oopFam.benefitAmount)}</b></div>}
                        </div>
                      )}
                      {lim && (
                        <div style={cardStyle}>
                          <div style={{fontSize:'9px',fontWeight:'700',color:'#0369a1',marginBottom:'4px'}}>LIMIT</div>
                          {lim.benefitAmount && <div style={{fontSize:'13px',fontWeight:'800',color:'#065f46'}}>{fmtAmt(lim.benefitAmount)}</div>}
                          {lim.benefitQuantity && <div style={{fontSize:'11px',color:'#33506e'}}>{lim.benefitQuantity} {lim.quantityQualifier || ''}</div>}
                        </div>
                      )}
                    </div>

                    {/* notes + contacts aligned at bottom */}
                    {(notes.length > 0 || allContacts.length > 0 || disclaimer) && (
                      <>
                        <div className="grad-sep-sm" style={{marginTop:'8px'}}/>
                        <div style={{display:'flex',gap:'16px',flexWrap:'wrap',alignItems:'flex-start',padding:'7px 12px',background:'#fafafa'}}>
                          {notes.length > 0 && (
                            <div style={{flex:'1 1 200px',minWidth:'160px'}}>
                              <div style={{fontSize:'9px',fontWeight:'800',color:'#78350f',letterSpacing:'.5px',marginBottom:'3px',textTransform:'uppercase'}}>Notes</div>
                              {notes.map((n,i) => <p key={i} style={{fontSize:'10px',color:'#78350f',margin:'1px 0'}}>{n}</p>)}
                            </div>
                          )}
                          {(allContacts.length > 0 || disclaimer) && (
                            <div style={{flex:'1 1 200px',minWidth:'160px'}}>
                              {allContacts.length > 0 && (
                                <>
                                  <div style={{fontSize:'9px',fontWeight:'800',color:'#33506e',letterSpacing:'.5px',marginBottom:'3px',textTransform:'uppercase'}}>Contacts</div>
                                  <div style={{display:'flex',flexWrap:'wrap',gap:'8px'}}>
                                    {allContacts.map((c,i) => (
                                      <span key={i} style={{fontSize:'10px',color:'#33506e'}}>
                                        <b>{c.name}</b>{c.mode && c.mode !== 'Phone' ? <span style={{color:'#6b7c8f'}}> ({c.mode})</span> : ''}: {c.number}
                                      </span>
                                    ))}
                                  </div>
                                </>
                              )}
                              {disclaimer && (
                                <p style={{fontSize:'9px',color:'#78350f',marginTop:allContacts.length?'4px':'0'}}>{disclaimer}</p>
                              )}
                            </div>
                          )}
                        </div>
                      </>
                    )}

                    {/* financial detail table */}
                    {financial.length > 0 && (
                      <div style={{overflowX:'auto'}}>
                        <table style={{borderCollapse:'collapse',width:'100%'}}>
                          <thead>
                            <tr>
                              {['Type','Level','Network','Setting','Amount','%','Period','Auth'].map(h=>(
                                <th key={h} style={thS}>{h}</th>
                              ))}
                            </tr>
                          </thead>
                          <tbody>
                            {financial.map((b,i) => (
                              <tr key={i}>
                                <td style={tdS(i,{fontWeight:'600'})}>{b.name || b.benefitType || b.code || '—'}</td>
                                <td style={tdS(i)}>{b.coverageLevel || '—'}</td>
                                <td style={tdS(i)}>
                                  <span style={{color:netCol(b),fontWeight:'700',fontSize:'10px'}}>{netLabel(b)}</span>
                                </td>
                                <td style={tdS(i,{color:'#6b7c8f',fontSize:'9px'})}>{(b.eligibilityAdditionalInformation||{}).industry || '—'}</td>
                                <td style={tdS(i,{fontFamily:'monospace',textAlign:'right',fontWeight:'700',color:'#065f46'})}>
                                  {b.benefitAmount != null ? fmtAmt(b.benefitAmount) : '—'}
                                </td>
                                <td style={tdS(i,{fontFamily:'monospace',textAlign:'right',fontWeight:'700',color:'#1d4ed8'})}>
                                  {b.benefitPercent != null ? fmtStPct(b.benefitPercent) : '—'}
                                </td>
                                <td style={tdS(i,{color:'#6b7c8f',fontSize:'9px',whiteSpace:'nowrap'})}>{b.timeQualifier || b.timePeriodQualifier || '—'}</td>
                                <td style={tdS(i,{textAlign:'center'})}>
                                  {b.authOrCertIndicator === 'Y'
                                    ? <span style={{color:'#dc2626',fontWeight:'700',fontSize:'10px'}}>Req</span>
                                    : <span style={{color:'#8aa0b8',fontSize:'9px'}}>{b.authOrCertIndicator === 'U' ? 'Unk' : '—'}</span>}
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    )}
                    {svcList.length === 0 && (
                      <p style={{textAlign:'center',color:'#8aa0b8',fontSize:'12px',padding:'16px'}}>No benefits for this service type.</p>
                    )}
                  </div>
                );
              })()}
            </div>
          )}

          {/* ══ FULL TABLE VIEW ══════════════════════════════════ */}
          {viewMode === 'table' && (() => {
            const all = applyNet(benefits);
            return (
              <div style={{overflowX:'auto',maxHeight:'520px',overflowY:'auto'}}>
                {all.length === 0
                  ? <p style={{padding:'24px',textAlign:'center',color:'#8aa0b8',fontSize:'12px'}}>No benefit lines match the filter.</p>
                  : (
                  <table style={{borderCollapse:'collapse',width:'100%',fontSize:'10px'}}>
                    <thead style={{position:'sticky',top:0,zIndex:1}}>
                      <tr>
                        {['Type','Code','Service','Level','Network','Setting','Amount','%','Qty','Period','Auth','Notes'].map(h=>(
                          <th key={h} style={thS}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {all.map((b,i) => {
                        const svcLabel = (b.serviceTypes || []).join(', ') || (b.serviceTypeCodes||[]).join(', ') || '—';
                        const msgs     = (b.additionalInformation||[]).map(ai=>ai.description).filter(Boolean);
                        const eid      = (b.eligibilityAdditionalInformation||{}).industry || '';
                        return (
                          <tr key={i}>
                            <td style={tdS(i,{fontWeight:'600',maxWidth:'140px',wordBreak:'break-word'})}>{b.name||b.benefitType||'—'}</td>
                            <td style={tdS(i,{textAlign:'center'})}>
                              <span style={{background:'#f0f4f8',color:'#33506e',fontSize:'9px',fontWeight:'700',padding:'1px 5px',borderRadius:'4px',fontFamily:'monospace'}}>{b.code||b.benefitCode||'—'}</span>
                            </td>
                            <td style={tdS(i,{color:'#6b7c8f',maxWidth:'160px',wordBreak:'break-word'})}>{svcLabel}</td>
                            <td style={tdS(i)}>{b.coverageLevel||'—'}</td>
                            <td style={tdS(i)}>
                              <span style={{color:netCol(b),fontWeight:'700'}}>{netLabel(b)}</span>
                            </td>
                            <td style={tdS(i,{color:'#6b7c8f',fontSize:'9px'})}>{eid||'—'}</td>
                            <td style={tdS(i,{fontFamily:'monospace',textAlign:'right',fontWeight:'700',color:'#065f46'})}>
                              {b.benefitAmount != null ? fmtAmt(b.benefitAmount) : '—'}
                            </td>
                            <td style={tdS(i,{fontFamily:'monospace',textAlign:'right',fontWeight:'700',color:'#1d4ed8'})}>
                              {b.benefitPercent != null ? fmtStPct(b.benefitPercent) : '—'}
                            </td>
                            <td style={tdS(i,{textAlign:'center',color:'#33506e'})}>
                              {b.benefitQuantity != null ? `${b.benefitQuantity}${b.quantityQualifier ? ' '+b.quantityQualifier : ''}` : '—'}
                            </td>
                            <td style={tdS(i,{color:'#6b7c8f',fontSize:'9px',whiteSpace:'nowrap'})}>{b.timeQualifier||b.timePeriodQualifier||'—'}</td>
                            <td style={tdS(i,{textAlign:'center'})}>
                              {b.authOrCertIndicator === 'Y'
                                ? <span style={{color:'#dc2626',fontWeight:'700'}}>Req</span>
                                : <span style={{color:'#8aa0b8'}}>{b.authOrCertIndicator === 'U' ? 'Unk' : '—'}</span>}
                            </td>
                            <td style={tdS(i,{color:'#6b7c8f',maxWidth:'200px',wordBreak:'break-word'})}>
                              {msgs.join(' | ') || '—'}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                )}
              </div>
            );
          })()}

        </div>
      );
    };

    // ── Results Table ────────────────────────────────────────────────

    const InfoRow = ({ label, value }) => value
      ? <div className="flex flex-col"><span className="text-xs text-gray-400 uppercase tracking-wide leading-none mb-0.5">{label}</span><span className="text-sm font-semibold text-gray-800">{value}</span></div>
      : null;

    const BenefitDetail = ({ data, svcLabel }) => {
      if (!data) return null;

      const plans      = data.plans || [];
      const pat        = data.patient || {};
      const sub        = data.subscriber || {};
      const payer      = data.payer || {};
      const provider   = data.requestingProvider || {};
      const svcTypes   = data.requestedServiceType || [];
      const hasBenefits = plans.some(p => (p.benefitInformation || []).length > 0);

      return (
        <div className="fade-in space-y-3 text-sm">

          {/* ── Header strip ── */}
          {svcTypes.length > 0 && (
            <div className="flex gap-2 flex-wrap px-1">
              {svcTypes.map((s,i) => <Badge key={i} text={`${s.code} — ${s.value}`} color="blue"/>)}
            </div>
          )}

          {/* ── Member & Subscriber ── */}
          <div className="bg-white rounded-xl border border-gray-200 overflow-hidden">
            <p className="text-xs font-bold text-gray-500 uppercase tracking-wide px-3 py-2 bg-gray-50">Member / Subscriber</p>
            <div className="grad-sep"/>
            <div className="grid grid-cols-2 sm:grid-cols-3 gap-x-4 gap-y-3 px-3 py-3">
              <InfoRow label="Patient Name"    value={[pat.firstName,pat.middleName,pat.lastName].filter(Boolean).join(' ')}/>
              <InfoRow label="Member ID"       value={sub.memberId}/>
              <InfoRow label="Date of Birth"   value={fmtMDY(pat.birthDate)}/>
              <InfoRow label="Gender"          value={pat.gender}/>
              <InfoRow label="Relationship"    value={pat.subscriberRelationship}/>
              <InfoRow label="Subscriber"      value={[sub.firstName,sub.lastName].filter(Boolean).join(' ')}/>
              <InfoRow label="Payer"           value={payer.responseName || payer.name}/>
              <InfoRow label="Coverage ID"     value={data.id}/>
              <InfoRow label="Control #"       value={data.controlNumber}/>
            </div>
          </div>

          {/* ── Plans ── */}
          {plans.length === 0 && (
            <div className="bg-gray-50 rounded-xl border border-gray-200 px-4 py-3 text-xs text-gray-400 italic text-center">
              No plan data returned by payer for this service type.
            </div>
          )}

          {plans.map((plan, pi) => {
            const benefits = plan.benefitInformation || [];
            const addPayers = plan.coverageSummaryAdditionalPayers || [];
            return (
              <div key={pi} className="bg-white rounded-xl border border-gray-200 overflow-hidden">

                {/* Plan title + status */}
                <div className={`px-3 py-2.5 flex items-start justify-between gap-3 flex-wrap ${plan.statusCode==='1' ? 'bg-green-50' : 'bg-yellow-50'}`}>
                  <div>
                    <p className="font-bold text-gray-900">{plan.description || plan.insuranceType || `Plan ${pi+1}`}</p>
                    {plan.description && plan.insuranceType && <p className="text-xs text-gray-500 mt-0.5">{plan.insuranceType}</p>}
                  </div>
                  <Badge text={plan.status || '?'} color={plan.statusCode==='1' ? 'green' : 'yellow'}/>
                </div>
                <div className="grad-sep"/>

                {/* Plan fields */}
                <div className="grid grid-cols-2 sm:grid-cols-3 gap-x-4 gap-y-3 px-3 py-3">
                  <InfoRow label="Group Number"    value={plan.groupNumber}/>
                  <InfoRow label="Group Name"      value={plan.groupName}/>
                  <InfoRow label="Insurance Type"  value={plan.insuranceType}/>
                  <InfoRow label="Effective Date"  value={fmtDate(plan.coverageStartDate)}/>
                  <InfoRow label="Expiry Date"     value={fmtDate(plan.coverageEndDate)}/>
                  <InfoRow label="Coverage Level"  value={plan.coverageLevel}/>
                  <InfoRow label="Network"         value={plan.networkIndicator}/>
                  <InfoRow label="COB Code"        value={plan.coordinationOfBenefitsCode}/>
                  <InfoRow label="Plan #"          value={plan.planNumber}/>
                  <InfoRow label="Plan Type"       value={plan.planType}/>
                  <InfoRow label="HIOS Plan ID"    value={plan.hiosPlanId}/>
                  {plan.messages?.length > 0 && (
                    <div className="col-span-2 sm:col-span-3">
                      <p className="text-xs text-gray-400 uppercase tracking-wide mb-0.5">Notes</p>
                      {plan.messages.map((m,mi)=><p key={mi} className="text-sm text-gray-700">• {m}</p>)}
                    </div>
                  )}
                </div>

                {/* Other payers */}
                {addPayers.length > 0 && (
                  <div className="px-3 py-2.5 bg-purple-50 border-b border-purple-100">
                    <p className="text-xs font-bold text-purple-700 uppercase tracking-wide mb-1.5">Coordination of Benefits — Other Payers</p>
                    <div className="flex flex-wrap gap-2">
                      {addPayers.map((ap,ai) => (
                        <div key={ai} className="bg-white border border-purple-200 rounded-lg px-2.5 py-1.5 text-xs">
                          <span className="font-bold text-purple-800">{ap.name}</span>
                          {ap.primary   && <span className="ml-1.5 text-green-600 font-semibold">(Primary)</span>}
                          {ap.secondary && <span className="ml-1.5 text-blue-600 font-semibold">(Secondary)</span>}
                          {ap.tertiary  && <span className="ml-1.5 text-gray-500 font-semibold">(Tertiary)</span>}
                          {ap.thirdPartyAdministrator && <span className="ml-1.5 text-gray-400">(TPA)</span>}
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* Benefit table (when available) */}
                {benefits.length > 0 && (
                  <div className="overflow-x-auto">
                    <table className="w-full text-xs">
                      <thead>
                        <tr className="bg-gray-50 text-gray-500 text-left border-b border-gray-200">
                          <th className="px-3 py-2">Benefit Type</th>
                          <th className="px-3 py-2">Level</th>
                          <th className="px-3 py-2">Network</th>
                          <th className="px-3 py-2 text-right">Amount</th>
                          <th className="px-3 py-2 text-right">Remaining</th>
                          <th className="px-3 py-2">%</th>
                          <th className="px-3 py-2">Period</th>
                          <th className="px-3 py-2">Notes</th>
                        </tr>
                      </thead>
                      <tbody>
                        {benefits.map((b, bi) => (
                          <tr key={bi} className={`border-t border-gray-100 hover:bg-gray-50 ${bi%2===0?'':'bg-gray-50/40'}`}>
                            <td className="px-3 py-1.5 font-medium">{b.benefitType || b.coverageDescription || '—'}</td>
                            <td className="px-3 py-1.5 text-gray-500">{b.coverageLevel || '—'}</td>
                            <td className="px-3 py-1.5">
                              {b.networkIndicator==='In-Network' ? <span className="text-green-700 font-semibold">In-Network</span>
                               : b.networkIndicator==='Out-of-Network' ? <span className="text-red-600 font-semibold">Out-of-Network</span>
                               : <span className="text-gray-500">{b.networkIndicator || '—'}</span>}
                            </td>
                            <td className="px-3 py-1.5 text-right font-mono font-semibold">
                              {b.benefitAmount!=null ? `$${parseFloat(b.benefitAmount).toFixed(2)}` : '—'}
                            </td>
                            <td className="px-3 py-1.5 text-right font-mono">
                              {b.benefitAmountRemaining!=null ? `$${parseFloat(b.benefitAmountRemaining).toFixed(2)}` : '—'}
                            </td>
                            <td className="px-3 py-1.5">{b.benefitPercent!=null ? `${b.benefitPercent}%` : '—'}</td>
                            <td className="px-3 py-1.5 text-gray-400">{b.timePeriodQualifier || '—'}</td>
                            <td className="px-3 py-1.5 text-gray-400 max-w-xs">{(b.messages||[]).join('; ')||''}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            );
          })}

          {/* ── Payer limitation notice ── */}
          {!hasBenefits && plans.length > 0 && (
            <div className="bg-blue-50 border border-blue-200 rounded-xl px-4 py-3 space-y-1.5">
              <p className="text-xs font-bold text-blue-700 uppercase tracking-wide">ℹ Benefit Detail Availability</p>
              <p className="text-xs text-blue-700">
                <strong>{payer.responseName || payer.name || 'This payer'}</strong> confirms active coverage but does not transmit deductibles, copays, or coinsurance amounts through the EDI 270/271 eligibility transaction.
              </p>
              <p className="text-xs text-blue-600">
                For full benefit details contact: <strong>member services on the insurance card</strong>, or log in to the payer's provider portal.
              </p>
            </div>
          )}

          {/* ── Requesting provider (audit) ── */}
          {provider.npi && (
            <div className="bg-gray-50 rounded-xl border border-gray-200 px-3 py-2">
              <p className="text-xs text-gray-400 uppercase tracking-wide mb-1">Request Submitted By</p>
              <div className="flex flex-wrap gap-x-6 gap-y-0.5 text-xs text-gray-600">
                <span>NPI: <strong>{provider.npi}</strong></span>
                <span>Type: <strong>{provider.type}</strong></span>
                <span>Name: <strong>{provider.lastName}{provider.firstName ? ', '+provider.firstName : ''}</strong></span>
                <span>POS: <strong>{provider.placeOfService} ({provider.placeOfServiceCode})</strong></span>
              </div>
            </div>
          )}
        </div>
      );
    };

    const downloadJson = (data, filename) => {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    };

    const ResultsTable = ({ results, skipped, memberData, cachedCount = 0, freshCount = 0 }) => {
      const [expanded, setExpanded] = useState({});
      const toggle = code => setExpanded(p => ({ ...p, [code]: !p[code] }));

      const handleDownload = () => {
        const payload = {
          downloadedAt: new Date().toISOString(),
          member: memberData || null,
          eligibilityResults: results.map(r => ({
            serviceTypeCode : r.code,
            serviceTypeLabel: r.label,
            status          : r.status,
            coverageId      : r.coverageId || null,
            data            : r.data || null,
          })),
          skipped,
        };
        const ts = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
        downloadJson(payload, `eligibility-${ts}.json`);
      };

      const completeCount = results.filter(r => r.status === 'Complete').length;

      return (
        <div className="fade-in space-y-2">
          <div className="flex items-center justify-between gap-3">
            <h3 className="font-semibold text-gray-700 text-sm uppercase tracking-wide">
              Eligibility Results
              <span className="ml-2 text-xs font-normal text-gray-400 normal-case">{completeCount} of {results.length} complete</span>
              {cachedCount > 0 && <span className="ml-2 inline-flex items-center gap-1 text-[10px] font-bold bg-violet-50 text-violet-600 border border-violet-200 px-2 py-0.5 rounded-full normal-case">{cachedCount} cached · {freshCount} fetched</span>}
            </h3>
            <button
              onClick={handleDownload}
              className="inline-flex items-center gap-1.5 bg-white border border-gray-200 hover:border-brand hover:text-brand text-gray-600 text-xs font-semibold px-3 py-1.5 rounded-lg transition shadow-sm"
            >
              <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
              </svg>
              Download Raw JSON
            </button>
          </div>
          <div className="rounded-xl overflow-hidden border border-gray-200 shadow-sm">
            <table className="w-full text-sm">
              <thead>
                <tr className="bg-gray-50 text-gray-500 text-xs uppercase tracking-wide">
                  <th className="text-left px-3 py-2 w-16">Code</th>
                  <th className="text-left px-3 py-2">Service Type</th>
                  <th className="text-left px-3 py-2 w-36">Status</th>
                  <th className="text-right px-3 py-2 w-20">Details</th>
                </tr>
              </thead>
              <tbody>
                {results.map((r, i) => (
                  <React.Fragment key={r.code}>
                    {i > 0 && <tr><td colSpan={4} style={{padding:0}}><div className="grad-sep-sm"/></td></tr>}
                    <tr className={`hover:bg-gray-50 transition ${i % 2 === 0 ? '' : 'bg-gray-50/50'}`}>
                      <td className="px-3 py-2 font-mono font-semibold text-gray-600">{r.code}</td>
                      <td className="px-3 py-2 text-gray-800">{r.label}</td>
                      <td className="px-3 py-2">
                        {statusBadge(r.status)}
                        {r.fromCache && <span className="ml-1 inline-flex text-[9px] font-bold bg-violet-50 text-violet-500 border border-violet-200 px-1.5 py-0.5 rounded-full">cached</span>}
                      </td>
                      <td className="px-3 py-2 text-right">
                        {r.status === 'Complete' && r.data && (
                          <button
                            onClick={() => toggle(r.code)}
                            className="text-brand text-xs font-semibold hover:underline"
                          >
                            {expanded[r.code] ? 'Hide' : 'View'}
                          </button>
                        )}
                      </td>
                    </tr>
                    {expanded[r.code] && (
                      <tr>
                        <td colSpan="4" className="px-3 pb-3">
                          <BenefitDetail data={r.data}/>
                        </td>
                      </tr>
                    )}
                  </React.Fragment>
                ))}
                {skipped.map((s, i) => (
                  <tr key={s.code} className="border-t border-gray-100 bg-gray-50/50 opacity-60">
                    <td className="px-3 py-2 font-mono text-gray-400">{s.code}</td>
                    <td className="px-3 py-2 text-gray-400">{s.label}</td>
                    <td className="px-3 py-2"><Badge text="Skipped" color="gray"/></td>
                    <td className="px-3 py-2 text-right text-xs text-gray-400">{s.reason}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    };

    // ── Cache helpers ────────────────────────────────────────────────

    const fmtTs = iso => fmtMDYT(iso);

    const CacheBadge = ({ fromCache, cachedAt, expiresAt, onRefresh }) => {
      if (!cachedAt) return null;
      const stale = expiresAt && new Date(expiresAt) < new Date();
      return (
        <div className={`flex items-center gap-2 px-2.5 py-1 rounded-lg border text-xs ${stale ? 'bg-amber-50 border-amber-200 text-amber-700' : 'bg-violet-50 border-violet-200 text-violet-700'}`}>
          <svg className="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8l1 12a2 2 0 002 2h8a2 2 0 002-2l1-12"/>
          </svg>
          <span className="font-semibold">{fromCache ? (stale ? 'Stale cache' : 'From cache') : 'Saved to cache'}</span>
          <span className="opacity-60">·</span>
          <span>{stale ? 'Expired' : `Expires ${fmtTs(expiresAt)}`}</span>
          {onRefresh && (
            <button onClick={onRefresh} className="ml-auto font-bold hover:underline opacity-80 hover:opacity-100 whitespace-nowrap">
              Refresh from API →
            </button>
          )}
        </div>
      );
    };

    // ── Cached Patients Panel ────────────────────────────────────────

    const CachedPatientsPanel = ({ onSelect }) => {
      const [open, setOpen]         = useState(true);
      const [patients, setPatients] = useState([]);
      const [loading, setLoading]   = useState(false);

      const load = async () => {
        setLoading(true);
        try {
          const res  = await fetch(`${API}/api/cache`);
          const data = await res.json();
          setPatients(data.patients || []);
        } catch { setPatients([]); }
        finally { setLoading(false); }
      };

      const del = async (key) => {
        await fetch(`${API}/api/cache/${encodeURIComponent(key)}`, { method: 'DELETE' });
        setPatients(p => p.filter(x => x.cacheKey !== key));
      };

      const clearAll = async () => {
        if (!confirm('Clear ALL patient history?')) return;
        await fetch(`${API}/api/cache`, { method: 'DELETE' });
        setPatients([]);
      };

      // Load on mount and whenever panel opens
      useEffect(() => { load(); }, []);
      useEffect(() => { if (open) load(); }, [open]);

      return (
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
          <button
            onClick={() => setOpen(o => !o)}
            className="w-full flex items-center justify-between px-3 py-2 text-xs font-semibold text-gray-700 hover:bg-gray-50 transition"
          >
            <span className="flex items-center gap-2">
              <svg className="w-4 h-4 text-violet-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 2m6-2a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
              Patient History
              {patients.length > 0 && <span className="text-xs font-bold bg-violet-100 text-violet-700 px-2 py-0.5 rounded-full">{patients.length}</span>}
            </span>
            <span className={`transition-transform duration-200 ${open ? 'rotate-180' : ''}`}>▾</span>
          </button>

          {open && (
            <>
            <div className="grad-sep-sm"/>
            <div>
              {loading ? (
                <div className="flex items-center gap-2 px-4 py-3 text-xs text-gray-400"><Spinner/> Loading…</div>
              ) : patients.length === 0 ? (
                <p className="px-4 py-3 text-xs text-gray-400 italic">No history yet — successful lookups appear here automatically.</p>
              ) : (
                <>
                  <div className="divide-y divide-gray-50 max-h-64 overflow-y-auto">
                    {patients.map(p => (
                      <div
                        key={p.cacheKey}
                        className="flex items-start gap-2 px-3 py-2.5 hover:bg-violet-50 group cursor-pointer"
                        onClick={() => onSelect(p)}
                      >
                        <div className="flex-1 min-w-0">
                          <p className="text-sm font-semibold text-gray-800 truncate">{p.patientName || p.memberId}</p>
                          <p className="text-xs text-gray-500 truncate">{p.payerName || p.payerId} · {p.memberId}</p>
                          {p.memberDob && <p className="text-[10px] text-gray-400">DOB: {p.memberDob}</p>}
                          <div className="flex items-center gap-2 mt-0.5">
                            <span className={`inline-flex text-[10px] font-bold px-1.5 py-0.5 rounded-full border ${p.isStale ? 'bg-amber-50 border-amber-200 text-amber-700' : 'bg-green-50 border-green-200 text-green-700'}`}>
                              {p.isStale ? 'Stale' : 'Fresh'}
                            </span>
                            <span className="text-[10px] text-gray-400">{p.serviceCount} svc · {fmtTs(p.fetchedAt)}</span>
                          </div>
                        </div>
                        <div className="flex gap-1 flex-shrink-0">
                          <button
                            onClick={e => { e.stopPropagation(); onSelect(p); }}
                            className="text-[10px] font-bold text-brand border border-brand rounded px-1.5 py-0.5 hover:bg-brand-light whitespace-nowrap"
                          >
                            Load ↩
                          </button>
                          <button
                            onClick={e => { e.stopPropagation(); del(p.cacheKey); }}
                            className="text-[10px] font-bold text-red-500 border border-red-200 rounded px-1.5 py-0.5 hover:bg-red-50"
                          >
                            ✕
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                  <div className="grad-sep-sm"/>
                  <div className="flex items-center justify-between px-4 py-2">
                    <span className="text-[10px] text-gray-400">Click a row or Load ↩ to auto-fill the form</span>
                    <button onClick={clearAll} className="text-xs text-red-500 hover:text-red-700 font-semibold hover:underline">
                      Clear all
                    </button>
                  </div>
                </>
              )}
            </div>
            </>
          )}
        </div>
      );
    };

    // ── Eligibility Checker Tab ──────────────────────────────────────

    const SERVICE_TYPE_OPTIONS = [
      { code: '30', label: 'Health Benefit Plan Coverage' },
      { code: '23', label: 'Diagnostic Dental' },
      { code: '24', label: 'Periodontics' },
      { code: '25', label: 'Restorative' },
      { code: '26', label: 'Endodontics' },
      { code: '27', label: 'Maxillofacial Prosthetics' },
      { code: '28', label: 'Adjunctive Dental Services' },
      { code: '33', label: 'Dental Accident' },
      { code: '35', label: 'Prosthodontics' },
      { code: '36', label: 'Oral Surgery' },
      { code: '37', label: 'Dental Implants' },
      { code: '38', label: 'Dental Routine Exam' },
      { code: '39', label: 'Dental X-Ray' },
      { code: '40', label: 'Vision (Optometry)' },
      { code: '41', label: 'Frames' },
      { code: '47', label: 'Immunizations' },
      { code: '98', label: 'Physician Visit - Office: Sick' },
      { code: '1',  label: 'Medical Care' },
      { code: '12', label: 'Durable Medical Equipment Purchase' },
      { code: 'MH', label: 'Mental Health' },
      { code: 'UC', label: 'Urgent Care' },
      { code: 'AL', label: 'Vision (Optometry)' },
      { code: 'BZ', label: 'Psychiatric' },
      { code: 'AK', label: 'Home Health Aide' },
      { code: 'BB', label: 'Prescription Drug' },
    ];

    // CDT (D-code) range → Availity service type code(s)
    // CPT (5-digit) → medical service types
    const CDT_MAP = [
      { from: 100,  to: 999,  types: ['23'] },         // D01xx–D09xx  Diagnostic Dental
      { from: 100,  to: 199,  types: ['38'] },         // D01xx         Oral Evaluations → Routine Exam
      { from: 200,  to: 399,  types: ['39'] },         // D02xx–D03xx  Radiographic → Dental X-Ray
      { from: 1000, to: 1999, types: ['38'] },         // D10xx–D19xx  Preventive → Routine Exam
      { from: 2000, to: 2999, types: ['25'] },         // D20xx–D29xx  Restorative
      { from: 3000, to: 3999, types: ['26'] },         // D30xx–D39xx  Endodontics
      { from: 4000, to: 4999, types: ['24'] },         // D40xx–D49xx  Periodontics
      { from: 5000, to: 5899, types: ['35'] },         // D50xx–D58xx  Prosthodontics Removable
      { from: 5900, to: 5999, types: ['27'] },         // D59xx         Maxillofacial Prosthetics
      { from: 6000, to: 6999, types: ['37'] },         // D60xx–D69xx  Implants
      { from: 6200, to: 6999, types: ['35'] },         // D62xx–D69xx  Prosthodontics Fixed (also)
      { from: 7000, to: 7999, types: ['36'] },         // D70xx–D79xx  Oral Surgery
      { from: 8000, to: 8999, types: ['33'] },         // D80xx–D89xx  Orthodontics → Dental Accident catch-all
      { from: 9000, to: 9999, types: ['28'] },         // D90xx–D99xx  Adjunctive
    ];

    function mapCodesToServiceTypes(codes) {
      const types = new Set(['30']);  // Health Benefit Plan Coverage — always included
      for (const code of codes) {
        const upper = code.toUpperCase().trim();
        if (/^D(\d{4})$/.test(upper)) {
          const num = parseInt(upper.slice(1), 10);
          for (const { from, to, types: t } of CDT_MAP) {
            if (num >= from && num <= to) t.forEach(x => types.add(x));
          }
        } else if (/^\d{5}$/.test(upper)) {
          // CPT medical code
          const num = parseInt(upper, 10);
          types.add('1');   // Medical Care

        } else if (/^[A-Z]{2,3}$/.test(upper)) {
          // Direct X12 service type alpha code (e.g. MH, UC, AL, BZ)
          types.add(upper);
        }
      }
      return [...types].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));

      if (/^[A-Z]{2,3}$/.test(u)) return u; // direct alpha service type code
      const n = parseInt(u, 10);
      if (n >= 70000 && n <= 79999) return '62';
      if (n >= 80000 && n <= 89999) return '5';
      if (n >= 90000 && n <= 99199) return '64';
      if (n >= 99200 && n <= 99499) return '98';
      if (n >= 10000 && n <= 69999) return '2';
      return '30';
    };

    const PA_COLOR = { 'No': 'text-green-600', 'Possible': 'text-amber-500', 'Yes': 'text-red-600' };
    const PA_BG    = { 'No': 'bg-green-50 border-green-200', 'Possible': 'bg-amber-50 border-amber-200', 'Yes': 'bg-red-50 border-red-200' };

    const CoverageChip = ({ text }) => {
      if (!text) return <span className="text-gray-300">—</span>;
      const t = text.toLowerCase();
      const cls = t === 'covered'
        ? 'bg-green-100 text-green-700 border-green-200'
        : t.includes('verify')
        ? 'bg-orange-100 text-orange-700 border-orange-200'
        : t.includes('if') || t.includes('criteria') || t.includes('necessary') || t.includes('qualifying')
        ? 'bg-blue-50 text-blue-700 border-blue-200'
        : 'bg-gray-100 text-gray-600 border-gray-200';
      return (
        <span className={`inline-flex items-center text-[10px] font-semibold px-2 py-0.5 rounded-full border ${cls}`}>
          {text}
        </span>
      );
    };

    const CptCdtTable = ({ codes, eligResults, memberVerified, aiResults, aiActionFlags, aiProvider, aiLoading, form, onReloadAI }) => {
      if (!codes || codes.length === 0) return null;
      if (!memberVerified?.found) return null;

      // Build svcMap from API results
      const svcMap = {};
      (eligResults?.results || []).forEach(r => {
        if (r.status === 'Complete' && r.data?.plans?.length > 0) svcMap[r.code] = r.data;
      });
      const hasAPI = Object.keys(svcMap).length > 0;

      const getBenefit = (data, keyword) => {
        if (!data) return null;
        for (const plan of (data.plans || [])) {
          const m = (plan.benefitInformation || [])
            .find(b => (b.benefitType || '').toLowerCase().includes(keyword.toLowerCase()));
          if (m) return m;
        }
        return null;
      };
      const getPlan = data => (data?.plans || [])[0] || null;
      const fmtAmt  = v => v != null ? `$${parseFloat(v).toFixed(2)}` : null;

      const rows = codes.map(raw => {
        const code  = raw.toUpperCase().trim();
        const ai    = aiResults && aiResults[code];   // AI result — highest priority
        const ref   = CDT_REFERENCE[code] || {};
        const svc   = codeToServiceType(code);
        const data  = svcMap[svc] || svcMap['30'] || svcMap['98'] || null;
        const plan  = getPlan(data);

        // API-derived benefit fields
        const deduct = getBenefit(data, 'deductible');
        const copay  = getBenefit(data, 'co-payment') || getBenefit(data, 'copay');
        const coins  = getBenefit(data, 'co-insurance') || getBenefit(data, 'coinsurance');
        const oop    = getBenefit(data, 'out of pocket') || getBenefit(data, 'stop loss');
        const auth   = getBenefit(data, 'prior authorization') || getBenefit(data, 'prior-auth');
        const refBen = getBenefit(data, 'referral');

        const apiInsPct = coins?.benefitPercent;

        // Priority order: AI → live API → static reference
        const estInsPays = ai?.estInsPays
          || (apiInsPct != null ? `${apiInsPct}%` : '—');
        const estPatPays = ai?.estPatientPays
          || (apiInsPct != null ? `${100 - apiInsPct}%` : '—');
        const paLikely = ai?.paLikely
          || (auth ? 'Yes' : (hasAPI ? 'No' : null));

        return {
          code,
          description    : ai?.description    || ref.description    || code,
          benefitClass   : ai?.benefitClass   || ref.benefitClass   || '—',
          coverageStatus : ai?.coverageStatus || ref.coverageStatus || (plan ? plan.status : null),
          planStatus     : plan ? { text: plan.status, statusCode: plan.statusCode } : null,
          estInsPays,
          estPatPays,
          paLikely,
          copay       : (ai?.copay && ai.copay !== 'null') ? ai.copay
                        : fmtAmt(copay ? copay.benefitAmount : null) || 'N/A',
          deductRem   : (ai?.deductibleRem && ai.deductibleRem !== 'null') ? ai.deductibleRem
                        : (() => {
                            if (!deduct) return 'N/A';
                            const rem   = deduct.benefitAmountRemaining != null ? parseFloat(deduct.benefitAmountRemaining) : null;
                            const total = deduct.benefitAmount           != null ? parseFloat(deduct.benefitAmount)           : null;
                            if (rem != null && total != null) return `$${rem.toFixed(2)} / $${total.toFixed(2)}`;
                            if (rem   != null) return `$${rem.toFixed(2)} rem.`;
