                              <p className="text-[10px] text-gray-400 uppercase tracking-wide mb-0.5">Referral</p>
                              <PaStatusBadge value={m.referralRequired}/>
                            </div>
                          </div>
                        </div>
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-x-4 gap-y-1 text-xs text-gray-500">
                          {m.lineOfBusiness && <div><span className="text-gray-400">Line of Business:</span> {m.lineOfBusiness}</div>}
                          {m.planGroup      && <div><span className="text-gray-400">Plan/Group:</span> {m.planGroup}</div>}
                          {m.state          && <div><span className="text-gray-400">State:</span> {m.state}</div>}
                          {m.delegate       && <div><span className="text-gray-400">Delegate/UM Vendor:</span> {m.delegate}</div>}
                          {m.effectiveDate  && <div><span className="text-gray-400">Effective:</span> {m.effectiveDate}</div>}
                          {m.endDate        && <div><span className="text-gray-400">End Date:</span> {m.endDate}</div>}
                        </div>
                        {m.notes && <p className="text-xs text-gray-500 mt-2 italic">{m.notes}</p>}
                      </div>
                    ))}
                  </div>
                )}
              </div>

              {/* Source / confidence panel */}
              <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 space-y-2">
                <p className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Source &amp; Confidence</p>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-1.5 text-xs text-gray-600">
                  {result.source?.prSource && (
                    <div className="md:col-span-2"><span className="text-gray-400">PA Rules Source:</span> {result.source.prSource}</div>
                  )}
                  {result.source?.realTimeCheck && (
                    <div className="md:col-span-2"><span className="text-gray-400">Real-time / Member-level Check:</span> {result.source.realTimeCheck}</div>
                  )}
                  {result.source?.confidence && (
                    <div><span className="text-gray-400">Confidence:</span> {result.source.confidence}</div>
                  )}
                  {result.source?.lastRefresh && (
                    <div><span className="text-gray-400">Last List Refresh:</span> {result.source.lastRefresh}</div>
                  )}
                  {result.source?.notes && (
                    <div className="md:col-span-2"><span className="text-gray-400">Notes:</span> {result.source.notes}</div>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // ── SQLite Cache Viewer Tab ──────────────────────────────────────

    const SQLiteCacheTab = () => {
      const [rows, setRows]             = useState([]);
      const [loading, setLoading]       = useState(false);
      const [selected, setSelected]     = useState(null);
      const [jsonLoading, setJsonLoading] = useState(false);
      const [activeSection, setActiveSection] = useState('patientInfo');
      const [filter, setFilter]         = useState('');
      const [reportCounts, setReportCounts] = useState({});     // { cacheKey → count }
      const [selectedReports, setSelectedReports] = useState([]); // saved reports for viewed patient
      const [reportsLoading, setReportsLoading]   = useState(false);

      const loadReportCounts = () => {
        fetch(`${API}/api/reports/summary`)
          .then(r => r.ok ? r.json() : { summary: [] })
          .then(d => {
            const m = {};
            (d.summary || []).forEach(s => { m[s.cacheKey] = s.count; });
            setReportCounts(m);
          })
          .catch(() => {});
      };

      const load = () => {
        setLoading(true);
        fetch(`${API}/api/cache`)
          .then(r => r.json())
          .then(d => setRows(d.patients || []))
          .catch(console.error)
          .finally(() => setLoading(false));
        loadReportCounts();
      };

      useEffect(() => { load(); }, []);

      const viewRow = (row) => {
        setSelected(null);
        setSelectedReports([]);
        setJsonLoading(true);
        fetch(`${API}/api/cache/${encodeURIComponent(row.cacheKey)}/json`)
          .then(r => r.json())
          .then(d => { setSelected(d); setActiveSection('patientInfo'); })
          .catch(console.error)
          .finally(() => setJsonLoading(false));
        // Load saved reports for this patient
        setReportsLoading(true);
        fetch(`${API}/api/reports/${encodeURIComponent(row.cacheKey)}`)
          .then(r => r.ok ? r.json() : { reports: [] })
          .then(d => setSelectedReports(d.reports || []))
          .catch(() => {})
          .finally(() => setReportsLoading(false));
      };

      const deleteSavedRpt = (id, cacheKey) => {
        fetch(`${API}/api/reports/by-id/${id}`, { method: 'DELETE' })
          .then(() => {
            setSelectedReports(rs => rs.filter(r => r.id !== id));
            setReportCounts(m => ({ ...m, [cacheKey]: Math.max(0, (m[cacheKey] || 1) - 1) }));
          })
          .catch(() => {});
      };

      const dlSavedCSV = (rpt) => {
        const escape = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
        const lines  = [escape(`${rpt.patientName || ''} — ${rpt.payerName || ''} — ${fmtMDYT(rpt.createdAt)}`)];
        lines.push(rpt.columns.map(escape).join(','));
        (rpt.rows || []).forEach(row => lines.push(rpt.columns.map(c => escape(row[c] ?? '')).join(',')));
        if (rpt.notes && rpt.notes.length) { lines.push(''); rpt.notes.forEach(n => lines.push(escape(n))); }
        const url = URL.createObjectURL(new Blob([lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' }));
        const a = Object.assign(document.createElement('a'), { href: url, download: `vob-${rpt.createdAt?.slice(0,10)}.csv` });
        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
      };

      const dlSavedExcel = (rpt) => {
        if (!window.XLSX) return;
        const XLSX = window.XLSX;
        const wb   = XLSX.utils.book_new();
        const ws   = XLSX.utils.aoa_to_sheet([
          [`${rpt.patientName || ''} — ${rpt.payerName || ''}`, fmtMDYT(rpt.createdAt)],
          rpt.prompt ? [`Prompt: ${rpt.prompt}`, ''] : [],
          [],
          rpt.columns,
          ...(rpt.rows || []).map(r => rpt.columns.map(c => r[c] ?? '')),
        ].filter(r => r !== null));
        XLSX.utils.book_append_sheet(wb, ws, 'VOB Report');
        if (rpt.notes && rpt.notes.length) {
          XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Notes'], ...rpt.notes.map(n => [n])]), 'Notes');
        }
        XLSX.writeFile(wb, `vob-${rpt.createdAt?.slice(0,10)}.xlsx`);
      };

      const dlSavedPDF = async (rpt) => {
        if (!window.jspdf || !window.jspdf.jsPDF) return;
        // Pull the same flat member-details shape (and mismatches) that the
        // live AI Report and Batch PDFs use, so saved-report downloads render
        // identically instead of the old ad-hoc layout.
        let md = {}, mismatches = [];
        try {
          const d = await fetch(`${API}/api/cache/${encodeURIComponent(rpt.cacheKey)}/member-details`).then(r => r.ok ? r.json() : {});
          md = d.memberDetails || {};
          mismatches = d.mismatches || [];
        } catch (e) {}
        if (!md.patientName) md.patientName = rpt.patientName || 'Patient';
        if (!md.payerName)   md.payerName   = rpt.payerName || '';

        const doc = buildVobReportPdf(md, { columns: rpt.columns, rows: rpt.rows, notes: rpt.notes }, {
          subtitle1: `Generated: ${fmtMDYT(rpt.createdAt)}   |   Report Date: ${fmtMDYT(rpt.createdAt)}${rpt.codes && rpt.codes.length ? '   |   Codes: ' + rpt.codes.join(', ') : ''}`,
          mismatches,
        });
        doc.save(`vob-${rpt.createdAt?.slice(0,10)}.pdf`);
      };

      const fetchAndDownload = (e, cacheKey, format) => {
        e.stopPropagation();
        fetch(`${API}/api/reports/${encodeURIComponent(cacheKey)}`).then(r => r.ok ? r.json() : { reports: [] })
          .then((rptData) => {
            const reports = rptData.reports || [];
            if (reports.length === 0) return;
            const latest = reports[reports.length - 1];
            if (format === 'pdf')        dlSavedPDF(latest);
            else if (format === 'excel') dlSavedExcel(latest);
          }).catch(() => {});
      };

      const filtered = filter
        ? rows.filter(r =>
            [r.patientName, r.memberId, r.payerId, r.payerName, r.cacheKey]
              .join(' ').toLowerCase().includes(filter.toLowerCase()))
        : rows;

      const freshCount = rows.filter(r => !r.isStale).length;
      const staleCount = rows.filter(r => r.isStale).length;
      const totalSvcs  = rows.reduce((s, r) => s + (r.serviceCount || 0), 0);

      const thS = {
        background:'#0d2b52', color:'#fff', padding:'6px 10px',
        textAlign:'left', fontWeight:'700', fontSize:'11px',
        whiteSpace:'nowrap', border:'1px solid #2d5a8e',
      };
      const tdS = (ri, extra = {}) => ({
        padding:'5px 10px', border:'1px solid #e3ebf5',
        whiteSpace:'nowrap', verticalAlign:'middle', fontSize:'12px',
        background: ri % 2 === 0 ? '#fff' : '#f7f9fc', ...extra,
      });

      const sections = selected ? [
        { key: 'patientInfo', label: 'Patient Info',  data: selected.patientInfo },
        { key: 'services',    label: `Services (${Object.keys(selected.services || {}).length})`, data: selected.services },
        { key: 'skipped',    label: `Skipped (${(selected.skipped || []).length})`, data: selected.skipped },
        { key: 'reports',    label: `AI Reports (${selectedReports.length})`, data: null },
        { key: 'full',       label: 'Full Record',   data: selected },
      ] : [];

      return (
        <div className="p-4 space-y-4">
          {/* Stats */}
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
            {[
              { label: 'Cached Members',   value: rows.length,  color: 'text-[#0d2b52]' },
              { label: 'Fresh (< 24h)',    value: freshCount,   color: 'text-green-600' },
              { label: 'Stale / Expired',  value: staleCount,   color: 'text-red-500'   },
              { label: 'Service Records',  value: totalSvcs,    color: 'text-purple-600'},
            ].map(s => (
              <div key={s.label} className="bg-white rounded-xl p-3 shadow-sm border border-gray-100 text-center">
                <div className={`text-2xl font-bold ${s.color}`}>{s.value}</div>
                <div className="text-[10px] text-gray-500 mt-0.5">{s.label}</div>
              </div>
            ))}
          </div>

          {/* Toolbar */}
          <div className="flex items-center gap-3 flex-wrap">
            <input
              type="text"
              placeholder="Filter by name, member ID, payer…"
              value={filter}
              onChange={e => setFilter(e.target.value)}
              className="border border-gray-200 rounded-lg px-3 py-1.5 text-xs flex-1 min-w-[200px] focus:outline-none focus:ring-2"
            />
            <button onClick={load}
              className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold bg-[#0d2b52] text-white hover:bg-[#14304e] transition">
              {loading ? 'Loading…' : '↺ Refresh'}
            </button>
            <span className="text-xs text-gray-400">{filtered.length} of {rows.length} entries</span>
          </div>

          {/* Members table */}
          <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div className="overflow-x-auto">
              <table style={{borderCollapse:'collapse', width:'100%'}}>
                <thead>
                  <tr>
                    {['#','Cache Key','Patient Name','Member ID','Payer','Services','AI Reports','Cached At','Expires At','Status','Report PDF','Actions'].map(h => (
                      <th key={h} style={thS}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {filtered.length === 0 ? (
                    <tr>
                      <td colSpan={12} style={{textAlign:'center', padding:'32px', color:'#8aa0b8', fontSize:'13px'}}>
                        {rows.length === 0
                          ? 'No cached records yet — run an eligibility check first.'
                          : 'No matches for filter.'}
                      </td>
                    </tr>
                  ) : filtered.map((row, i) => (
                    <tr key={row.cacheKey}
                      className="hover:bg-blue-50 cursor-pointer"
                      onClick={() => viewRow(row)}
                    >
                      <td style={tdS(i, {color:'#8aa0b8'})}>{i + 1}</td>
                      <td style={tdS(i, {fontFamily:'monospace', fontSize:'11px', color:'#6b7c8f'})}>{row.cacheKey}</td>
                      <td style={tdS(i, {fontWeight:'600'})}>{row.patientName || '—'}</td>
                      <td style={tdS(i, {fontFamily:'monospace'})}>{row.memberId}</td>
                      <td style={tdS(i)}>{row.payerName || row.payerId}</td>
                      <td style={tdS(i, {textAlign:'center'})}>
                        <span style={{
                          display:'inline-block', padding:'1px 8px', borderRadius:'9px',
                          fontSize:'11px', fontWeight:'700', background:'#ede9fe', color:'#5b21b6',
                        }}>{row.serviceCount}</span>
                      </td>
                      <td style={tdS(i, {textAlign:'center'})}>
                        {(reportCounts[row.cacheKey] || 0) > 0 ? (
                          <span style={{
                            display:'inline-block', padding:'1px 8px', borderRadius:'9px',
                            fontSize:'11px', fontWeight:'700', background:'#dbeafe', color:'#1d4ed8',
                          }}>{reportCounts[row.cacheKey]}</span>
                        ) : (
                          <span style={{color:'#cddbea', fontSize:'11px'}}>—</span>
                        )}
                      </td>
                      <td style={tdS(i, {fontSize:'11px', color:'#33506e'})}>{fmtMDYT(row.fetchedAt)}</td>
                      <td style={tdS(i, {fontSize:'11px', color:'#33506e'})}>{fmtMDYT(row.expiresAt)}</td>
                      <td style={tdS(i)}>
                        <span style={{
                          display:'inline-block', padding:'1px 7px', borderRadius:'9px', fontSize:'10px', fontWeight:'700',
                          background: row.isStale ? '#fee2e2' : '#dcfce7',
                          color:      row.isStale ? '#dc2626' : '#15803d',
                        }}>
                          {row.isStale ? '⏰ Expired' : '✓ Fresh'}
                        </span>
                      </td>
                      <td style={tdS(i, {textAlign:'center', whiteSpace:'nowrap'})}>
                        {(reportCounts[row.cacheKey] || 0) > 0 ? (
                          <button onClick={e => fetchAndDownload(e, row.cacheKey, 'pdf')}
                            title={`Download latest PDF report (${reportCounts[row.cacheKey]} saved)`}
                            style={{padding:'2px 10px', borderRadius:'6px', fontSize:'11px', fontWeight:'800', cursor:'pointer', border:'1px solid #fca5a5', background:'#fee2e2', color:'#dc2626', letterSpacing:'.3px'}}>
                            PDF
                          </button>
                        ) : (
                          <span style={{color:'#cddbea', fontSize:'11px'}}>—</span>
                        )}
                      </td>
                      <td style={tdS(i, {whiteSpace:'nowrap'})}>
                        <div style={{display:'flex', gap:'4px', alignItems:'center'}}>
                          <button onClick={e => { e.stopPropagation(); viewRow(row); }}
                            title="View JSON"
                            className="px-2 py-0.5 rounded-md text-[11px] font-bold bg-indigo-50 text-indigo-700 hover:bg-indigo-100 border border-indigo-200 transition">
                            {`{ }`}
                          </button>
                          {(reportCounts[row.cacheKey] || 0) > 0 && (
                            <button onClick={e => fetchAndDownload(e, row.cacheKey, 'excel')}
                              title={`Download latest Excel report (${reportCounts[row.cacheKey]} saved)`}
                              style={{padding:'1px 7px', borderRadius:'4px', fontSize:'10px', fontWeight:'800', cursor:'pointer', border:'1px solid #86efac', background:'#dcfce7', color:'#15803d', letterSpacing:'.3px'}}>
                              XLS
                            </button>
                          )}
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* JSON Viewer */}
          {(jsonLoading || selected) && (
            <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
              {/* Header */}
              <div className="flex items-center justify-between px-4 py-2.5 bg-gray-900">
                <div className="flex items-center gap-3 flex-wrap">
                  <span className="text-sm font-bold text-white">SQLite Record</span>
                  {selected && (
                    <>
                      <span className="text-xs text-gray-300 font-mono">{selected.cacheKey}</span>
                      <span style={{
                        padding:'1px 7px', borderRadius:'9px', fontSize:'10px', fontWeight:'700',
                        background: selected.isStale ? '#fee2e2' : '#dcfce7',
                        color:      selected.isStale ? '#dc2626' : '#15803d',
                      }}>
                        {selected.isStale ? '⏰ Expired' : '✓ Fresh'}
                      </span>
                      <span className="text-xs text-gray-400">Cached: {fmtMDYT(selected.fetchedAt)}</span>
                      <span className="text-xs text-gray-400">Expires: {fmtMDYT(selected.expiresAt)}</span>
                    </>
                  )}
                  {jsonLoading && <svg className="w-4 h-4 text-gray-400 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>}
                </div>

            <button

            >
              {loading ? (

                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>

                <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>

          {/* Log table */}
          <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div className="overflow-x-auto">

          {/* JSON Viewer panel */}
          {(jsonLoading || selectedLog) && (
            <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
              <div className="flex items-center justify-between px-4 py-2.5 bg-gray-900">
                <div className="flex items-center gap-3">
                  <span className="text-sm font-bold text-white">Response JSON</span>
                  {selectedLog && (
                    <>
                      <span className="text-xs text-gray-400">{selectedLog.action}</span>
                      <span className="text-xs text-gray-400">·</span>

                    </>
                  )}
                  {jsonLoading && <svg className="w-4 h-4 text-gray-400 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>}
                </div>
                <button
                  onClick={() => setSelectedLog(null)}
                  className="text-gray-400 hover:text-white text-lg leading-none"
                >×</button>
              </div>
              <div className="overflow-auto" style={{maxHeight:'520px', background:'#1e1e2e'}}>
                <pre style={{
                  padding:'16px', margin:0, fontSize:'11px', lineHeight:'1.6',

        </div>
      );

    // ── AI Custom Report Tab ─────────────────────────────────────────

    const AIReportTab = ({ eligData, memberData, codes }) => {
      const DEFAULT_PROMPT =
        'Create a detailed benefits summary table for each procedure code listed. ' +
        'Columns: Code, Description, Benefit Class, Coverage Status, Est. Ins. Pays, ' +
        'Est. Patient Pays (copay / coinsurance), Deductible Remaining, OOP Remaining, ' +
        'Prior Auth Required, IN / OON. ' +
        'Then add action notes for the billing team at the bottom.';

      const [prompt, setPrompt]               = useState(DEFAULT_PROMPT);
      const [loading, setLoading]             = useState(false);
      const [result, setResult]               = useState(null);
      const [error, setError]                 = useState(null);
      const [sourceMode, setSourceMode]       = useState('db');   // 'db' | 'session'
      const [cacheRecords, setCacheRecords]   = useState([]);
      const [selectedKey, setSelectedKey]     = useState('');
      const [fullCacheDetail, setFullCacheDetail] = useState(null);
      const [savedReports, setSavedReports]   = useState([]);
      const [savedLoading, setSavedLoading]   = useState(false);
      const [showSaved, setShowSaved]         = useState(false);

      const loadSavedReports = (key) => {
        if (!key) return;
        setSavedLoading(true);
        fetch(`${API}/api/reports/${encodeURIComponent(key)}`)
          .then(r => r.ok ? r.json() : { reports: [] })
          .then(d => setSavedReports(d.reports || []))
          .catch(() => {})
          .finally(() => setSavedLoading(false));
      };

      // Load summary list of cached patients
      useEffect(() => {
        fetch(`${API}/api/cache`)
          .then(r => r.json())
          .then(d => {
            const pts = d.patients || [];
            setCacheRecords(pts);
            if (pts.length > 0 && !selectedKey) setSelectedKey(pts[0].cacheKey);
          })
          .catch(() => {});
      }, []);

      // Load full detail + saved reports when selected key changes
      useEffect(() => {
        if (!selectedKey || sourceMode !== 'db') return;
        setFullCacheDetail(null);
        fetch(`${API}/api/cache/${encodeURIComponent(selectedKey)}/json`)
          .then(r => r.ok ? r.json() : null)
          .then(d => setFullCacheDetail(d))
          .catch(() => {});
        loadSavedReports(selectedKey);
      }, [selectedKey, sourceMode]);

      const canGenerate = sourceMode === 'db' ? !!selectedKey : !!(eligData || memberData);

      const generate = () => {
        if (!canGenerate) return;
        setLoading(true);
        setError(null);
        const controller = new AbortController();
        const tid = setTimeout(() => controller.abort(), 240000);

        const isDb    = sourceMode === 'db';
        const url     = isDb ? `${API}/api/ai/report-from-db` : `${API}/api/ai/custom-report`;
        const body    = isDb
          ? { cacheKey: selectedKey, userPrompt: prompt, codes: codes || [] }
          : { eligibilityData: eligData, memberData, userPrompt: prompt, codes: codes || [] };

        fetch(url, {
          method : 'POST',
          headers: { 'Content-Type': 'application/json' },
          signal : controller.signal,
          body   : JSON.stringify(body),
        })
          .then(async r => {
            const ct = r.headers.get('content-type') || '';
            if (!ct.includes('application/json')) {
              const text = await r.text();
              throw new Error(`Server returned HTTP ${r.status}${r.status === 502 || r.status === 504 ? ' — request timed out, try again' : ''}: ${text.replace(/<[^>]+>/g,'').trim().slice(0,200)}`);
            }
            return r.json();
          })
          .then(data => {
            if (data.detail) { setError(data.detail); return; }
            setResult(data);
            // Auto-save generated report to SQLite
            const key = sourceMode === 'db' ? selectedKey : '';
            if (key) {
              const saveBody = {
                cacheKey:    key,
                reportType:  'ai_report',
                prompt,
                codes:       codes || [],
                columns:     data.columns || [],
                rows:        data.rows    || [],
                notes:       data.notes   || [],
                actionFlags: [],
                model:       data.model   || '',
                patientName: data.patient || '',
                payerName:   data.payer   || '',
              };
              fetch(`${API}/api/reports/save`, {
                method : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body   : JSON.stringify(saveBody),
              }).then(() => loadSavedReports(key)).catch(() => {});
            }
          })
          .catch(e => setError(e.name === 'AbortError' ? 'Request timed out after 4 min — try again' : e.message))
          .finally(() => { clearTimeout(tid); setLoading(false); });
      };

      const selRec = cacheRecords.find(r => r.cacheKey === selectedKey);

      // Build a comprehensive member details object from ALL available fields
      const getMemberDetails = () => {
        let pi = {}, rawData = {}, cacheKey = '', fetchedAt = '', expiresAt = '', isStaleVal = false, services = {}, skippedSvcs = [];

        if (sourceMode === 'db') {
          if (!fullCacheDetail && !selRec) return null;
          pi          = (fullCacheDetail && fullCacheDetail.patientInfo) || {};
          rawData     = pi.rawData || {};
          cacheKey    = fullCacheDetail?.cacheKey    || selRec?.cacheKey    || '';
          fetchedAt   = fullCacheDetail?.fetchedAt   || selRec?.fetchedAt   || '';
          expiresAt   = fullCacheDetail?.expiresAt   || selRec?.expiresAt   || '';
          isStaleVal  = fullCacheDetail?.isStale     ?? selRec?.isStale     ?? false;
          services    = fullCacheDetail?.services    || {};
          skippedSvcs = fullCacheDetail?.skipped     || [];
        } else {
          if (!memberData) return null;
          pi      = memberData;
          rawData = memberData.rawData || {};
        }

        const pat    = pi.patient    || {};
        const sub    = pi.subscriber || {};
        const pay    = pi.payer      || {};
        const rawSub = rawData.subscriber || {};
        const rawPat = rawData.patient    || {};
        const rawPay = rawData.payer      || {};
        const plan0  = (rawData.plans || [])[0] || {};

        // Address from raw subscriber
        const addrRaw = rawSub.address || {};
        const addrStr = typeof addrRaw === 'string' ? addrRaw
          : [
              addrRaw.address1 || addrRaw.line1 || addrRaw.addressLine1,
              addrRaw.address2 || addrRaw.line2,
              (addrRaw.city || addrRaw.state || addrRaw.stateCode)
                ? [addrRaw.city, (addrRaw.state || addrRaw.stateCode), (addrRaw.postalCode || addrRaw.zipCode || '').slice(0,5)].filter(Boolean).join(', ')
                : null,
            ].filter(Boolean).join(', ');

        // Date helpers
        const fmtD  = d => String(d || '').startsWith('9999') ? 'Ongoing / No End Date' : fmtMDY(d);
        const fmtDT = d => fmtMDYT(d);

        // Payer disclaimer note
        const payerNote = (plan0.payerNotes || []).find(n => n.typeCode === 'P' || n.message);

        // Gender
        const genderRaw = pat.gender || rawPat.gender || rawSub.gender || '';
        const gender = genderRaw.toUpperCase().startsWith('F') ? 'Female'
                     : genderRaw.toUpperCase().startsWith('M') ? 'Male'
                     : genderRaw || '—';

        // Group
        const groupNumber = sub.groupNumber || plan0.groupNumber || rawSub.groupNumber || '—';
        const groupName   = sub.groupName   || plan0.groupName   || rawSub.groupName   || '—';

        // Skipped service types
        const skippedStr = skippedSvcs.length
          ? skippedSvcs.map(s => `${s.code} – ${s.label || s.reason || ''}`).join('; ')
          : 'None';

        // Benefit counts from plan
        const benefitCount = (plan0.benefitInformation || plan0.benefitsInformation || plan0.benefits || []).length;

        // Coverage ID, As-Of, Created
        const coverageId = rawData.id || '—';
        const asOfDate   = fmtMDY(rawData.asOfDate || rawData.serviceDate) || '—';
        const createdAt  = fmtMDYT(rawData.createdDate || rawData.created) || '—';

        return {
          // ── Patient ──
          patientName   : pat.name || [pi._formFirstName, pi._formLastName].filter(Boolean).join(' ') || '—',
          firstName     : pi._formFirstName || rawPat.firstName  || rawSub.firstName  || '—',
          lastName      : pi._formLastName  || rawPat.lastName   || rawSub.lastName   || '—',
          middleName    : rawPat.middleName || rawSub.middleName || '—',
          dateOfBirth   : pat.dob || pi._formDob || fmtD(rawPat.birthDate || rawSub.birthDate) || '—',
          gender,
          relationship  : pat.relationship || rawPat.subscriberRelationship || '—',
          // ── Subscriber / Member ──
          memberId      : sub.memberId || rawSub.memberId || pi.memberId || '—',
          subscriberName: sub.name     || [rawSub.firstName, rawSub.middleName, rawSub.lastName].filter(Boolean).join(' ') || '—',
          groupNumber,
          groupName,
          address       : addrStr || '—',
          // ── Payer ──
          payerName     : pay.name || rawPay.responseName || rawPay.name || '—',
          payerId       : pay.id   || rawPay.payerId || rawPay.responsePayerId || '—',
          payerResponseName: rawPay.responseName || '—',
