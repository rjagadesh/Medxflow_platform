            body: (rpt.rows || []).map(r => rpt.columns.map(c => r[c] ?? '')),
            styles: { fontSize: 7, cellPadding: 2 },
            headStyles: { fillColor: [26, 58, 92], textColor: 255, fontStyle: 'bold' },
            alternateRowStyles: { fillColor: [247, 249, 252] },
            margin: { left: M, right: M },
          });
          y = doc.lastAutoTable.finalY + 6;
        }
        if (rpt.notes && rpt.notes.length) {
          doc.setFontSize(8);
          doc.setFont('helvetica', 'bold');
          doc.setTextColor(26, 58, 92);
          doc.text('Action Items / Notes', M, y); y += 5;
          doc.setFont('helvetica', 'normal');
          doc.setTextColor(50, 50, 50);
          rpt.notes.forEach(n => { doc.text(`• ${n}`, M + 2, y, { maxWidth: W - M * 2 - 2 }); y += 5; });
        }
        doc.save(`vob-report-${rpt.createdAt?.slice(0,10) || 'saved'}.pdf`);
      };

      return (
        <div className="p-4 space-y-4 max-w-[1600px]">

          {/* Data source selector */}
          <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4 space-y-3">
            <h2 className="text-sm font-bold text-gray-700">Data Source</h2>
            <div className="flex gap-3">
              <button
                onClick={() => setSourceMode('db')}
                className={`px-3 py-1.5 rounded-lg text-xs font-semibold border transition ${sourceMode === 'db' ? 'bg-[#0d2b52] text-white border-[#0d2b52]' : 'bg-white text-gray-600 border-gray-200 hover:border-gray-400'}`}
              >
                SQLite Cache
              </button>
              <button
                onClick={() => setSourceMode('session')}
                className={`px-3 py-1.5 rounded-lg text-xs font-semibold border transition ${sourceMode === 'session' ? 'bg-[#0d2b52] text-white border-[#0d2b52]' : 'bg-white text-gray-600 border-gray-200 hover:border-gray-400'}`}
              >
                Current Session
              </button>
            </div>

            {sourceMode === 'db' && (
              <div className="space-y-2">
                {cacheRecords.length === 0
                  ? <p className="text-xs text-amber-600">No cached records found — run an eligibility check first.</p>
                  : (
                    <div className="flex items-center gap-3 flex-wrap">
                      <select
                        value={selectedKey}
                        onChange={e => setSelectedKey(e.target.value)}
                        className="border border-gray-200 rounded-lg px-2.5 py-1.5 text-xs focus:outline-none focus:ring-2 max-w-[480px] w-full"
                      >
                        {cacheRecords.map(r => (
                          <option key={r.cacheKey} value={r.cacheKey}>
                            {r.patientName || r.memberId} — {r.payerName} ({r.serviceCount} svc) {r.isStale ? '⚠ stale' : ''}
                          </option>
                        ))}
                      </select>
                      {selRec && (
                        <span className="text-[10px] text-gray-400">
                          ID: {selRec.memberId} · Fetched: {new Date(selRec.fetchedAt).toLocaleString()}
                        </span>
                      )}
                    </div>
                  )
                }
                <p className="text-xs text-blue-700 bg-blue-50 border border-blue-200 rounded px-2 py-1">
                  Reads raw eligibility JSON directly from SQLite — no pre-parsed VOB required.
                </p>
              </div>
            )}

            {sourceMode === 'session' && !eligData && !memberData && (
              <p className="text-xs text-amber-600">⚠ No session data — run an eligibility check in the Eligibility tab first.</p>
            )}
          </div>

          {/* Prompt panel */}
          <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4 space-y-3">
            <div className="flex items-center justify-between">
              <h2 className="text-sm font-bold text-gray-700">AI Custom Report Generator</h2>
              <span className="text-xs text-gray-400">GPT-5.5 · {result?.model || 'gpt-5.5'}</span>
            </div>
            <p className="text-xs text-gray-500">
              Describe the table or analysis you need. GPT-4.5 will build it from the raw eligibility JSON
              stored in the selected source above.
            </p>
            <textarea
              value={prompt}
              onChange={e => setPrompt(e.target.value)}
              rows={4}
              className="w-full border border-gray-200 rounded-lg p-2.5 text-xs resize-y focus:outline-none focus:ring-2 focus:border-transparent"
              style={{fontFamily:'inherit'}}
              placeholder="e.g. Create a table showing procedure codes, coverage status, copay, deductible, and patient responsibility..."
            />
            <div className="flex items-center gap-3 flex-wrap">
              <button
                onClick={generate}
                disabled={!canGenerate || loading}
                className="inline-flex items-center gap-1.5 px-4 py-1.5 rounded-lg text-xs font-bold bg-[#0d2b52] text-white hover:bg-[#14304e] transition disabled:opacity-50 disabled:cursor-not-allowed"
              >
                {loading ? (
                  <>
                    <svg className="w-3.5 h-3.5 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                    </svg>
                    Generating…
                  </>
                ) : (
                  <>
                    <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z"/>
                    </svg>
                    Generate Report
                  </>
                )}
              </button>
              {result && !loading && (
                <button onClick={() => setResult(null)} className="text-xs text-gray-400 hover:text-gray-600 underline">
                  Clear
                </button>
              )}
            </div>
          </div>

          {/* Error */}
          {error && (
            <div className="bg-red-50 border border-red-200 rounded-lg p-3 text-xs text-red-700">{error}</div>
          )}

          {/* Saved Reports section */}
          {sourceMode === 'db' && selectedKey && (
            <div className="bg-white rounded-xl shadow-sm border border-indigo-100 overflow-hidden">
              <div
                className="flex items-center justify-between px-4 py-2.5 cursor-pointer select-none"
                style={{background:'#312e81'}}
                onClick={() => setShowSaved(s => !s)}
              >
                <div className="flex items-center gap-2">
                  <span className="text-white font-bold text-xs">Saved AI Reports</span>
                  {savedLoading
                    ? <svg className="w-3.5 h-3.5 text-indigo-300 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                    : <span style={{background:'#4f46e5', color:'#e0e7ff', fontSize:'10px', fontWeight:'700', padding:'1px 7px', borderRadius:'9px'}}>{savedReports.length}</span>
                  }
                </div>
                <span className="text-indigo-300 text-xs">{showSaved ? '▲ Hide' : '▼ Show'}</span>
              </div>
              {showSaved && (
                <div className="p-3 space-y-2">
                  {savedReports.length === 0 ? (
                    <p className="text-xs text-gray-400 text-center py-4">No saved reports for this patient yet — generate one above and it will be auto-saved.</p>
                  ) : savedReports.map((rpt, i) => (
                    <div key={rpt.id} className="border border-indigo-100 rounded-lg overflow-hidden">
                      <div className="flex items-start justify-between px-3 py-2 bg-indigo-50">
                        <div className="flex-1 min-w-0">
                          <div className="flex items-center gap-2 flex-wrap">
                            <span className="text-[10px] font-bold text-indigo-700 bg-indigo-100 px-2 py-0.5 rounded-full">{rpt.reportType}</span>
                            <span className="text-[10px] text-gray-500">{fmtMDYT(rpt.createdAt)}</span>
                            <span className="text-[10px] text-gray-400">{rpt.model}</span>
                            {rpt.codes && rpt.codes.length > 0 && (
                              <span className="text-[10px] text-purple-600">{rpt.codes.length} codes</span>
                            )}
                            <span className="text-[10px] text-green-700">{(rpt.rows || []).length} rows</span>
                          </div>
                          {rpt.prompt && (
                            <p className="text-[10px] text-gray-600 mt-1 truncate max-w-[500px]" title={rpt.prompt}>{rpt.prompt}</p>
                          )}
                        </div>
                        <div className="flex items-center gap-1 ml-2 flex-shrink-0">
                          <button onClick={() => { setResult({columns:rpt.columns, rows:rpt.rows, notes:rpt.notes, model:rpt.model, patient:rpt.patientName, payer:rpt.payerName, source:'sqlite'}); setPrompt(rpt.prompt || prompt); }}
                            className="px-2 py-0.5 rounded text-[10px] font-bold bg-blue-600 text-white hover:bg-blue-700">
                            Load
                          </button>
                          {[
                            {label:'CSV',   fn:() => downloadSavedCSV(rpt)},
                            {label:'Excel', fn:() => downloadSavedExcel(rpt)},
                            {label:'PDF',   fn:() => downloadSavedPDF(rpt)},
                          ].map(({label, fn}) => (
                            <button key={label} onClick={fn}
                              className="px-2 py-0.5 rounded text-[10px] font-bold bg-gray-100 text-gray-700 hover:bg-gray-200 border border-gray-200">
                              {label}
                            </button>
                          ))}
                          <button onClick={() => { if (confirm('Delete this saved report?')) deleteSavedReport(rpt.id); }}
                            className="px-2 py-0.5 rounded text-[10px] font-bold bg-red-50 text-red-600 hover:bg-red-100 border border-red-200">
                            Del
                          </button>
                        </div>
                      </div>
                      {rpt.columns && rpt.columns.length > 0 && (
                        <div className="px-3 py-1.5 text-[10px] text-gray-500 bg-white">
                          Columns: {rpt.columns.join(' · ')}
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* Member Details card — shown once a report is generated */}
          {result && (() => {
            const md = getMemberDetails();
            if (!md) return null;

            const DC = ({ label, value, wide, highlight }) => (
              <div className={wide ? 'col-span-2' : ''} style={{display:'flex', flexDirection:'column', gap:'2px'}}>
                <span style={{fontSize:'9px', fontWeight:'700', color:'#6b7c8f', textTransform:'uppercase', letterSpacing:'0.6px', lineHeight:1}}>{label}</span>
                <span style={{fontSize:'11px', fontWeight:'600', color: highlight ? '#065f46' : '#0d2b52', lineHeight:'1.4', wordBreak:'break-word'}}>{value || '—'}</span>
              </div>
            );

            const SectionHdr = ({ icon, title, color = '#0d2b52' }) => (
              <div style={{display:'flex', alignItems:'center', gap:'6px', padding:'5px 12px',
                background: color, borderRadius:'6px', marginBottom:'8px'}}>
                <span style={{color:'#bfdbfe', fontSize:'13px'}}>{icon}</span>
                <span style={{color:'#fff', fontWeight:'700', fontSize:'10px', textTransform:'uppercase', letterSpacing:'0.8px'}}>{title}</span>
              </div>
            );

            const grid2 = {display:'grid', gridTemplateColumns:'1fr 1fr', gap:'8px 16px', marginBottom:'4px'};
            const grid4 = {display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap:'8px 16px', marginBottom:'4px'};

            const statusColor = md.coverageStatus?.toLowerCase().includes('active') ? '#065f46'
                              : md.coverageStatus?.toLowerCase().includes('inactive') ? '#991b1b' : '#0d2b52';

            return (
              <div className="bg-white rounded-xl shadow-sm border border-blue-100 overflow-hidden">
                {/* Card header */}
                <div style={{background:'#0d2b52', padding:'9px 16px', display:'flex', alignItems:'center', gap:'8px'}}>
                  <svg width="14" height="14" fill="none" stroke="#93c5fd" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                  </svg>
                  <span style={{color:'#fff', fontWeight:'700', fontSize:'12px', letterSpacing:'0.3px'}}>Member / Lookup Details</span>
                  {result.source === 'sqlite' && (
                    <span style={{background:'#2563eb', color:'#bfdbfe', padding:'1px 8px', borderRadius:'9999px', fontSize:'9px', fontWeight:'700', marginLeft:'4px'}}>SQLite</span>
                  )}
                  {md.isStale?.startsWith('Yes') && (
                    <span style={{background:'#dc2626', color:'#fff', padding:'1px 8px', borderRadius:'9999px', fontSize:'9px', fontWeight:'700', marginLeft:'4px'}}>⚠ Stale</span>
                  )}
                </div>

                <div style={{padding:'14px 16px', display:'flex', flexDirection:'column', gap:'14px'}}>

                  {/* Coverage Status banner */}
                  <div style={{background: md.coverageStatus?.toLowerCase().includes('active') ? '#d1fae5' : '#fee2e2',
                    border:`1px solid ${md.coverageStatus?.toLowerCase().includes('active') ? '#6ee7b7' : '#fca5a5'}`,
                    borderRadius:'8px', padding:'8px 14px', display:'flex', alignItems:'center', gap:'10px'}}>
                    <span style={{fontSize:'16px'}}>{md.coverageStatus?.toLowerCase().includes('active') ? '✅' : '❌'}</span>
                    <div>
                      <p style={{fontSize:'9px', fontWeight:'700', color:'#33506e', textTransform:'uppercase', letterSpacing:'0.6px', margin:0}}>Coverage Status</p>
                      <p style={{fontSize:'13px', fontWeight:'700', color:statusColor, margin:0}}>{md.coverageStatus} {md.statusCode ? `(Code: ${md.statusCode})` : ''}</p>
                    </div>
                    {md.insuranceType && (
                      <div style={{marginLeft:'auto'}}>
                        <p style={{fontSize:'9px', fontWeight:'700', color:'#33506e', textTransform:'uppercase', letterSpacing:'0.6px', margin:0}}>Insurance Type</p>
                        <p style={{fontSize:'12px', fontWeight:'600', color:'#0d2b52', margin:0}}>{md.insuranceType}</p>
                      </div>
                    )}
                  </div>

                  {/* Row 1 — Patient | Subscriber in two columns */}
                  <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'14px'}}>

                    {/* Patient Information */}
                    <div style={{background:'#f8fafc', borderRadius:'8px', padding:'10px 12px', border:'1px solid #e2e8f0'}}>
                      <SectionHdr icon="👤" title="Patient Information" color="#1a5dad"/>
                      <div style={grid2}>
                        <DC label="Full Name"         value={md.patientName}/>
                        <DC label="Member ID"         value={md.memberId}/>
                        <DC label="First Name"        value={md.firstName}/>
                        <DC label="Last Name"         value={md.lastName}/>
                        {md.middleName !== '—' && <DC label="Middle Name" value={md.middleName}/>}
                        <DC label="Date of Birth"     value={md.dateOfBirth}/>
                        <DC label="Gender"            value={md.gender}/>
                        <DC label="Relationship"      value={md.relationship}/>
                      </div>
                    </div>

                    {/* Subscriber / Group */}
                    <div style={{background:'#f8fafc', borderRadius:'8px', padding:'10px 12px', border:'1px solid #e2e8f0'}}>
                      <SectionHdr icon="👥" title="Subscriber / Group" color="#065f46"/>
                      <div style={grid2}>
                        <DC label="Subscriber Name"  value={md.subscriberName}/>
                        <DC label="Member ID"        value={md.memberId}/>
                        <DC label="Group Number"     value={md.groupNumber}/>
                        <DC label="Group Name"       value={md.groupName}/>
                        {md.address !== '—' && <DC label="Address" value={md.address} wide/>}
                      </div>
                    </div>
                  </div>

                  {/* Row 2 — Payer | Coverage Dates */}
                  <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'14px'}}>

                    {/* Payer */}
                    <div style={{background:'#fffbeb', borderRadius:'8px', padding:'10px 12px', border:'1px solid #fde68a'}}>
                      <SectionHdr icon="🏦" title="Payer Information" color="#92400e"/>
                      <div style={grid2}>
                        <DC label="Payer Name"         value={md.payerName}/>
                        <DC label="Payer ID"           value={md.payerId}/>
                        {md.payerResponseName !== '—' && md.payerResponseName !== md.payerName &&
                          <DC label="Response Name"    value={md.payerResponseName}/>}
                        {md.payerResponseId !== '—' && md.payerResponseId !== md.payerId &&
                          <DC label="Response Payer ID" value={md.payerResponseId}/>}
                      </div>
                    </div>

                    {/* Coverage Dates */}
                    <div style={{background:'#f0fdf4', borderRadius:'8px', padding:'10px 12px', border:'1px solid #bbf7d0'}}>
                      <SectionHdr icon="📅" title="Coverage Dates" color="#14532d"/>
                      <div style={grid2}>
                        <DC label="Coverage Start"      value={md.coverageStart}/>
                        <DC label="Coverage End"        value={md.coverageEnd}/>
                        <DC label="Eligibility Begin"   value={md.eligibilityBegin}/>
                        <DC label="As-Of Date"          value={md.asOfDate}/>
                        <DC label="Coverage Period"     value={md.coveragePeriod} wide/>
                      </div>
                    </div>
                  </div>

                  {/* Row 3 — Plan Details | Provider + System */}
                  <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'14px'}}>

                    {/* Plan Details */}
                    <div style={{background:'#eff6ff', borderRadius:'8px', padding:'10px 12px', border:'1px solid #bfdbfe'}}>
                      <SectionHdr icon="📋" title="Plan Details" color="#1e3a8a"/>
                      <div style={grid2}>
                        <DC label="Plan Description"   value={md.planDescription}/>
                        <DC label="Benefit Lines"      value={md.benefitLineCount}/>
                        <DC label="Services Fetched"   value={String(md.serviceCount)}/>
                        <DC label="Probe Service Type" value={md.probeServiceType}/>
                        {md.skippedServices !== 'None' &&
                          <DC label="Skipped Services" value={md.skippedServices} wide/>}
                        {md.payerDisclaimer !== '—' &&
                          <DC label="Payer Disclaimer" value={md.payerDisclaimer} wide/>}
                      </div>
                    </div>

                    {/* Provider + System */}
                    <div style={{background:'#faf5ff', borderRadius:'8px', padding:'10px 12px', border:'1px solid #e9d5ff'}}>
                      <SectionHdr icon="🔬" title="Provider &amp; System" color="#4c1d95"/>
                      <div style={grid2}>
                        <DC label="Provider NPI"      value={md.providerNpi}/>
                        <DC label="Coverage ID"       value={md.coverageId}/>
                        <DC label="Created At"        value={md.createdAt}/>
                        <DC label="Fetched At"        value={md.fetchedAt}/>
                        <DC label="Expires At"        value={md.expiresAt}/>
                        <DC label="Cache Status"      value={md.isStale}
                          highlight={!md.isStale?.startsWith('Yes')}/>
                        {sourceMode === 'db' && md.cacheKey &&
                          <DC label="Cache Key" value={md.cacheKey} wide/>}
                      </div>
                    </div>
                  </div>

                  {/* Data Quality row */}
                  {md.mismatches !== 'None' && (
                    <div style={{background:'#fff7ed', borderRadius:'8px', padding:'8px 12px', border:'1px solid #fed7aa'}}>
                      <SectionHdr icon="⚠️" title="Data Mismatches" color="#9a3412"/>
                      <p style={{fontSize:'11px', color:'#7c2d12', fontWeight:'500', margin:0}}>{md.mismatches}</p>
                    </div>
                  )}

                </div>
              </div>
            );
          })()}

          {/* Generated table */}
          {result && result.columns && result.columns.length > 0 && (
            <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
              <div className="overflow-x-auto">
                <table style={{borderCollapse:'collapse', width:'100%'}}>
                  <thead>
                    <tr>
                      {result.columns.map((col, i) => (
                        <th key={i} style={thStyle}>{col}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {(result.rows || []).map((row, ri) => (
                      <tr key={ri}>
                        {result.columns.map((col, ci) => (
                          <td key={ci} style={tdStyle(ri)}>
                            {row[col] !== undefined && row[col] !== null && row[col] !== '' ? row[col] : '—'}
                          </td>
                        ))}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

              {/* Notes */}
              {result.notes && result.notes.length > 0 && (
                <div style={{padding:'12px 16px', borderTop:'2px solid #0d2b52', background:'#f0f4f8'}}>
                  <p style={{fontWeight:'700', fontSize:'11px', marginBottom:'6px', color:'#0d2b52'}}>Action Items / Notes</p>
                  {result.notes.map((note, i) => (
                    <p key={i} style={{fontSize:'11px', color:'#33506e', marginBottom:'3px', lineHeight:'1.5'}}>• {note}</p>
                  ))}
                </div>
              )}

              {/* Footer + downloads */}
              <div style={{padding:'8px 16px', display:'flex', alignItems:'center', justifyContent:'space-between', borderTop:'1px solid #e3ebf5', background:'#f2f6fb', flexWrap:'wrap', gap:'8px'}}>
                <span style={{fontSize:'10px', color:'#8aa0b8'}}>
                  {result.patient && <><strong>{result.patient}</strong> · </>}
                  {result.payer && <>{result.payer} · </>}
                  {result.model} · {new Date().toLocaleString()}
                  {result.source === 'sqlite' && <span style={{marginLeft:'6px', background:'#dbeafe', color:'#1a5dad', padding:'1px 6px', borderRadius:'4px', fontSize:'9px', fontWeight:'700'}}>SQLite</span>}
                </span>
                <div style={{display:'flex', gap:'8px'}}>
                  {[
                    { label:'CSV',   bg:'#16a34a', fn: downloadCSV   },
                    { label:'Excel', bg:'#047857', fn: downloadExcel },
                    { label:'JSON',  bg:'#4f46e5', fn: downloadJSON  },
                    { label:'PDF',   bg:'#dc2626', fn: downloadPDF   },
                  ].map(({label, bg, fn}) => (
                    <button key={label} onClick={fn} style={{
                      display:'inline-flex', alignItems:'center', gap:'5px',
                      padding:'4px 12px', borderRadius:'6px', fontSize:'11px', fontWeight:'700',
                      background:bg, color:'#fff', border:'none', cursor:'pointer',
                    }}>
                      <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                      </svg>
                      {label}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // ── Batch ─────────────────────────────────────────────────────────

    const BATCH_STATUS_COLORS = {
      pending: 'bg-gray-100 text-gray-500',
      queued:  'bg-amber-100 text-amber-700',
      running: 'bg-blue-100 text-blue-700',
      done:    'bg-green-100 text-green-700',
      error:   'bg-red-100 text-red-700',
    };

    const BatchStatusBadge = ({ status }) => (
      <span className={`text-[9px] font-bold uppercase px-2 py-0.5 rounded-full ${BATCH_STATUS_COLORS[status] || 'bg-gray-100 text-gray-500'}`}>
        {status}
      </span>
    );

    const generateBatchPdf = (report) => {
      const md = report.memberDetails || {};
      const doc = buildVobReportPdf(md, report);
      const fname = `vob-batch-${(md.patientName||'member').replace(/\s+/g,'-')}-${new Date().toISOString().slice(0,10)}.pdf`;
      doc.save(fname);
    };

    const BatchTab = () => {
      const [batches,     setBatches]     = useState([]);
      const [selected,    setSelected]    = useState(null);   // { batch, items }
      const [batchName,   setBatchName]   = useState('');
      const [uploading,   setUploading]   = useState(false);
      const [uploadErr,   setUploadErr]   = useState('');
      const [loadingPdf,  setLoadingPdf]  = useState({});    // { itemId: true }
      const fileRef = React.useRef();

      const loadBatches = async () => {
        const d = await fetch(`${API}/api/batch`).then(r=>r.json());
        setBatches(d.batches || []);
      };

      React.useEffect(() => { loadBatches(); }, []);

      // Poll when selected batch is running
      React.useEffect(() => {
        if (selected?.batch?.status !== 'running') return;
        const iv = setInterval(async () => {
          const d = await fetch(`${API}/api/batch/${selected.batch.id}`).then(r=>r.json());
          setSelected(d);
          setBatches(prev => prev.map(b => b.id === d.batch.id ? d.batch : b));
        }, 3000);
        return () => clearInterval(iv);
      }, [selected?.batch?.status, selected?.batch?.id]);

      const openBatch = async (id) => {
        const d = await fetch(`${API}/api/batch/${id}`).then(r=>r.json());
        setSelected(d);
      };

      const runBatch = async (id) => {
        await fetch(`${API}/api/batch/${id}/run`, { method:'POST' });
        const d = await fetch(`${API}/api/batch/${id}`).then(r=>r.json());
        setSelected(d);
        setBatches(prev => prev.map(b => b.id === id ? d.batch : b));
      };

      const deleteBatch = async (id) => {
        if (!window.confirm('Delete this batch and all its data?')) return;
        await fetch(`${API}/api/batch/${id}`, { method:'DELETE' });
        if (selected?.batch?.id === id) setSelected(null);
        loadBatches();
      };

      const handleFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setUploading(true); setUploadErr('');
        try {
          const fd = new FormData();
          fd.append('file', file);
          fd.append('name', batchName.trim());
          const r  = await fetch(`${API}/api/batch/upload`, { method:'POST', body:fd });
          const d  = await r.json();
          if (!r.ok) throw new Error(d.detail || 'Upload failed');
          await loadBatches();
          await openBatch(d.batchId);
          setBatchName('');
        } catch(err) {
          setUploadErr(err.message);
        } finally {
          setUploading(false);
          if (fileRef.current) fileRef.current.value = '';
        }
      };

      const downloadPdf = async (item) => {
        setLoadingPdf(p => ({...p, [item.id]: true}));
        try {
          const r = await fetch(`${API}/api/batch/${selected.batch.id}/items/${item.id}/report`);
          if (!r.ok) { const d = await r.json(); throw new Error(d.detail||'No report'); }
          const report = await r.json();
          generateBatchPdf(report);
        } catch(err) {
          alert('PDF error: ' + err.message);
        } finally {
          setLoadingPdf(p => ({...p, [item.id]: false}));
        }
      };

      const downloadTemplate = () => {
        const { utils, writeFile } = window.XLSX;
        const ws = utils.aoa_to_sheet([
          [
            'Payer ID','Member ID','Provider NPI','First Name','Last Name',
            'Date of Birth','As Of Date','Provider Type','Place of Service',
            'Relationship','CPT Codes','Prompt'
          ],
          [
            'G00621','CYL805239155','1710749189','John','Smith',
            '1980-01-15',new Date().toISOString().slice(0,10),'AT','11',
            '18','99213,99214',
            'Generate a benefits table for the CPT codes listed. Include coverage status, deductible, copay, coinsurance, OOP max, and prior auth.'
          ]
        ]);
        // Set column widths
        ws['!cols'] = [
          {wch:10},{wch:18},{wch:14},{wch:12},{wch:12},
          {wch:14},{wch:12},{wch:14},{wch:16},{wch:12},{wch:22},{wch:60}
        ];
        const wb = utils.book_new();
        utils.book_append_sheet(wb, ws, 'Members');
        writeFile(wb, 'batch_template.xlsx');
      };

      // ── Batch detail view ──────────────────────────────────────
      if (selected) {
        const { batch, items } = selected;
        const pct = batch.total > 0 ? Math.round(((batch.completed + batch.failed) / batch.total) * 100) : 0;
        return (
          <div className="space-y-3">
            {/* Header bar */}
            <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-3 flex items-center gap-3">
              <button onClick={() => setSelected(null)}
                className="text-brand text-xs font-semibold hover:underline flex items-center gap-1">
                ← Batches
              </button>
              <div className="flex-1 min-w-0">
                <p className="text-sm font-bold text-gray-900 truncate">{batch.name}</p>
                <p className="text-[10px] text-gray-500">{fmtMDYT(batch.created_at)}</p>
              </div>
              <BatchStatusBadge status={batch.status}/>
              <div className="text-xs text-gray-600 whitespace-nowrap">
                <span className="font-semibold text-green-700">{batch.completed}</span>
                <span className="text-gray-400"> / </span>
                <span className="font-semibold">{batch.total}</span>
                {batch.failed > 0 && <span className="text-red-600 ml-1">({batch.failed} failed)</span>}
              </div>
              {batch.status === 'pending' && (
                <button onClick={() => runBatch(batch.id)}
                  className="bg-brand hover:bg-brand-dark text-white text-xs font-bold px-3 py-1.5 rounded-lg transition">
                  ▶ Run Batch
                </button>
              )}
              {batch.status === 'running' && (
                <span className="flex items-center gap-1.5 text-xs text-blue-600 font-semibold">
                  <Spinner/> Processing…
                </span>
              )}
              <button onClick={() => deleteBatch(batch.id)}
                className="text-xs text-red-500 hover:text-red-700 font-semibold px-2 py-1 rounded border border-red-200 hover:border-red-400 transition">
                Delete
              </button>
            </div>

            {/* Progress bar */}
            {batch.status === 'running' && (
              <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-3">
                <div className="flex justify-between text-[10px] text-gray-500 mb-1">
                  <span>Progress</span><span>{pct}%</span>
                </div>
                <div className="w-full bg-gray-100 rounded-full h-2">
                  <div className="bg-brand h-2 rounded-full transition-all" style={{width:`${pct}%`}}/>
                </div>
              </div>
            )}

            {/* Members table */}
            <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
              <div className="bg-[#1a3a6b] px-3 py-2">
                <p className="text-[9px] font-bold text-white uppercase tracking-widest">Members — {items.length} total</p>
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-xs">
                  <thead>
                    <tr className="bg-gray-50 text-[10px] text-gray-500 uppercase tracking-wide border-b border-gray-100">
                      <th className="text-left px-3 py-2 w-8">#</th>
                      <th className="text-left px-3 py-2">Member</th>
                      <th className="text-left px-3 py-2">Payer ID</th>
                      <th className="text-left px-3 py-2">Member ID</th>
                      <th className="text-left px-3 py-2">Payer Name</th>
                      <th className="text-left px-3 py-2">CPT Codes</th>
                      <th className="text-center px-3 py-2 w-24">Status</th>
                      <th className="text-left px-3 py-2">Error</th>
                      <th className="text-center px-3 py-2 w-28">PDF</th>
                    </tr>
                  </thead>
                  <tbody>
                    {items.map((it, idx) => (
                      <tr key={it.id} className={idx % 2 === 0 ? 'bg-white' : 'bg-gray-50/60'}>
                        <td className="px-3 py-2 text-gray-400 font-mono">{it.row_num}</td>
                        <td className="px-3 py-2 font-medium text-gray-800">
                          {it.patient_name || [it.first_name, it.last_name].filter(Boolean).join(' ') || '—'}
                        </td>
                        <td className="px-3 py-2 font-mono text-gray-600">{it.payer_id}</td>
                        <td className="px-3 py-2 font-mono text-gray-600">{it.member_id}</td>
                        <td className="px-3 py-2 text-gray-600">{it.payer_name || '—'}</td>
                        <td className="px-3 py-2 text-[10px] font-mono text-indigo-700 max-w-[160px] truncate" title={it.cpt_codes||''}>
                          {it.cpt_codes || <span className="text-gray-300">—</span>}
                        </td>
                        <td className="px-3 py-2 text-center">
                          <BatchStatusBadge status={it.status}/>
                        </td>
                        <td className="px-3 py-2 text-red-600 text-[10px] max-w-[200px] truncate" title={it.error_msg||''}>
                          {it.error_msg || ''}
                        </td>
                        <td className="px-3 py-2 text-center">
                          {it.status === 'done' && it.report_id ? (
                            <button
                              onClick={() => downloadPdf(it)}
                              disabled={loadingPdf[it.id]}
                              className="flex items-center gap-1 mx-auto bg-brand hover:bg-brand-dark text-white text-[10px] font-bold px-2.5 py-1 rounded-lg transition disabled:opacity-60"
                            >
                              {loadingPdf[it.id] ? <Spinner/> : '⬇'} PDF
                            </button>
                          ) : (
                            <span className="text-gray-300 text-[10px]">—</span>
                          )}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        );
      }

      // ── Batch list view ────────────────────────────────────────
      return (
        <div className="space-y-3">
          {/* Upload card */}
          <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4 space-y-3">
            <div className="flex items-center justify-between">
              <h2 className="text-xs font-bold text-gray-700 uppercase tracking-wide">New Batch</h2>
              <button onClick={downloadTemplate}
                className="text-[10px] text-brand border border-brand rounded-md px-2 py-1 hover:bg-brand-light transition">
                ⬇ Download Template
              </button>
            </div>
            <div className="flex gap-2 items-end">
              <div className="flex-1">
                <label className="text-[10px] font-semibold text-gray-500 uppercase tracking-wide">Batch Name (optional)</label>
                <input
                  value={batchName} onChange={e => setBatchName(e.target.value)}
                  placeholder="e.g. June 2026 Weekly Run"
                  className="mt-0.5 w-full border border-gray-200 rounded-md px-2.5 py-1 text-xs focus:outline-none focus:ring-2 focus:ring-brand"
                />
              </div>
              <label className={`cursor-pointer flex items-center gap-1.5 px-4 py-1.5 rounded-lg text-xs font-bold transition ${uploading ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 'bg-brand hover:bg-brand-dark text-white'}`}>
                {uploading ? <><Spinner/> Uploading…</> : '📤 Upload Excel'}
                <input ref={fileRef} type="file" accept=".xlsx,.xls" className="hidden" disabled={uploading} onChange={handleFileUpload}/>
              </label>
            </div>
            <p className="text-[10px] text-gray-400">
              Required: <span className="font-mono text-gray-600">Payer ID · Member ID · Provider NPI</span>
              &nbsp;·&nbsp; Optional: <span className="font-mono text-gray-600">First Name · Last Name · Date of Birth · As Of Date · Provider Type · Place of Service · Relationship · <span className="text-indigo-600 font-semibold">CPT Codes</span> · <span className="text-indigo-600 font-semibold">Prompt</span></span>
            </p>
            <p className="text-[10px] text-gray-400">CPT Codes — comma-separated (e.g. <span className="font-mono text-gray-600">99213,99214,D0120</span>). Prompt — custom AI instruction per member. Leave blank for default.</p>
            {uploadErr && <p className="text-xs text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2">{uploadErr}</p>}
          </div>

          {/* Batch list */}
          <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div className="bg-[#1a3a6b] px-3 py-2 flex items-center justify-between">
              <p className="text-[9px] font-bold text-white uppercase tracking-widest">All Batches</p>
              <span className="text-[9px] text-blue-200">{batches.length} batch{batches.length !== 1 ? 'es' : ''}</span>
            </div>
            {batches.length === 0 ? (
              <p className="px-4 py-6 text-xs text-gray-400 italic text-center">No batches yet — upload an Excel file to get started.</p>
            ) : (
              <div className="overflow-x-auto">
                <table className="w-full text-xs">
                  <thead>
                    <tr className="bg-gray-50 text-[10px] text-gray-500 uppercase tracking-wide border-b border-gray-100">
                      <th className="text-left px-3 py-2 w-10">#</th>
                      <th className="text-left px-3 py-2">Batch Name</th>
                      <th className="text-left px-3 py-2">Date &amp; Time</th>
                      <th className="text-center px-3 py-2 w-16">Total</th>
                      <th className="text-center px-3 py-2 w-16">Done</th>
                      <th className="text-center px-3 py-2 w-16">Failed</th>
                      <th className="text-center px-3 py-2 w-20">Status</th>
                      <th className="text-center px-3 py-2 w-36">Actions</th>
                    </tr>
                  </thead>
                  <tbody>
                    {batches.map((b, idx) => (
                      <tr key={b.id} className={`cursor-pointer hover:bg-blue-50/40 ${idx % 2 === 0 ? 'bg-white' : 'bg-gray-50/60'}`}
                        onClick={() => openBatch(b.id)}>
                        <td className="px-3 py-2 text-gray-400 font-mono">{batches.length - idx}</td>
                        <td className="px-3 py-2 font-medium text-gray-800">{b.name}</td>
                        <td className="px-3 py-2 text-gray-500">{fmtMDYT(b.created_at)}</td>
                        <td className="px-3 py-2 text-center font-semibold">{b.total}</td>
                        <td className="px-3 py-2 text-center text-green-700 font-semibold">{b.completed}</td>
                        <td className="px-3 py-2 text-center text-red-600 font-semibold">{b.failed || 0}</td>
                        <td className="px-3 py-2 text-center"><BatchStatusBadge status={b.status}/></td>
                        <td className="px-3 py-2 text-center" onClick={e => e.stopPropagation()}>
                          <div className="flex items-center justify-center gap-1.5">
                            <button onClick={() => openBatch(b.id)}
                              className="text-[10px] text-brand border border-brand rounded px-2 py-0.5 hover:bg-brand-light transition">
                              View
                            </button>
                            {b.status !== 'running' && (
                              <button onClick={() => runBatch(b.id)}
                                className="text-[10px] text-white bg-brand border border-brand rounded px-2 py-0.5 hover:bg-brand-dark transition">
                                Run
                              </button>
                            )}
                            <button onClick={() => deleteBatch(b.id)}
                              className="text-[10px] text-red-500 border border-red-200 rounded px-2 py-0.5 hover:border-red-400 hover:text-red-700 transition">
                              Del
                            </button>
                          </div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      );
    };

    // ── App Shell ────────────────────────────────────────────────────

    const App = () => {
      const [tab, setTab]                     = useState('eligibility');
      const [payerLookupId, setPayerLookupId] = useState('');
      const [providerNpi, setProviderNpi]     = useState('1710749189');
      const [aiReportTab, setAiReportTab]     = useState(null); // { report, loading, error, regenerate }

      const goToPayerLookup = (id) => {
        setPayerLookupId(id);
        setTab('payer');
      };

      const handleReportUpdate = (data) => {
        setAiReportTab(data);
        if (data.report && !data.loading) setTab('ai-report');
      };

      const tabs = [
        { key: 'eligibility', label: '🏥 Eligibility Checker' },
        { key: 'batch',       label: '📋 Batch' },
        { key: 'ai-report',   label: '🤖 AI Report' },
        { key: 'logs',        label: '📊 Logs' },
        { key: 'sqlite',      label: '🗄️ SQLite Cache' },
        { key: 'provider',    label: '🔬 Provider' },
        { key: 'payer',       label: '🔎 Payer Lookup' },
        { key: 'prior-auth',  label: '📝 Prior Auth Lookup' },
      ];

      return (
        <div className="h-screen bg-gray-50 flex flex-col overflow-hidden">
          {/* Header */}
          <header className="bg-white border-b border-gray-200 flex-shrink-0">
            <div className="max-w-[1800px] mx-auto px-4 py-1.5 flex items-center justify-between">
              <div></div>
              <div className="text-gray-400 text-[10px]">{new Date().toLocaleDateString('en-US', { weekday:'long' })} {fmtMDY(new Date().toISOString())}</div>
            </div>

            {/* Tabs */}
            <div className="max-w-[1800px] mx-auto px-4 flex gap-1">
              {tabs.map(t => (
                <button
                  key={t.key}
                  onClick={() => setTab(t.key)}
                  className={`px-4 py-1.5 text-xs font-semibold rounded-t-lg transition flex items-center gap-1.5 ${
                    tab === t.key
                      ? 'bg-brand-light text-brand border-b-2 border-brand'
                      : 'text-gray-500 hover:text-brand hover:bg-gray-50'
                  }`}
                >
                  {t.label}
                  {t.key === 'ai-report' && aiReportTab?.loading && (
                    <span className="inline-block w-1.5 h-1.5 rounded-full bg-indigo-300 animate-pulse"/>
                  )}
                  {t.key === 'ai-report' && aiReportTab?.report && !aiReportTab?.loading && (
                    <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded-full ${tab === 'ai-report' ? 'bg-indigo-100 text-indigo-700' : 'bg-gray-100 text-gray-600'}`}>✓</span>
                  )}
                  {t.key === 'provider' && providerNpi && (
                    <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded-full ${tab === 'provider' ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'}`}>
                      {providerNpi}
                    </span>
                  )}
                </button>
              ))}
            </div>
          </header>

          {/* Content — all tabs stay mounted (display:none) so AI parsing continues across tab switches */}
          <main className="flex-1 min-h-0 flex overflow-hidden">
            <div className="flex-1 min-h-0 overflow-hidden max-w-[1800px] w-full mx-auto px-4 py-2 flex flex-col">

              {/* Eligibility Checker tab */}
              <div className={`flex-1 min-h-0 overflow-hidden flex flex-col ${tab !== 'eligibility' ? 'hidden' : ''}`}>
                <EligibilityChecker onPayerLookup={goToPayerLookup} onNpiChange={setProviderNpi} onReportUpdate={handleReportUpdate}/>
              </div>

              {/* Batch tab */}
              <div className={`flex-1 min-h-0 overflow-y-auto p-3 ${tab !== 'batch' ? 'hidden' : ''}`}>
                <BatchTab/>
              </div>

              {/* AI Report tab */}
              <div className={`flex-1 min-h-0 overflow-y-auto p-4 ${tab !== 'ai-report' ? 'hidden' : ''}`}>
                {aiReportTab ? (
                  <AIReportPanel
                    loading={aiReportTab.loading}
                    report={aiReportTab.report}
                    error={aiReportTab.error}
                    onRegenerate={aiReportTab.regenerate}
                  />
                ) : (
                  <div className="flex flex-col items-center justify-center h-48 text-gray-300 space-y-2">
                    <svg className="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1} d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                    </svg>
                    <p className="text-sm">Run an eligibility check to auto-generate the AI report</p>
                  </div>
                )}
              </div>

              {/* Logs tab */}
              <div className={`flex-1 min-h-0 overflow-y-auto ${tab !== 'logs' ? 'hidden' : ''}`}>
                <LogsTab/>
              </div>

              {/* SQLite Cache tab */}
              <div className={`flex-1 min-h-0 overflow-y-auto ${tab !== 'sqlite' ? 'hidden' : ''}`}>
                <SQLiteCacheTab/>
              </div>

              {/* Provider tab */}
              <div className={`flex-1 min-h-0 overflow-y-auto ${tab !== 'provider' ? 'hidden' : ''}`}>
                {providerNpi ? (
                  <ProviderCard npi={providerNpi}/>
                ) : (
                  <div className="flex flex-col items-center justify-center h-48 text-gray-300 space-y-2">
                    <svg className="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1} d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                    <p className="text-sm">Enter a 10-digit Provider NPI in the Eligibility Checker tab</p>
                  </div>
                )}
              </div>

              {/* Payer Lookup tab */}
              <div className={`flex-1 min-h-0 overflow-y-auto ${tab !== 'payer' ? 'hidden' : ''}`}>
                <PayerLookup initialId={payerLookupId}/>
              </div>

              {/* Prior Auth Lookup tab */}
              <div className={`flex-1 min-h-0 overflow-y-auto ${tab !== 'prior-auth' ? 'hidden' : ''}`}>
                <PriorAuthLookup/>
              </div>

            </div>
          </main>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
