                            if (total != null) return `$${total.toFixed(2)}`;
                            return 'N/A';
                          })(),
          coinsurance : (ai?.coinsurance && ai.coinsurance !== 'null') ? ai.coinsurance
                        : (coins && coins.benefitPercent != null ? `${coins.benefitPercent}%` : 'N/A'),
          oopRem      : (ai?.oopRem && ai.oopRem !== 'null') ? ai.oopRem
                        : (() => {
                            if (!oop) return 'N/A';
                            const rem   = oop.benefitAmountRemaining != null ? parseFloat(oop.benefitAmountRemaining) : null;
                            const total = oop.benefitAmount           != null ? parseFloat(oop.benefitAmount)           : null;
                            if (rem != null && total != null) return `$${rem.toFixed(2)} / $${total.toFixed(2)}`;
                            if (rem   != null) return `$${rem.toFixed(2)} rem.`;
                            if (total != null) return `$${total.toFixed(2)} max`;
                            return 'N/A';
                          })(),
          referralReq : (ai?.referralReq && ai.referralReq !== 'null') ? ai.referralReq
                        : (refBen ? 'Yes' : 'None'),
          inOon       : (ai?.inOon && ai.inOon !== 'null') ? ai.inOon : 'N/A',
          fromAI      : !!ai,
        };
      });

      // Build patient/payer header data
      const patientName = [form.patientFirstName, form.patientLastName].filter(Boolean).join(' ') || memberVerified?.name || '—';
      const payerName   = memberVerified?.payerName || form.payerId || '—';
      const memberId    = form.memberId || '—';
      const groupInfo   = memberVerified?.groupNumber ? `${memberVerified.groupNumber}${memberVerified.groupName ? ' — ' + memberVerified.groupName : ''}` : '—';
      const asOfDate    = memberVerified?.asOfDate || memberVerified?.serviceDate || '—';
      const generatedDate = new Date().toISOString().slice(0, 10);
      const coverageLine = memberVerified?.status || 'Active Coverage';

      return (
        <div className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden fade-in text-xs">

          {/* ── VOB Title Bar ── */}
          <div className="bg-[#0d2b52] text-white px-4 py-2.5 flex items-center justify-between">
            <div className="flex items-center gap-2">
              <span className="font-bold text-sm tracking-wide">Verification of Benefits — Eligibility Summary</span>
              {aiProvider && (
                <span
                  title={aiProvider === 'anthropic' ? 'Parsed by Claude' : 'Parsed by OpenAI'}
                  style={{
                    display:'inline-flex', alignItems:'center', justifyContent:'center',
                    width:'20px', height:'20px', borderRadius:'50%',
                    fontWeight:'900', fontSize:'11px',
                    background: aiProvider === 'anthropic' ? '#f59e0b' : '#2472c9',
                    color:'#fff', border:'2px solid rgba(255,255,255,0.7)',
                    flexShrink: 0,
                  }}
                >
                  {aiProvider === 'anthropic' ? 'C' : 'O'}
                </span>
              )}
            </div>
            <div className="flex items-center gap-2">
              {aiLoading && (
                <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-400 text-amber-900">
                  <Spinner/> AI parsing…
                </span>
              )}
              {aiResults && !aiLoading && (
                <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-400 text-emerald-900">
                  ✦ AI · {Object.keys(aiResults).length} codes
                </span>
              )}
              {onReloadAI && (
                <button
                  onClick={onReloadAI}
                  title="Re-generate AI parsing from scratch"
                  className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold bg-white/15 hover:bg-white/25 text-white border border-white/30 transition"
                >
                  <svg className={`w-3 h-3 ${aiLoading ? 'animate-spin' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                  </svg>
                  {aiLoading ? 'Parsing…' : 'Re-parse AI'}
                </button>
              )}
            </div>
          </div>

          {/* ── Patient / Payer Info Grid ── */}
          <div className="grid grid-cols-2 gap-0 border-b border-gray-200 bg-gray-50">
            <div className="px-4 py-2 space-y-1 border-r border-gray-200">
              <div className="flex gap-2"><span className="text-gray-500 w-24 shrink-0">Patient</span><span className="font-semibold text-gray-800">{patientName}</span></div>
              <div className="flex gap-2"><span className="text-gray-500 w-24 shrink-0">Payer</span><span className="font-semibold text-gray-800">{payerName}</span></div>
              <div className="flex gap-2"><span className="text-gray-500 w-24 shrink-0">Provider NPI</span><span className="font-mono text-gray-800">{form.providerNpi || '—'}</span></div>
              <div className="flex gap-2"><span className="text-gray-500 w-24 shrink-0">Coverage</span><span className="font-semibold text-emerald-700">{coverageLine}</span></div>
            </div>
            <div className="px-4 py-2 space-y-1">
              <div className="flex gap-2"><span className="text-gray-500 w-24 shrink-0">Member ID</span><span className="font-mono text-gray-800">{memberId}</span></div>
              <div className="flex gap-2"><span className="text-gray-500 w-24 shrink-0">Group</span><span className="text-gray-800">{groupInfo}</span></div>
              <div className="flex gap-2"><span className="text-gray-500 w-24 shrink-0">As-Of Date</span><span className="text-gray-800">{asOfDate}</span></div>
              <div className="flex gap-2"><span className="text-gray-500 w-24 shrink-0">Generated</span><span className="text-gray-800">{generatedDate}</span></div>
            </div>
          </div>

          {/* ── Table ── */}
          <div className="overflow-x-auto">
            <table className="w-full text-xs min-w-max" style={{borderCollapse:'collapse'}}>
              <thead>
                <tr style={{background:'#0d2b52',color:'#fff',fontSize:'11px',whiteSpace:'nowrap'}}>
                  <th style={{padding:'5px 8px',textAlign:'left',borderRight:'1px solid #123f7e',fontWeight:'700'}}>Code</th>
                  <th style={{padding:'5px 8px',textAlign:'left',borderRight:'1px solid #123f7e',fontWeight:'700'}}>Description</th>
                  <th style={{padding:'5px 8px',textAlign:'left',borderRight:'1px solid #123f7e',fontWeight:'700'}}>Benefit Class (STC)</th>
                  <th style={{padding:'5px 8px',textAlign:'center',borderRight:'1px solid #123f7e',fontWeight:'700'}}>Coverage Status</th>
                  <th style={{padding:'5px 8px',textAlign:'center',borderRight:'1px solid #123f7e',fontWeight:'700'}}>Est. Ins. Pays</th>
                  <th style={{padding:'5px 8px',textAlign:'center',borderRight:'1px solid #123f7e',fontWeight:'700'}}>Est. Patient Pays</th>
                  <th style={{padding:'5px 8px',textAlign:'center',borderRight:'1px solid #123f7e',fontWeight:'700'}}>PA Likely?</th>
                  <th style={{padding:'5px 8px',textAlign:'center',borderRight:'1px solid #123f7e',fontWeight:'700'}}>Copay</th>
                  <th style={{padding:'5px 8px',textAlign:'center',borderRight:'1px solid #123f7e',fontWeight:'700'}}>Deductible Rem.</th>
                  <th style={{padding:'5px 8px',textAlign:'center',borderRight:'1px solid #123f7e',fontWeight:'700'}}>Coinsurance</th>
                  <th style={{padding:'5px 8px',textAlign:'center',borderRight:'1px solid #123f7e',fontWeight:'700'}}>OOP Remaining</th>
                  <th style={{padding:'5px 8px',textAlign:'center',borderRight:'1px solid #123f7e',fontWeight:'700'}}>Referral Req.</th>
                  <th style={{padding:'5px 8px',textAlign:'center',fontWeight:'700'}}>IN / OON</th>
                </tr>
              </thead>
              <tbody>
                {rows.map((row, i) => {
                  const isActive = (row.coverageStatus || '').toLowerCase().startsWith('active');
                  const bg = i % 2 === 0 ? '#fff' : '#f7f8fa';
                  const border = '1px solid #e3ebf5';
                  const cell = {padding:'4px 8px', borderBottom: border, borderRight: border, verticalAlign:'middle', whiteSpace:'nowrap'};
                  return (
                    <tr key={i} style={{background: bg}}>
                      <td style={{...cell, fontFamily:'monospace', fontWeight:'600', color:'#0d2b52'}}>
                        {row.code}{row.fromAI && <span style={{color:'#10b981',fontSize:'8px',marginLeft:'3px'}}>✦</span>}
                      </td>
                      <td style={{...cell, overflow:'hidden', textOverflow:'ellipsis', maxWidth:'220px'}}>{row.description}</td>
                      <td style={cell}>{row.benefitClass || '—'}</td>
                      <td style={{...cell, textAlign:'center', color: isActive ? '#15803d' : '#6b7c8f', fontWeight: isActive ? '600' : '400'}}>
                        {row.coverageStatus || '—'}
                      </td>
                      <td style={{...cell, textAlign:'center'}}>{row.estInsPays || '—'}</td>
                      <td style={{...cell, textAlign:'center'}}>{row.estPatPays || '—'}</td>
                      <td style={{...cell, textAlign:'center'}}>{row.paLikely || '—'}</td>
                      <td style={{...cell, textAlign:'center'}}>{row.copay}</td>
                      <td style={{...cell, textAlign:'center'}}>{row.deductRem}</td>
                      <td style={{...cell, textAlign:'center'}}>{row.coinsurance}</td>
                      <td style={{...cell, textAlign:'center'}}>{row.oopRem}</td>
                      <td style={{...cell, textAlign:'center'}}>{row.referralReq}</td>
                      <td style={{...cell, textAlign:'center', borderRight:'none'}}>{row.inOon}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>

          {/* ── Action Items / Flags + Note ── */}
          <div className="px-4 py-3 border-t-2 border-gray-300">
            {(aiActionFlags && aiActionFlags.length > 0) && (
              <div className="mb-2">
                <p className="text-xs font-bold text-gray-800 mb-1">Action Items / Flags</p>
                {aiActionFlags.map((flag, i) => (
                  <p key={i} className="text-[11px] text-gray-700 leading-snug">• {flag}</p>
                ))}
              </div>
            )}
            <p className="text-[10px] text-gray-400 italic mt-2">
              Note: Eligibility 271s carry no allowed/fee-schedule amounts — Est. Ins./Patient Pays are AI-inferred.
              Copay / Deductible / OOP figures are payer-returned where available. ✦ = AI-powered row.
            </p>
          </div>
        </div>
      );
    };

    // ── Provider Card (NPI Registry) ─────────────────────────────
    const ProviderCard = ({ npi }) => {
      const [data, setData]       = useState(null);
      const [loading, setLoading] = useState(false);
      const [err, setErr]         = useState(null);

      useEffect(() => {
        if (!npi || !/^\d{10}$/.test(npi)) { setData(null); setErr(null); return; }
        setLoading(true); setErr(null);
        // Proxied through our backend to avoid CORS
        fetch(`${API}/api/npi/${npi}`)
          .then(r => r.json())
          .then(json => {
            if (json.result_count > 0) setData(json.results[0]);
            else { setData(null); setErr('NPI not found in registry'); }
          })
          .catch(() => setErr('Failed to reach NPI registry'))
          .finally(() => setLoading(false));
      }, [npi]);

      if (!npi || !/^\d{10}$/.test(npi)) return null;

      if (loading) return (
        <div className="bg-white rounded-2xl border border-gray-100 shadow-sm p-4 flex items-center gap-2 text-sm text-gray-500">
          <Spinner/> Looking up NPI {npi}…
        </div>
      );
      if (err) return (
        <div className="bg-red-50 border border-red-200 rounded-2xl p-3 text-xs text-red-700">{err}</div>
      );
      if (!data) return null;

      const basic    = data.basic || {};
      const isOrg    = data.enumeration_type === 'NPI-2';
      const name     = isOrg
        ? basic.organization_name
        : [basic.first_name, basic.middle_name, basic.last_name].filter(Boolean).join(' ');
      const credential = !isOrg && basic.credential ? basic.credential : null;
      const active   = basic.status === 'A';

      // Pick addresses
      const locAddr  = (data.addresses || []).find(a => a.address_purpose === 'LOCATION');
      const mailAddr = (data.addresses || []).find(a => a.address_purpose === 'MAILING');
      const fmtAddr  = a => a
        ? [a.address_1, a.address_2, `${a.city}, ${a.state} ${(a.postal_code||'').slice(0,5)}`].filter(Boolean).join(', ')
        : null;

      // Taxonomies — primary first
      const taxList  = [...(data.taxonomies || [])].sort((a,b) => (b.primary ? 1 : 0) - (a.primary ? 1 : 0));

      // Authorized official (org)
      const aoName   = isOrg && basic.authorized_official_last_name
        ? [basic.authorized_official_first_name, basic.authorized_official_last_name].filter(Boolean).join(' ')
        : null;
      const aoPhone  = basic.authorized_official_telephone_number
        ? basic.authorized_official_telephone_number.replace(/(\d{3})(\d{3})(\d{4})/, '$1-$2-$3')
        : null;

      const fmtDate  = d => fmtMDY(d);

      return (
        <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden fade-in">

          {/* ── Title bar ── */}
          <div className="flex items-start justify-between gap-2 px-3 py-2 bg-gradient-to-r from-brand-light to-white border-b border-gray-100">
            <div className="min-w-0">
              <p className="text-[9px] font-bold text-brand uppercase tracking-widest mb-0.5">NPI Registry · {isOrg ? 'Organization' : 'Individual'}</p>
              <p className="font-bold text-gray-900 text-sm leading-tight truncate">{name || '—'}</p>
              {credential && <p className="text-[10px] text-gray-500 mt-0.5">{credential}</p>}
              <p className="text-[10px] text-gray-400 font-mono mt-0.5">NPI: {data.number} &nbsp;·&nbsp; {data.enumeration_type}</p>
            </div>
            <span className={`mt-0.5 flex-shrink-0 inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold border ${active ? 'bg-green-50 text-green-700 border-green-200' : 'bg-yellow-50 text-yellow-700 border-yellow-200'}`}>
              <span className={`w-1.5 h-1.5 rounded-full ${active ? 'bg-green-500' : 'bg-yellow-500'}`}></span>
              {active ? 'Active' : (basic.status || '?')}
            </span>
          </div>

          <div className="p-3 space-y-2">

            {/* ── Taxonomy / Specialty ── */}
            {taxList.length > 0 && (
              <div>
                <p className="text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-1">Taxonomy / Specialty</p>
                <div className="space-y-1">
                  {taxList.map((t, i) => (
                    <div key={i} className={`flex items-start gap-2 rounded-md px-2 py-1.5 ${t.primary ? 'bg-blue-50 border border-blue-100' : 'bg-gray-50 border border-gray-100'}`}>
                      <div className="flex-1 min-w-0">
                        <span className={`text-sm font-semibold ${t.primary ? 'text-blue-800' : 'text-gray-700'}`}>{t.desc}</span>
                        {t.taxonomy_group && <span className="ml-2 text-xs text-gray-400">{t.taxonomy_group.split(' - ').pop()}</span>}
                      </div>
                      <div className="flex gap-1 flex-shrink-0">
                        <span className="text-[10px] font-mono text-gray-400 bg-white border border-gray-200 px-1.5 py-0.5 rounded">{t.code}</span>
                        {t.primary && <span className="text-[10px] font-bold text-blue-600 bg-blue-100 px-1.5 py-0.5 rounded">PRIMARY</span>}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* ── Addresses ── */}
            {(locAddr || mailAddr) && (
              <div>
                <p className="text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-1">Addresses</p>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                  {locAddr && (
                    <div className="bg-gray-50 rounded-lg border border-gray-100 px-2 py-1.5">
                      <p className="text-[10px] font-bold text-gray-400 uppercase tracking-wide mb-1">Practice Location</p>
                      <p className="text-sm text-gray-800 font-medium leading-snug">{fmtAddr(locAddr)}</p>
                      {locAddr.telephone_number && <p className="text-xs text-gray-500 mt-1">&#9990; {locAddr.telephone_number}</p>}
                    </div>
                  )}
                  {mailAddr && (
                    <div className="bg-gray-50 rounded-xl border border-gray-100 px-3 py-2.5">
                      <p className="text-[10px] font-bold text-gray-400 uppercase tracking-wide mb-1">Mailing Address</p>
                      <p className="text-sm text-gray-800 font-medium leading-snug">{fmtAddr(mailAddr)}</p>
                      {mailAddr.telephone_number && <p className="text-xs text-gray-500 mt-1">&#9990; {mailAddr.telephone_number}</p>}
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* ── Authorized Official + Enrollment ── */}
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
              {aoName && (
                <div className="col-span-2 bg-gray-50 rounded-xl border border-gray-100 px-3 py-2.5">
                  <p className="text-[10px] font-bold text-gray-400 uppercase tracking-wide mb-1">Authorized Official</p>
                  <p className="text-sm font-semibold text-gray-900">{aoName}</p>
                  {basic.authorized_official_title_or_position && <p className="text-xs text-gray-500">{basic.authorized_official_title_or_position}</p>}
                  {aoPhone && <p className="text-xs text-gray-500 mt-0.5">&#9990; {aoPhone}</p>}
                </div>
              )}
              <div className="bg-gray-50 rounded-xl border border-gray-100 px-3 py-2.5">
                <p className="text-[10px] font-bold text-gray-400 uppercase tracking-wide mb-1">Enrolled</p>
                <p className="text-sm font-semibold text-gray-800">{fmtDate(basic.enumeration_date)}</p>
              </div>
              <div className="bg-gray-50 rounded-xl border border-gray-100 px-3 py-2.5">
                <p className="text-[10px] font-bold text-gray-400 uppercase tracking-wide mb-1">Last Updated</p>
                <p className="text-sm font-semibold text-gray-800">{fmtDate(basic.last_updated)}</p>
              </div>
              {isOrg && basic.organizational_subpart && (
                <div className="bg-gray-50 rounded-xl border border-gray-100 px-3 py-2.5">
                  <p className="text-[10px] font-bold text-gray-400 uppercase tracking-wide mb-1">Org Subpart</p>
                  <p className="text-sm font-semibold text-gray-800">{basic.organizational_subpart}</p>
                </div>
              )}
              {!isOrg && basic.gender && (
                <div className="bg-gray-50 rounded-xl border border-gray-100 px-3 py-2.5">
                  <p className="text-[10px] font-bold text-gray-400 uppercase tracking-wide mb-1">Gender</p>
                  <p className="text-sm font-semibold text-gray-800">{basic.gender === 'M' ? 'Male' : basic.gender === 'F' ? 'Female' : basic.gender}</p>
                </div>
              )}
            </div>

          </div>
        </div>
      );
    };

    // ── Eligibility Summary Card ─────────────────────────────────
    const EligibilitySummaryCard = ({ eligResults }) => {
      if (!eligResults || !eligResults.results) return null;
      const complete = eligResults.results.filter(
        r => r.status === 'Complete' && r.data && (r.data.plans || []).length > 0
      );
      if (complete.length === 0) return null;

      // Prefer dental (35) → health (30) → first complete
      const best = complete.find(r => r.code === '35') || complete.find(r => r.code === '30') || complete[0];
      const d    = best.data;

      const sub      = d.subscriber || {};
      const pat      = d.patient    || {};
      const payer    = d.payer      || {};
      const svcTypes = d.requestedServiceType || [];
      const plan     = (d.plans || [])[0] || {};
      const benefits = plan.benefitInformation || [];

      // Address
      const addr    = sub.address || {};
      const addrStr = typeof addr === 'string' ? addr
        : [addr.address1, addr.address2,
           (addr.city || addr.state)
             ? `${addr.city || ''}, ${addr.state || ''} ${(addr.postalCode || addr.zipCode || '').slice(0,5)}`.trim()
             : null
          ].filter(Boolean).join(', ');

      const memberName = [
        pat.firstName || sub.firstName,
        pat.middleName || sub.middleName,
        pat.lastName  || sub.lastName,
      ].filter(Boolean).join(' ') || sub.name || '';

      // Benefit helpers
      const findB = kw => benefits.find(b => (b.benefitType || '').toLowerCase().includes(kw.toLowerCase()));
      const deductB = findB('deductible');
      const maxB    = findB('maximum') || findB('annual');
      const depAgeB = benefits.find(b => {
        const t = (b.benefitType || '').toLowerCase();
        return (t.includes('dependent') && (t.includes('age') || t.includes('max'))) || t === 'maximum age';
      });

      const fmtMoney = v => v != null ? `$${parseFloat(v).toFixed(0)}` : null;
      const fmtBenefit = (b, usedLabel) => {
        if (!b) return null;
        const total   = fmtMoney(b.benefitAmount);
        const rem     = fmtMoney(b.benefitAmountRemaining);
        const applied = (b.benefitAmount != null && b.benefitAmountRemaining != null)
          ? fmtMoney(parseFloat(b.benefitAmount) - parseFloat(b.benefitAmountRemaining)) : null;
        if (!total && !rem) return (b.messages || []).join('; ') || null;
        const parts = [];
        if (total)   parts.push(`${total} total`);
        if (applied) parts.push(`${applied} ${usedLabel || 'applied'}`);
        if (rem)     parts.push(`${rem} remaining`);
        return parts.length ? parts.join(' | ') : null;
      };

      // Metadata
      const asOfDate  = fmtMDY(d.asOfDate || d.serviceDate);
      const createdAt = fmtMDYT(d.createdDate || d.created);
      const expiresAt = fmtMDY(d.expirationDate || d.expiration);
      const covId     = d.id || '';

      const SRow = ({ label, value, green }) =>
        value ? (
          <tr className="border-b border-gray-100 last:border-0">
            <td className="py-1 pl-3 pr-3 text-[10px] font-semibold text-gray-500 whitespace-nowrap w-44 align-top">{label}</td>
            <td className={`py-1 pr-3 text-xs ${green ? 'font-bold text-green-700' : 'text-gray-800'}`}>{value}</td>
          </tr>
        ) : null;

      const SHead = ({ title }) => (
        <tr>
          <td colSpan={2} className="bg-[#1a3a6b] text-white text-[9px] font-bold uppercase tracking-widest px-3 py-1">{title}</td>
        </tr>
      );

      const coveragePeriod = plan.coverageStartDate
        ? `${fmtMDY(plan.coverageStartDate)} to ${fmtMDY(plan.coverageEndDate)}`
        : null;
      const payerDisplay  = [
        payer.responseName || payer.name,
        payer.id ? `(ID ${payer.id})` : null,
      ].filter(Boolean).join(' ');
      const planGroup     = [plan.groupName, plan.groupNumber].filter(Boolean).join(' — ');
      const svcLabel      = svcTypes.map(s => s.value || s.description || s.code).filter(Boolean).join(', ');
      const depAgeDisplay = depAgeB
        ? [
            depAgeB.benefitQuantity != null ? depAgeB.benefitQuantity : depAgeB.benefitAmount,
            (depAgeB.messages || []).join('; ') || '(child / student)',
          ].filter(v => v != null).join(' ')
        : null;

      const hasFinancials = deductB || maxB || depAgeB;

      return (
        <div className="fade-in bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden text-sm">
          <table className="w-full border-collapse">
            <tbody>
              <SHead title="Patient / Subscriber"/>
              <SRow label="Member Name"   value={memberName}/>
              <SRow label="Member ID"     value={sub.memberId}/>
              <SRow label="Date of Birth" value={fmtMDY(pat.birthDate || sub.birthDate)}/>
              <SRow label="Relationship"  value={pat.subscriberRelationship || (plan.coverageLevel === 'Individual' ? 'Self' : null)}/>
              {addrStr ? <SRow label="Address" value={addrStr}/> : null}

              <SHead title="Payer &amp; Plan"/>
              <SRow label="Payer"                  value={payerDisplay}/>
              <SRow label="Plan / Group"           value={planGroup}/>
              <SRow label="Coverage Status"        value={plan.status} green={plan.statusCode === '1'}/>
              <SRow label="Insurance Type"         value={plan.insuranceType}/>
              <SRow label="Coverage Period"        value={coveragePeriod}/>
              {plan.eligibilityBeginDate ? <SRow label="Eligibility Since" value={fmtMDY(plan.eligibilityBeginDate)}/> : null}
              {svcLabel ? <SRow label="Service Type Requested" value={svcLabel}/> : null}

              {hasFinancials ? <SHead title="Financials (In-Network)"/> : null}
              {deductB ? <SRow label="Individual Deductible" value={fmtBenefit(deductB, 'applied')}/> : null}
              {maxB    ? <SRow label="Annual Maximum"        value={fmtBenefit(maxB,    'used YTD')}/> : null}
              {depAgeB ? <SRow label="Dependent Max Age"     value={depAgeDisplay}/> : null}

              <SHead title="Response Metadata"/>
              {asOfDate  ? <SRow label="As-Of Date"  value={asOfDate}/> : null}
              {createdAt ? <SRow label="Created"     value={createdAt}/> : null}
              {expiresAt ? <SRow label="Expires"     value={expiresAt}/> : null}
              {covId     ? <SRow label="Coverage ID" value={covId}/> : null}
            </tbody>
          </table>
        </div>
      );
    };

    // ── Shared VOB Report PDF Builder ──────────────────────────────────
    // Used by the live AI Report panel, saved-report downloads (SQLite Cache
    // tab), and Batch PDF export, so all three produce visually identical
    // reports. `md` is a flat member-details object (same shape the backend's
    // _extract_member_details returns); `report` is { columns, rows, notes }.
    const buildVobReportPdf = (md = {}, report = null, opts = {}) => {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation:'landscape', unit:'mm', format:'a4' });
      const W = 297, M = 12;
      const dateStr = opts.dateStr || new Date().toLocaleString();
      const title1 = opts.title1 || 'VOB Benefits Report';
      const subtitle1 = opts.subtitle1 ||
        `Generated: ${dateStr}   |   Payer: ${md.payerName || '—'}   |   Member ID: ${md.memberId || '—'}`;

      const drawPageHeader = (title, subtitle) => {
        doc.setFillColor(0, 94, 184);
        doc.rect(0, 0, W, 20, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFont('helvetica', 'bold'); doc.setFontSize(13);
        doc.text(title, M, 13);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5);
        doc.text(subtitle, M, 18.5);
        doc.setTextColor(30, 30, 30);
      };

      const sectionBar = (label, y, color = [26, 58, 92]) => {
        doc.setFillColor(...color);
        doc.rect(M, y, W - M * 2, 5.5, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5);
        doc.text(label, M + 2.5, y + 3.8);
        doc.setTextColor(30, 30, 30);
        return y + 7;
      };

      // ── PAGE 1: Member Details ─────────────────────────────
      drawPageHeader(title1, subtitle1);

      const isActive = (md.coverageStatus || '').toLowerCase().includes('active');
      doc.setFillColor(...(isActive ? [209, 250, 229] : [254, 226, 226]));
      doc.roundedRect(M, 24, W - M * 2, 11, 2, 2, 'F');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(10);
      doc.setTextColor(...(isActive ? [6, 95, 70] : [153, 27, 27]));
      doc.text(`Coverage Status: ${md.coverageStatus || 'Unknown'}`, M + 4, 30.5);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8);
      doc.setTextColor(30, 30, 30);
      doc.text(`${md.insuranceType ? 'Insurance Type: ' + md.insuranceType + '   |   ' : ''}Coverage: ${md.coverageStart || '—'} - ${md.coverageEnd || '—'}`, M + 4, 34);

      let y = 40;

      y = sectionBar('PATIENT INFORMATION', y, [30, 64, 175]);
      doc.autoTable({
        body: [
          ['Full Name', md.patientName || '—', 'First Name', md.firstName || '—'],
          ['Last Name', md.lastName || '—', 'Date of Birth', md.dob || '—'],
          ['Gender', md.gender || '—', 'Relationship', md.relationship || '—'],
        ],
        startY: y, margin: { left: M, right: M },
        styles: { fontSize: 8, cellPadding: 2, overflow: 'linebreak' },
        columnStyles: {
          0: { fontStyle:'bold', fillColor:[243,244,246], textColor:[75,85,99], cellWidth:38 },
          1: { fillColor:[255,255,255], textColor:[17,24,39], cellWidth:62 },
          2: { fontStyle:'bold', fillColor:[243,244,246], textColor:[75,85,99], cellWidth:38 },
          3: { fillColor:[255,255,255], textColor:[17,24,39], cellWidth:62 },
        },
        tableLineColor:[203,213,225], tableLineWidth:0.2,
      });
      y = doc.lastAutoTable.finalY + 4;

      y = sectionBar('SUBSCRIBER / GROUP', y, [6, 95, 70]);
      doc.autoTable({
        body: [
          ['Subscriber Name', md.subscriberName || '—', 'Member ID', md.memberId || '—'],
          ['Group Number', md.groupNumber || '—', 'Group Name', md.groupName || '—'],
          ['Address', md.address || '—', '', ''],
        ],
        startY: y, margin: { left: M, right: M },
        styles: { fontSize: 8, cellPadding: 2, overflow: 'linebreak' },
        columnStyles: {
          0: { fontStyle:'bold', fillColor:[240,253,244], textColor:[6,95,70], cellWidth:38 },
          1: { fillColor:[255,255,255], textColor:[17,24,39], cellWidth:62 },
          2: { fontStyle:'bold', fillColor:[240,253,244], textColor:[6,95,70], cellWidth:38 },
          3: { fillColor:[255,255,255], textColor:[17,24,39], cellWidth:62 },
        },
        tableLineColor:[187,247,208], tableLineWidth:0.2,
      });
      y = doc.lastAutoTable.finalY + 4;

      y = sectionBar('PAYER INFORMATION', y, [146, 64, 14]);
      doc.autoTable({
        body: [
          ['Payer Name', md.payerName || '—', 'Payer ID', md.payerId || '—'],
        ],
        startY: y, margin: { left: M, right: M },
        styles: { fontSize: 8, cellPadding: 2, overflow: 'linebreak' },
        columnStyles: {
          0: { fontStyle:'bold', fillColor:[255,251,235], textColor:[120,53,15], cellWidth:38 },
          1: { fillColor:[255,255,255], textColor:[17,24,39], cellWidth:62 },
          2: { fontStyle:'bold', fillColor:[255,251,235], textColor:[120,53,15], cellWidth:38 },
          3: { fillColor:[255,255,255], textColor:[17,24,39], cellWidth:62 },
        },
        tableLineColor:[253,230,138], tableLineWidth:0.2,
      });
      y = doc.lastAutoTable.finalY + 4;

      const hasExtra = md.providerNpi || md.asOfDate || md.coverageId || (md.allPlans && md.allPlans.length > 0);
      if (hasExtra) {
        y = sectionBar('COVERAGE & PLAN DETAILS', y, [20, 83, 45]);

        if (md.providerNpi || md.asOfDate || md.coverageId) {
          doc.autoTable({
            body: [
              ['Provider NPI', md.providerNpi || '—', 'As-Of Date', md.asOfDate || '—'],
              ['Coverage ID', md.coverageId || '—', '', ''],
            ],
            startY: y, margin: { left: M, right: M },
            styles: { fontSize: 8, cellPadding: 2, overflow: 'linebreak' },
            columnStyles: {
              0: { fontStyle:'bold', fillColor:[240,253,244], textColor:[20,83,45], cellWidth:38 },
              1: { fillColor:[255,255,255], textColor:[17,24,39], cellWidth:62 },
              2: { fontStyle:'bold', fillColor:[240,253,244], textColor:[20,83,45], cellWidth:38 },
              3: { fillColor:[255,255,255], textColor:[17,24,39], cellWidth:62 },
            },
            tableLineColor:[187,247,208], tableLineWidth:0.2,
          });
          y = doc.lastAutoTable.finalY + 3;
        }

        const allPlans = md.allPlans && md.allPlans.length > 0 ? md.allPlans : [{
          status: md.coverageStatus || '', insuranceType: md.insuranceType || '',
          description: md.planDescription || '', coverageStart: md.coverageStart || '',
          coverageEnd: md.coverageEnd || '',
        }];
        doc.autoTable({
          head: [['Status', 'Insurance Type', 'Plan / Description', 'Effective Date', 'Term / Expiry Date']],
          body: allPlans.map(p => [
            p.status || '—', p.insuranceType || '—', p.description || '—',
            p.coverageStart || '—', p.coverageEnd || '—',
          ]),
          startY: y, margin: { left: M, right: M },
          styles: { fontSize: 7.5, cellPadding: 2, overflow: 'linebreak' },
          headStyles: { fillColor: [20, 83, 45], textColor: 255, fontStyle: 'bold', fontSize: 7.5 },
          alternateRowStyles: { fillColor: [240, 253, 244] },
          didParseCell: (data) => {
            if (data.section === 'body') {
              const statusVal = (allPlans[data.row.index] || {}).status || '';
              const isInactive = statusVal.toLowerCase().includes('inactive') ||
                                 statusVal.toLowerCase().includes('terminat');
              if (isInactive) {
                data.cell.styles.textColor = [153, 27, 27];
                data.cell.styles.fillColor = [254, 242, 242];
              }
            }
          },
          tableLineColor:[187,247,208], tableLineWidth:0.2,
        });
        y = doc.lastAutoTable.finalY + 4;
      }

      // Optional data-mismatch banner (form-entered vs payer-returned values)
      if (opts.mismatches && opts.mismatches.length) {
        if (y > 175) { doc.addPage(); drawPageHeader(title1, subtitle1); y = 28; }
        doc.setFillColor(254, 226, 226);
        doc.roundedRect(M, y, W - M * 2, opts.mismatches.length * 5.5 + 8, 2, 2, 'F');
        doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.setTextColor(185, 28, 28);
        doc.text('Data Mismatch Detected', M + 3, y + 5);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(30, 30, 30);
        opts.mismatches.forEach((m, i) => doc.text(`• ${m}`, M + 5, y + 10.5 + i * 5.5));
        y += opts.mismatches.length * 5.5 + 12;
      }

      // ── PAGE 2: Benefits Table ─────────────────────────────
      if (report && report.columns && report.columns.length) {
        doc.addPage();
        drawPageHeader(
          opts.title2 || 'VOB Benefits Report — Procedure Table',
          opts.subtitle2 || `Patient: ${md.patientName || '—'}   |   Payer: ${md.payerName || '—'}   |   Member ID: ${md.memberId || '—'}   |   ${dateStr}`
        );
        doc.autoTable({
          head: [report.columns],
          body: (report.rows || []).map(row => report.columns.map(c => row[c] ?? '—')),
          startY: 24, margin: { left: M, right: M },
          styles: { fontSize: 8, cellPadding: 2.5, overflow: 'linebreak' },
          headStyles: { fillColor: [26, 58, 92], textColor: 255, fontStyle: 'bold' },
          alternateRowStyles: { fillColor: [247, 249, 252] },
        });

        if (report.notes && report.notes.length) {
          let ny = doc.lastAutoTable.finalY + 8;
          if (ny > 185) { doc.addPage(); ny = 15; }
          doc.setFillColor(255, 251, 235);
          doc.roundedRect(M, ny - 2, W - M * 2, 7 + report.notes.length * 6, 1.5, 1.5, 'F');
          doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.setTextColor(120, 53, 15);
          doc.text('Action Items / Notes', M + 3, ny + 3.5);
          doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(55, 65, 81);
          report.notes.forEach(note => {
            ny += 6;
            if (ny > 195) { doc.addPage(); ny = 15; }
            doc.text(`• ${note}`, M + 3, ny + 3.5, { maxWidth: W - M * 2 - 6 });
          });
        }
      }

      return doc;
    };

    // ── Inline AI Report Panel ───────────────────────────────────────
    const AIReportPanel = ({ loading, report, error, onRegenerate }) => {
      const thStyle = {
        background:'#0d2b52', color:'#fff', padding:'6px 10px',
        textAlign:'left', fontWeight:'700', fontSize:'11px',
        whiteSpace:'nowrap', border:'1px solid #2d5a8e',
      };
      const tdStyle = (ri) => ({
        padding:'5px 10px', border:'1px solid #dde3ea',
        whiteSpace:'nowrap', verticalAlign:'middle', fontSize:'12px',
        background: ri % 2 === 0 ? '#fff' : '#f7f9fc',
      });

      const downloadPDF = () => {
        if (!report || !report.columns) return;
        const md = report.memberDetails || {};
        const doc = buildVobReportPdf(md, report, {
          subtitle1: `Generated: ${new Date().toLocaleString()}   |   Model: ${report.model || '—'}   |   Cache Key: ${report.cacheKey || '—'}`,
        });
        doc.save(`vob-report-${md.patientName ? md.patientName.replace(/\s+/g,'-') + '-' : ''}${new Date().toISOString().slice(0,10)}.pdf`);
      };

      return (
        <div className="fade-in bg-white rounded-xl shadow-sm border border-indigo-100 overflow-hidden">
          <div className="flex items-center justify-between px-4 py-2 bg-gradient-to-r from-indigo-700 to-blue-600">
            <div className="flex items-center gap-2">
              <span className="text-white font-bold text-xs">AI Report</span>
              {report?.model && (
                <span className="text-[9px] bg-white/20 text-white px-2 py-0.5 rounded-full font-mono">{report.model}</span>
              )}
              {loading && <span className="text-[9px] text-indigo-200 animate-pulse">Generating…</span>}
            </div>
            <div className="flex items-center gap-2">
              {report?.columns && (
                <button onClick={downloadPDF}
                  className="text-[10px] font-bold bg-white/15 hover:bg-white/25 text-white px-2.5 py-1 rounded-md transition border border-white/20">
                  Download PDF
                </button>
              )}
              <button onClick={onRegenerate}
                disabled={loading}
                className="text-[10px] font-bold bg-white/15 hover:bg-white/25 text-white px-2.5 py-1 rounded-md transition border border-white/20 disabled:opacity-40">
                Regenerate
              </button>
            </div>
          </div>
          <div className="grad-sep"/>
          {loading && (
            <div className="flex items-center justify-center gap-2 py-8 text-indigo-500">
              <Spinner/> <span className="text-xs">Generating AI report…</span>
            </div>
          )}
          {error && !loading && (
            <div className="px-4 py-3 text-xs text-red-600 bg-red-50">
              <strong>AI Report error:</strong> {error}
            </div>
          )}
          {report && !loading && report.columns && (
            <div className="overflow-x-auto">
              <table style={{borderCollapse:'collapse', width:'100%'}}>
                <thead>
                  <tr>{report.columns.map(c => <th key={c} style={thStyle}>{c}</th>)}</tr>
                </thead>
                <tbody>
                  {(report.rows || []).map((row, ri) => (
                    <tr key={ri}>
                      {report.columns.map(col => <td key={col} style={tdStyle(ri)}>{row[col] ?? '—'}</td>)}
                    </tr>
                  ))}
                </tbody>
              </table>
              {report.notes && report.notes.length > 0 && (
                <div className="px-4 py-3 bg-amber-50 border-t border-amber-100">
                  <p className="text-[10px] font-bold text-amber-700 uppercase tracking-wide mb-1.5">Action Items / Notes</p>
                  <ul className="space-y-1">
                    {report.notes.map((n, i) => (
                      <li key={i} className="text-xs text-amber-800">• {n}</li>
                    ))}
                  </ul>
                </div>
              )}
            </div>
          )}
        </div>
      );
    };

    // ─────────────────────────────────────────────────────────────

    const EligibilityChecker = ({ onPayerLookup, onNpiChange, onReportUpdate }) => {
      const [form, setForm] = useState({
        payerId: '60054', memberId: 'W294018988', providerNpi: '1710749189',
        providerLastName: 'AVAILITY', providerType: 'AT', placeOfService: '11',
        patientFirstName: 'Tristan', patientLastName: 'Daniel',
        patientBirthDate: '1987-01-28', asOfDate: today(), subscriberRelationship: '18',
      });
      const [provider, setProvider]        = useState('availity');
      const [verifying, setVerifying]     = useState(false);
      const [verified, setVerified]       = useState(null);
      const [verifyError, setVerifyError] = useState(null);
      const [checking, setChecking]       = useState(false);
      const [eligResults, setEligResults] = useState(null);
      const DEFAULT_AI_PROMPT =
        'Create a detailed benefits summary table for each procedure code listed. ' +
        'Columns: Code, Description, Benefit Class, Coverage Status, Est. Ins. Pays, ' +
        'Est. Patient Pays (copay / coinsurance), Deductible Remaining, OOP Remaining, ' +
        'Prior Auth Required, IN / OON. ' +
        'Then add action notes for the billing team at the bottom.';
      const [aiPrompt, setAiPrompt]           = useState(DEFAULT_AI_PROMPT);
      const [aiReport, setAiReport]           = useState(null);
      const [aiReportLoading, setAiReportLoading] = useState(false);
      const [aiReportError, setAiReportError] = useState(null);
      const [npiQuery, setNpiQuery]       = useState('1710749189'); // matches default providerNpi
      const DEFAULT_CODES = 'D0140, D0150, D0160, D0330, D0367, D4266, D4267, D6010, D6011, D6012, D6096, D6104, D7210, D7220, D7230, D7240, D7250, D7251, D7860, D7880, D7921, D7922, D7951, D7952, D7953, D9222, D9223, D9230, D9239, D9243, D9248, D9610, D9612, D9613';
      const [cptCdtInput, setCptCdtInput] = useState(DEFAULT_CODES);
      const parsedCodes = cptCdtInput
        .split(/[\s,;\n]+/)
        .map(s => s.trim().toUpperCase())
        .filter(s => /^(D\d{4}|\d{5}|[A-HJ-NP-Z]\d{4}|[A-Z]{2,3})$/.test(s));

      // Derive service types automatically from the entered codes — no manual selection
      const selectedTypes = mapCodesToServiceTypes(parsedCodes);

      const generateAIReport = (cacheKey, prompt) => {
        if (!cacheKey) return;
        setAiReportLoading(true);
        setAiReportError(null);
        const controller = new AbortController();
        const tid = setTimeout(() => controller.abort(), 240000);
        fetch(`${API}/api/ai/report-from-db`, {
          method : 'POST',
          headers: { 'Content-Type': 'application/json' },
          signal : controller.signal,
          body   : JSON.stringify({ cacheKey, userPrompt: prompt, codes: parsedCodes }),
        })
          .then(async r => {
            const ct = r.headers.get('content-type') || '';
            if (!ct.includes('application/json')) {
              const text = await r.text();
              throw new Error(`Server error ${r.status}: ${text.replace(/<[^>]+>/g,'').trim().slice(0,200)}`);
            }
            return r.json();
          })
          .then(data => {
            if (data.detail) { setAiReportError(data.detail); return; }
            setAiReport(data);
            // Auto-save
            fetch(`${API}/api/reports/save`, {
              method : 'POST',
              headers: { 'Content-Type': 'application/json' },
              body   : JSON.stringify({
                cacheKey,
                reportType:  'ai_report',
                prompt,
                codes:       parsedCodes,
                columns:     data.columns || [],
                rows:        data.rows    || [],
                notes:       data.notes   || [],
                actionFlags: [],
                model:       data.model   || '',
                patientName: data.patient || '',
                payerName:   data.payer   || '',
              }),
            }).catch(() => {});
          })
          .catch(e => setAiReportError(e.name === 'AbortError' ? 'AI report timed out — try again' : e.message))
          .finally(() => { clearTimeout(tid); setAiReportLoading(false); });
      };

      // Sync AI report state up to App so it can display in its own tab
      const regenRef = useRef(null);
      regenRef.current = () => { if (eligResults?.cacheKey) generateAIReport(eligResults.cacheKey, aiPrompt); };
      useEffect(() => {
        if (onReportUpdate) onReportUpdate({ report: aiReport, loading: aiReportLoading, error: aiReportError, regenerate: () => regenRef.current && regenRef.current() });
      }, [aiReport, aiReportLoading, aiReportError]);

      // Keep App's providerNpi in sync so the Provider tab always shows the current NPI
      useEffect(() => { if (onNpiChange) onNpiChange(npiQuery); }, [npiQuery]);


      const set = (key) => (val) => {
        setForm(f => ({ ...f, [key]: val }));
        if (key === 'providerNpi') {
          const trimmed = val.trim();
          if (/^\d{10}$/.test(trimmed)) setNpiQuery(trimmed);
          else setNpiQuery('');
        }
      };

      const handleVerify = async (forceRefresh = false) => {
        setVerifying(true);
        setVerified(null);
        setVerifyError(null);
        setEligResults(null);
        try {
          const url = provider === 'stedi'
            ? `${API}/api/member/stedi/verify`
            : `${API}/api/member/verify?force_refresh=${forceRefresh}`;
          const res = await fetch(url, {
            method : 'POST',
            headers: { 'Content-Type': 'application/json' },
            body   : JSON.stringify({ ...form, serviceTypes: selectedTypes }),
          });
          const data = await res.json();
          if (!res.ok) {
            const detail = data.detail;
            const msg = Array.isArray(detail)
              ? detail.map(d => d.msg || JSON.stringify(d)).join('; ')
              : (typeof detail === 'string' ? detail : 'Server error');
            throw new Error(msg);
          }
          if (data.found) {
            setVerified(data);
          } else {
            setVerifyError(data.errors || [{ message: 'Unknown error' }]);
          }
        } catch (e) {
          setVerifyError([{ message: typeof e.message === 'string' ? e.message : JSON.stringify(e.message) }]);
        } finally {
          setVerifying(false);
        }
      };

      const handleEligibility = async (forceRefresh = false) => {
        setChecking(true);
        setEligResults(null);
        setAiReport(null);
        setAiReportError(null);
        try {
          const res = await fetch(`${API}/api/member/eligibility?force_refresh=${forceRefresh}`, {
            method : 'POST',
            headers: { 'Content-Type': 'application/json' },
            body   : JSON.stringify({ ...form, serviceTypes: selectedTypes }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || 'Server error');
          setEligResults(data);
          const ck = data.cacheKey;
          if (ck) {
            // If from cache, try to recall a saved report first
            if (data.fromCache) {
              const saved = await fetch(`${API}/api/reports/${encodeURIComponent(ck)}`)
                .then(r => r.ok ? r.json() : { reports: [] }).catch(() => ({ reports: [] }));
              const reports = saved.reports || [];
              if (reports.length > 0) {
                const latest = reports[reports.length - 1];
                // Restore CPT codes that were used to generate the saved report
                if (latest.codes && latest.codes.length > 0)
                  setCptCdtInput(latest.codes.join(', '));
                // Fetch memberDetails from cache so the PDF cover page is populated
                const mdRes = await fetch(`${API}/api/cache/${encodeURIComponent(ck)}/member-details`)
                  .then(r => r.ok ? r.json() : {}).catch(() => ({}));
                setAiReport({
                  ...latest,
                  memberDetails: mdRes.memberDetails || {},
                  patient: latest.patientName || "",
                  payer  : latest.payerName   || "",
                });
                return;
              }
            }
            // No saved report — generate fresh
            generateAIReport(ck, aiPrompt);
          }
        } catch (e) {
          setVerifyError([{ message: e.message }]);
        } finally {
          setChecking(false);
        }
      };

      return (
        <div className="flex-1 min-h-0 grid grid-cols-1 lg:grid-cols-[310px_1fr] gap-3 overflow-hidden">
          {/* ── Left: Form ── */}
          <div className="min-h-0 overflow-y-auto pr-1 space-y-2 pb-2">
            {/* ── Provider selector ── */}
            <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-2.5 flex items-center gap-3">
              <span className="text-[10px] font-bold text-gray-500 uppercase tracking-widest whitespace-nowrap">Eligibility Via</span>
              <div className="flex gap-2 flex-1">
                {[
                  { id: 'availity', label: 'Availity', icon: '🏥' },
                  { id: 'stedi',    label: 'Stedi',    icon: '⚡' },
                ].map(({ id, label, icon }) => (
                  <label key={id} className={`flex items-center gap-1.5 cursor-pointer px-3 py-1 rounded-lg border transition text-xs font-semibold select-none ${
                    provider === id
                      ? 'bg-brand text-white border-brand shadow-sm'
                      : 'bg-white text-gray-600 border-gray-200 hover:border-brand hover:text-brand'
                  }`}>
                    <input type="radio" name="provider" value={id} checked={provider === id}
                      onChange={() => { setProvider(id); setVerified(null); setVerifyError(null); setEligResults(null); }}
                      className="sr-only"/>
                    {icon} {label}
                  </label>
                ))}
              </div>
            </div>

            <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-3 space-y-2">
              <h2 className="text-xs font-bold text-gray-700 uppercase tracking-wide">Member Information</h2>

              <div className="grid grid-cols-2 gap-1.5">
                <div className="col-span-2 flex gap-1.5 items-end">
                  <div className="flex-1">
                    <Input label="Payer ID" value={form.payerId} onChange={set('payerId')} required placeholder="e.g. G00621"/>
                  </div>
                  <button
                    onClick={() => onPayerLookup(form.payerId)}
                    className="text-[10px] text-brand border border-brand rounded-md px-2 py-1 hover:bg-brand-light transition whitespace-nowrap"
                  >
                    Look Up
                  </button>
                </div>
                <div className="col-span-2">
                  <Input label="Member ID" value={form.memberId} onChange={set('memberId')} required placeholder="e.g. CYL805239155"/>
                </div>
                <Input label="First Name" value={form.patientFirstName} onChange={set('patientFirstName')} placeholder="optional — for mismatch check"/>
                <Input label="Last Name"  value={form.patientLastName}  onChange={set('patientLastName')}  placeholder="optional"/>
                <Input label="Date of Birth" value={form.patientBirthDate} onChange={set('patientBirthDate')} type="date" hint="Optional"/>
                <Input label="As of Date"    value={form.asOfDate}          onChange={set('asOfDate')}          type="date" required/>
                <div className="col-span-2">
                  <Input label="Provider NPI" value={form.providerNpi} onChange={set('providerNpi')} required placeholder="10-digit NPI"/>
                </div>
                <div className="flex flex-col gap-0.5">
                  <Input label="Provider Type" value={form.providerType} onChange={set('providerType')} placeholder="e.g. AT or H" hint="AT=Professional · H=Institutional"/>
                </div>
                <div className="flex flex-col gap-0.5">
                  <label className="text-[10px] font-semibold text-gray-600 uppercase tracking-wide">Place of Service</label>
                  <select value={form.placeOfService} onChange={e => set('placeOfService')(e.target.value)}
                    className="w-full border border-gray-200 rounded-md px-2.5 py-1 text-xs focus:outline-none focus:ring-2 focus:ring-brand">
                    <option value="11">11 — Office</option>
                    <option value="21">21 — Inpatient Hospital</option>
                    <option value="22">22 — Outpatient Hospital</option>
                    <option value="23">23 — Emergency Room</option>
                    <option value="31">31 — Skilled Nursing</option>
                    <option value="32">32 — Nursing Facility</option>
                    <option value="">— Leave blank (not required)</option>
                  </select>
                </div>
                <div className="col-span-2 flex items-end gap-2">
                  <div className="flex-1">
                    <label className="text-xs font-semibold text-gray-600 uppercase tracking-wide">Relationship</label>
                    <select value={form.subscriberRelationship} onChange={e => set('subscriberRelationship')(e.target.value)}
                      className="mt-0.5 w-full border border-gray-200 rounded-md px-2.5 py-1 text-xs focus:outline-none focus:ring-2 focus:ring-brand">
                      <option value="18">18 — Self</option>
                      <option value="01">01 — Spouse</option>
                      <option value="19">19 — Child</option>
                      <option value="G8">G8 — Other</option>
                    </select>
                  </div>
                  <button
                    onClick={() => handleVerify(false)}
                    disabled={verifying || !form.payerId || !form.memberId}
                    className="bg-brand hover:bg-brand-dark text-white font-bold px-4 py-1.5 rounded-lg transition disabled:opacity-60 flex items-center gap-1.5 text-xs shadow-sm whitespace-nowrap"
                  >
                    {verifying ? <><Spinner/> Looking Up…</> : 'Look Up Member'}
                  </button>
                </div>
              </div>
            </div>

            {/* Provider card lives in the Provider tab */}

            {/* CDT / CPT Code input */}
            <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-3 space-y-1.5">
              <div className="flex items-center justify-between">
                <h2 className="text-xs font-bold text-gray-700 uppercase tracking-wide">CPT/CDT</h2>
                {parsedCodes.length > 0 && (
                  <span className="text-xs bg-indigo-100 text-indigo-700 font-semibold px-2 py-0.5 rounded-full">
                    {parsedCodes.length} code{parsedCodes.length !== 1 ? 's' : ''}
                  </span>
                )}
              </div>

              <textarea
                value={cptCdtInput}
                onChange={e => setCptCdtInput(e.target.value)}
                placeholder={'D0120, D1110, 99214, L3000\nor one per line:\nD7210\nMH\nUC'}
                rows={4}
                className="w-full border border-gray-200 rounded-md px-2.5 py-1 text-xs font-mono focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent transition resize-none text-gray-700 placeholder-gray-300"
              />

              {/* Auto-derived service types — read-only, informational */}
              {selectedTypes.length > 0 && (
                <div className="space-y-1">
                  <p className="text-[9px] font-bold text-gray-400 uppercase tracking-widest">Auto-selected service types</p>
                  <div className="flex flex-wrap gap-1">
                    {selectedTypes.map(code => (
                      <span key={code} className="text-[10px] px-2 py-0.5 rounded-full border bg-brand text-white border-brand font-medium">
                        {code} — {(SERVICE_TYPE_OPTIONS.find(o => o.code === code) || {}).label || code}
                      </span>
                    ))}
                  </div>
                </div>
              )}

              {/* Code pills with remove button */}
              {parsedCodes.length > 0 && (
                <div className="flex flex-wrap gap-1.5 pt-0.5">
                  {parsedCodes.map((c, i) => (
                    <span key={i} className="inline-flex items-center gap-1 bg-indigo-50 border border-indigo-100 text-indigo-700 text-xs font-mono font-semibold px-2 py-0.5 rounded-full">
                      {c}
                      <button onClick={() => {
                        const remaining = cptCdtInput.split(/[\s,;\n]+/).filter(s => s.trim().toUpperCase() !== c).join(', ');
                        setCptCdtInput(remaining);
                      }} className="ml-0.5 text-indigo-400 hover:text-indigo-700 font-bold leading-none">×</button>
                    </span>
                  ))}
                </div>
              )}
            </div>

            <p className="text-center text-xs text-gray-400">
              Payer ID + Member ID required &middot; Name &amp; DOB optional (shown for mismatch check)
            </p>

            {/* Patient history browser */}
            <CachedPatientsPanel onSelect={(p) => {
              setForm(f => ({
                ...f,
                payerId          : p.payerId         || f.payerId,
                memberId         : p.memberId         || f.memberId,
                patientFirstName : p.memberFirstName  || f.patientFirstName,
                patientLastName  : p.memberLastName   || f.patientLastName,
                patientBirthDate : p.memberDob        || f.patientBirthDate,
                providerNpi      : p.providerNpi      || f.providerNpi,
              }));
            }}/>
          </div>

          {/* ── Right: Results panel ── */}
          <div className="min-h-0 overflow-y-auto space-y-3 min-w-0 pb-2">

            {/* Error display */}
            {verifyError && (
              <div className="fade-in bg-red-50 border border-red-200 rounded-xl p-3 space-y-2">
                <p className="font-bold text-red-700 text-base">Member Not Found</p>
                <div className="space-y-2">
                  {verifyError.map((e, i) => {
                    const codeStr = String(e.code || '');
                    const guide = ERROR_GUIDE[codeStr] || ERROR_GUIDE[codeStr.padStart(2,'0')];
                    return (
                      <div key={i} className="bg-white rounded-xl border border-red-100 p-3">
                        {codeStr && (
                          <div className="flex items-center gap-2 mb-1">
                            <span className="font-mono text-xs font-bold bg-red-100 text-red-700 px-2 py-0.5 rounded">Code {codeStr}</span>
                          </div>
                        )}
                        <p className="text-sm font-medium text-red-700">{e.message}</p>
                        {guide && <p className="text-xs text-red-500 mt-0.5">→ {guide}</p>}
                      </div>
                    );
                  })}
                </div>
                <div className="bg-red-100/50 rounded-xl p-3 text-xs text-red-600 space-y-1">
                  <p className="font-semibold">Common fix actions:</p>
                  <p>• <strong>Code 41</strong>: Use the correct payer ID — check "Payer Lookup" tab</p>
                  <p>• <strong>Code 71</strong>: Correct the Date of Birth to match the insurance card</p>
                  <p>• <strong>Code 72/73</strong>: Enter name exactly as it appears on the insurance card</p>
                  <p>• <strong>400 error</strong>: Try adding Provider Type (<code className="bg-red-200 px-0.5 rounded">AT</code> or <code className="bg-red-200 px-0.5 rounded">H</code>)</p>
                </div>
              </div>
            )}

            {/* Member cache status banner */}
            {verified && (
              <CacheBadge
                fromCache={verified.fromCache}
                cachedAt={verified.cachedAt}
                expiresAt={verified.expiresAt}
                onRefresh={verified.fromCache ? () => handleVerify(true) : null}
              />
            )}

            {/* Member card */}
            {verified && (
              <MemberCard
                data={verified}
                loading={checking}
                onProceed={() => handleEligibility(false)}
              />
            )}

            {/* AI Report prompt — sits below the Proceed button */}
            <div className="bg-white rounded-xl shadow-sm border border-indigo-100 p-3 space-y-1.5">
              <div className="flex items-center gap-2">
                <span className="text-[10px] font-bold text-indigo-600 uppercase tracking-widest">AI Report Prompt</span>
                <span className="text-[9px] text-gray-400">auto-runs after eligibility check</span>
              </div>
              <textarea
                value={aiPrompt}
                onChange={e => setAiPrompt(e.target.value)}
                rows={3}
                className="w-full border border-indigo-100 rounded-md px-2.5 py-1 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent transition resize-none text-gray-700 placeholder-gray-300"
                placeholder="Describe the report you want…"
              />
            </div>

            {/* Stedi rich eligibility details — shown directly when Stedi is the provider */}
            {verified && provider === 'stedi' && (
              <StediEligibilityCard data={verified} />
            )}

            {/* AI Report generates in background — see AI Report tab */}
            {aiReportLoading && (
              <div className="fade-in flex items-center gap-2 px-4 py-2.5 bg-indigo-50 border border-indigo-100 rounded-xl text-xs text-indigo-600">
                <Spinner/> Generating AI report — switching to AI Report tab when ready…
              </div>
            )}

            {/* Full eligibility summary — shown only after the multi-service check runs */}
            {eligResults && <EligibilitySummaryCard eligResults={eligResults}/>}

            {/* Eligibility cache banner */}
            {eligResults && (
              <CacheBadge
                fromCache={eligResults.fromCache}
                cachedAt={eligResults.cachedAt}
                expiresAt={eligResults.expiresAt}
                onRefresh={eligResults.fromCache ? () => handleEligibility(true) : null}
              />
            )}

            {/* Eligibility results — full width */}
            {eligResults && (
              <ResultsTable
                results={eligResults.results}
                skipped={eligResults.skipped}
                memberData={verified}
                cachedCount={eligResults.cachedCount || 0}
                freshCount={eligResults.freshCount || 0}
              />
            )}

            {/* Empty state */}
            {!verified && !verifyError && (
              <div className="flex flex-col items-center justify-center h-48 text-gray-300 space-y-2">
                <svg className="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1} d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                </svg>
                <p className="text-sm">Enter Payer ID + Member ID and click Look Up</p>
                <p className="text-xs text-gray-300">Name &amp; DOB are optional — payer will show what's on file</p>
              </div>
            )}
          </div>
        </div>
      );
    };

    // ── Payer Lookup Tab ─────────────────────────────────────────────

    const PayerLookup = ({ initialId = '' }) => {
      const [query, setQuery]       = useState(initialId);
      const [mode, setMode]         = useState('name');   // 'name' | 'id'
      const [loading, setLoading]   = useState(false);
      const [results, setResults]   = useState(null);
      const [selected, setSelected] = useState(null);
      const [cfgLoading, setCfgLoading] = useState(false);
      const [payerCfg, setPayerCfg]   = useState(null);

      useEffect(() => {
        if (initialId) {
          setQuery(initialId);
          setMode('id');
        }
      }, [initialId]);

      const search = async () => {
        if (!query.trim()) return;
        setLoading(true);
        setResults(null);
        setSelected(null);
        setPayerCfg(null);
        try {
          const endpoint = mode === 'name'
            ? `${API}/api/payer/search?name=${encodeURIComponent(query)}`
            : `${API}/api/payer/search?name=${encodeURIComponent(query)}`;
          const res  = await fetch(endpoint);
          const data = await res.json();
          setResults(data.payers || []);
        } catch (e) {
          setResults([]);
        } finally {
          setLoading(false);
        }
      };

      const lookupConfig = async (payerId) => {
        setCfgLoading(true);
        setSelected(payerId);
        setPayerCfg(null);
        try {
          const res  = await fetch(`${API}/api/payer/lookup?id=${encodeURIComponent(payerId)}`);
          const data = await res.json();
          setPayerCfg(data);
        } catch (e) {}
        finally { setCfgLoading(false); }
      };

      const handleKey = (e) => { if (e.key === 'Enter') search(); };

      return (
        <div className="space-y-5">
          {/* Search bar */}
          <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
            <h2 className="text-sm font-bold text-gray-800 mb-2">Payer Directory Search</h2>
            <div className="flex gap-2">
              <div className="flex rounded-lg border border-gray-200 overflow-hidden text-sm">
                <button
                  onClick={() => setMode('name')}
                  className={`px-3 py-2 transition ${mode === 'name' ? 'bg-brand text-white' : 'text-gray-500 hover:bg-gray-50'}`}
                >
                  By Name
                </button>
                <button
                  onClick={() => setMode('id')}
                  className={`px-3 py-2 transition ${mode === 'id' ? 'bg-brand text-white' : 'text-gray-500 hover:bg-gray-50'}`}
                >
                  By ID
                </button>
              </div>
              <input
                value={query}
                onChange={e => setQuery(e.target.value)}
                onKeyDown={handleKey}
                placeholder={mode === 'name' ? 'e.g. Delta Dental, Aetna, Blue Cross…' : 'e.g. DDTX1, G00621…'}
                className="flex-1 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand"
              />
              <button
                onClick={search}
                disabled={loading}
                className="bg-brand text-white px-4 py-2 rounded-lg font-semibold text-sm hover:bg-brand-dark transition disabled:opacity-60 flex items-center gap-2"
              >
                {loading ? <Spinner/> : '🔍'} Search
              </button>
            </div>
            <p className="text-xs text-gray-400 mt-2">
              {results !== null ? `${results.length} payer(s) found` : 'Enter a payer name or ID to search the Availity directory'}
            </p>
          </div>

          {/* Results */}
          {results !== null && results.length === 0 && (
            <div className="text-center text-gray-400 py-8">No payers matched your search.</div>
          )}

          {results && results.length > 0 && (
            <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
              <table className="w-full text-sm">
                <thead>
                  <tr className="bg-gray-50 text-gray-500 text-xs uppercase tracking-wide">
                    <th className="text-left px-4 py-2.5 w-28">Payer ID</th>
                    <th className="text-left px-4 py-2.5">Payer Name</th>
                    <th className="text-left px-4 py-2.5">Transactions</th>
                    <th className="text-right px-4 py-2.5 w-24">Config</th>
                  </tr>
                </thead>
                <tbody>
                  {results.map((p, i) => (
                    <tr
                      key={i}
                      className={`border-t border-gray-100 hover:bg-blue-50/40 transition cursor-pointer ${selected === p.payerId ? 'bg-brand-light' : ''}`}
                      onClick={() => lookupConfig(p.payerId)}
                    >
                      <td className="px-4 py-2 font-mono font-semibold text-brand">{p.payerId}</td>
                      <td className="px-4 py-2 text-gray-800">{p.payerName}</td>
                      <td className="px-4 py-2 text-gray-500 text-xs">{(p.transactions || []).join(', ')}</td>
                      <td className="px-4 py-2 text-right">
                        <button
                          onClick={e => { e.stopPropagation(); lookupConfig(p.payerId); }}
                          className="text-xs text-brand font-semibold hover:underline"
                        >
                          View Config
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {/* Payer config panel */}
          {cfgLoading && (
            <div className="flex items-center gap-2 text-gray-400 text-sm"><Spinner/> Loading payer configuration…</div>
          )}

          {payerCfg && (
            <div className="fade-in bg-white rounded-2xl shadow-sm border border-gray-100 p-5 space-y-4">
              <div>
                <p className="text-base font-bold text-gray-900">{payerCfg.payerName || payerCfg.payerId}</p>
                <p className="text-sm text-gray-500 font-mono">ID: {payerCfg.payerId}</p>
              </div>

              {payerCfg.disallowedFields && payerCfg.disallowedFields.length > 0 && (
                <div>
                  <p className="text-xs font-semibold text-red-600 uppercase tracking-wide mb-1">Unsupported / Disallowed Fields</p>
                  <div className="flex flex-wrap gap-1.5">
                    {payerCfg.disallowedFields.map(f => (
                      <span key={f} className="bg-red-50 text-red-700 border border-red-100 text-xs px-2 py-0.5 rounded-full">{f}</span>
                    ))}
                  </div>
                </div>
              )}

              <div>
                <p className="text-xs font-semibold text-green-700 uppercase tracking-wide mb-1">
                  Supported Service Types ({payerCfg.serviceTypes?.length || 0})
                </p>
                <div className="flex flex-wrap gap-1.5 max-h-48 overflow-y-auto">
                  {(payerCfg.serviceTypes || []).map(c => (
                    <span key={c} className="bg-green-50 text-green-800 border border-green-100 text-xs px-2 py-0.5 rounded-full">
                      {c} — {payerCfg.serviceTypeLabels?.[c] || c}
                    </span>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // ── Prior Auth / Referral Lookup Tab ──────────────────────────────
    // Reads payer_pa_workbooks_2026/*.xlsx via /api/pa/payers + /api/pa/lookup.

    const PA_STATUS_STYLE = {
      Y:      { label: 'Required',      cls: 'bg-red-50 text-red-700 border-red-100' },
      N:      { label: 'Not Required',  cls: 'bg-green-50 text-green-700 border-green-100' },
      NOTIFY: { label: 'Notify Only',   cls: 'bg-amber-50 text-amber-700 border-amber-100' },
    };

    const PaStatusBadge = ({ value }) => {
      const key = String(value || '').trim().toUpperCase();
      const style = PA_STATUS_STYLE[key] || { label: value ? String(value) : 'Unknown', cls: 'bg-gray-50 text-gray-500 border-gray-200' };
      return (
        <span className={`inline-block text-xs font-bold px-2.5 py-1 rounded-full border ${style.cls}`}>
          {style.label}
        </span>
      );
    };

    const PriorAuthLookup = () => {
      const [payers, setPayers]       = useState([]);
      const [payersLoading, setPayersLoading] = useState(false);
      const [payerKey, setPayerKey]   = useState('');
      const [cpt, setCpt]             = useState('');
      const [loading, setLoading]     = useState(false);
      const [result, setResult]       = useState(null);
      const [error, setError]         = useState('');

      const loadPayers = () => {
        setPayersLoading(true);
        fetch(`${API}/api/pa/payers`)
          .then(r => r.json())
          .then(d => setPayers(d.payers || []))
          .catch(() => setPayers([]))
          .finally(() => setPayersLoading(false));
      };

      useEffect(() => { loadPayers(); }, []);

      const runLookup = () => {
        if (!payerKey || !cpt.trim()) return;
        setLoading(true);
        setError('');
        setResult(null);
        fetch(`${API}/api/pa/lookup?payer=${encodeURIComponent(payerKey)}&cpt=${encodeURIComponent(cpt.trim())}`)
          .then(async r => {
            if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || 'Lookup failed');
            return r.json();
          })
          .then(setResult)
          .catch(e => setError(e.message || 'Lookup failed'))
          .finally(() => setLoading(false));
      };

      const handleKey = (e) => { if (e.key === 'Enter') runLookup(); };

      return (
        <div className="space-y-5">
          {/* Search bar */}
          <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
            <h2 className="text-sm font-bold text-gray-800 mb-2">Prior Auth &amp; Referral Lookup</h2>
            <p className="text-xs text-gray-400 mb-3">Select a payer and enter a CPT/HCPCS code to check prior authorization and referral requirements, sourced from the payer PA workbooks.</p>
            <div className="flex gap-2 flex-wrap">
              <select
                value={payerKey}
                onChange={e => setPayerKey(e.target.value)}
                className="flex-1 min-w-[220px] border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand bg-white"
              >
                <option value="">{payersLoading ? 'Loading payers…' : 'Select a payer…'}</option>
                {payers.map(p => (
                  <option key={p.payerKey} value={p.payerKey}>
                    {p.payerName}{p.category ? ` — ${p.category}` : ''} ({p.codeCount} code{p.codeCount === 1 ? '' : 's'} on file)
                  </option>
                ))}
              </select>
              <input
                value={cpt}
                onChange={e => setCpt(e.target.value)}
                onKeyDown={handleKey}
                placeholder="CPT/HCPCS code, e.g. 70551"
                className="w-56 border border-gray-200 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-brand"
              />
              <button
                onClick={runLookup}
                disabled={loading || !payerKey || !cpt.trim()}
                className="bg-brand text-white px-4 py-2 rounded-lg font-semibold text-sm hover:bg-brand-dark transition disabled:opacity-60 flex items-center gap-2"
              >
                {loading ? <Spinner/> : '🔎'} Check
              </button>
            </div>
          </div>

          {error && (
            <div className="bg-red-50 border border-red-100 text-red-700 text-sm rounded-xl px-4 py-3">{error}</div>
          )}

          {result && (
            <div className="fade-in space-y-4">
              <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
                <div className="flex items-start justify-between flex-wrap gap-2">
                  <div>
                    <p className="text-base font-bold text-gray-900">{result.payerName}</p>
                    <p className="text-sm text-gray-500 font-mono">CPT/HCPCS: {result.cptCode}</p>
                  </div>
                </div>

                {!result.hasAnyData && (
                  <div className="mt-3 bg-amber-50 border border-amber-100 text-amber-800 text-sm rounded-xl px-4 py-3">
                    No PA/referral code data has been loaded for <strong>{result.payerName}</strong> yet — the workbook for this payer hasn't been populated with codes.
                    Verify manually via the source below.
                  </div>
                )}

                {result.hasAnyData && !result.found && (
                  <div className="mt-3 bg-amber-50 border border-amber-100 text-amber-800 text-sm rounded-xl px-4 py-3">
                    CPT/HCPCS <strong>{result.cptCode}</strong> was not found on {result.payerName}'s current PA code list.
                    This may mean no prior auth is required, or the list simply hasn't been updated with this code yet — verify via the source below.
                  </div>
                )}

                {result.found && (
                  <div className="mt-4 space-y-3">
                    {result.matches.map((m, i) => (
                      <div key={i} className="border border-gray-100 rounded-xl p-4 bg-gray-50/60">
                        <div className="flex items-center justify-between flex-wrap gap-2 mb-2">
                          <p className="text-sm font-semibold text-gray-800">{m.description || m.cptCode}</p>
                          <div className="flex gap-2">
                            <div className="text-center">
                              <p className="text-[10px] text-gray-400 uppercase tracking-wide mb-0.5">Prior Auth</p>
                              <PaStatusBadge value={m.paRequired}/>
                            </div>
                            <div className="text-center">
